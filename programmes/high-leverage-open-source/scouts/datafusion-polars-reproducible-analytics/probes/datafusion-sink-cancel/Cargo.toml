[package]
name = "fieldwork-datafusion-sink-cancel"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
async-trait = "0.1"
bytes = "1"
datafusion = { path = "../../../../../../.fieldwork/datafusion/datafusion/core", default-features = false, features = ["parquet"] }
futures-util = "0.3"
object_store = { version = "=0.13.2", features = ["tokio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
url = "2"
