[package]
name = "fieldwork-object-store-abort-control"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
async-trait = "0.1"
bytes = "1"
futures-util = "0.3"
object_store = { version = "=0.13.2", features = ["tokio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "macros", "rt-multi-thread"] }
