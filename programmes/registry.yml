version: 1

programmes:
  - id: sdk-integration-lifecycle
    issue: 13
    state: ready
    thesis: SDK research begins by mapping public contracts, internal state, service and provider boundaries, tests, and realistic application behaviour before choosing a narrower hypothesis.
    targets:
      - vercel-ai
      - workers-sdk
      - opentelemetry-js
      - mcp-typescript-sdk
      - supabase
    likely_testbeds:
      - stensibly
      - elatura
      - fin-agent
      - smolrunner
    scouts:
      - id: vercel-ai-stream-tool-lifecycle
        issue: 17
        target: vercel-ai
        state: claimed
      - id: workers-local-remote-lifecycle
        issue: 18
        target: workers-sdk
        state: ready
      - id: otel-context-lifecycle-boundaries
        issue: 19
        target: opentelemetry-js
        state: claimed
      - id: mcp-transport-session-lifecycle
        issue: 20
        target: mcp-typescript-sdk
        state: ready
      - id: supabase-client-runtime-contracts
        issue: 21
        target: supabase
        state: ready

  - id: agent-cli-execution
    issue: 14
    state: ready
    thesis: Agent and CLI research begins with execution architecture, permissions, state, tools, processes, terminal behaviour, tests, and real workflows before selecting specific failure modes.
    targets:
      - gemini-cli
      - codex
    likely_testbeds:
      - stensibly
      - smolrunner
      - terminal-kit
    scouts:
      - id: gemini-tool-session-recovery
        issue: 22
        target: gemini-cli
        state: ready
      - id: codex-tool-terminal-lifecycle
        issue: 23
        target: codex
        state: ready
      - id: cross-agent-process-terminal-semantics
        issue: 24
        targets: [gemini-cli, codex]
        state: ready

  - id: web-tooling-runtime-correctness
    issue: 15
    state: ready
    thesis: Web tooling research begins with architecture, source and state transformations, project graphs, execution modes, tests, and realistic projects before selecting specific correctness or performance questions.
    targets:
      - vite
      - playwright
      - biome
      - workers-sdk
    likely_testbeds:
      - elatura
      - scrapbook
      - renderprove
      - proofwake
    scouts:
      - id: vite-plugin-hmr-invalidation
        issue: 25
        target: vite
        state: ready
      - id: playwright-execution-isolation-artifacts
        issue: 26
        target: playwright
        state: claimed
      - id: biome-transform-and-fix-safety
        issue: 27
        target: biome
        state: ready

  - id: data-durable-workflows
    issue: 16
    state: ready
    thesis: Data-system research begins by mapping query, storage, transaction, state, background-work, resource, recovery, and integration architecture before selecting a narrower hypothesis.
    targets:
      - duckdb
      - supabase
    likely_testbeds:
      - narrative-duckdb
      - bsc-compare
      - fin-agent
      - stensibly
      - smolrunner
    scouts:
      - id: duckdb-query-storage-failure-boundaries
        issue: 28
        target: duckdb
        state: ready
      - id: owned-durable-workflow-architecture
        issue: 29
        target: unresolved-until-scout
        state: claimed

notes:
  - Programmes are broad directions, not default hypotheses or permission to contact upstream projects.
  - Scouts first map the system and may add narrower experiments only after evidence identifies a useful boundary.
  - Scout lanes may be added or stopped after reconnaissance changes the lay of the land.
  - A target may participate in several programmes when the questions are genuinely different.
  - Testbed labels are created only after a real trial begins and must not be pre-created from likely_testbeds.
