schema_version: 1

patterns:
  - id: stream-lifecycle
    state: candidate
    question: How do partial delivery, reconnection, duplication, ordering, and terminal state interact in streamed workflows?
    possible_case_packs:
      - playgrounds/cases/event-sequences.json
      - playgrounds/cases/malformed-streams.json

  - id: cancellation-timeout
    state: candidate
    question: Which component owns cancellation, timeout, cleanup, and final state?
    possible_case_packs:
      - playgrounds/cases/event-sequences.json

  - id: trace-correlation
    state: candidate
    question: Does one logical operation remain attributable across services, asynchronous work, partial failure, and handoffs?
    primary_source_leads:
      - https://www.w3.org/TR/trace-context/
      - https://opentelemetry.io/docs/specs/semconv/http/

  - id: schema-evolution
    state: candidate
    question: How do producers, consumers, stored records, and rolling deployments behave across incompatible or partially compatible schema changes?

  - id: cache-consistency
    state: candidate
    question: Which freshness, invalidation, identity, and authorization assumptions are preserved or violated by caching?

  - id: job-recovery
    state: candidate
    question: What state must survive interruption so a job can resume or reconcile correctly?

  - id: filesystem-boundaries
    state: candidate
    question: How do path normalization, case sensitivity, reserved names, traversal, and atomic replacement affect a larger workflow?
    possible_case_packs:
      - playgrounds/cases/path-boundaries.json

notes:
  - A registry entry is not an assignment or endorsement.
  - Promote a candidate only when a concrete investigation needs its wider context.
  - Context patterns must not become default hypotheses for unrelated research.
  - Document actual target usage separately from illustrative architecture.
  - Source leads are starting points; workers must verify current versions and record retrieval dates.
