version: 1

# Stable issue number, batch assignment, campaign lane, review task, or other
# durable assignment identifier.
assignment: ""

# Load only the profiles needed for this task.
profiles:
  - research

# Canonical records the worker must read before substantial work.
canonical_records:
  issues: []
  findings: []
  implementation_pull_requests: []
  evidence_paths: []

# Problem participation may be non-exclusive. This lease controls mutation of
# one branch, shared file, manifest, canonical finding edit, or other artifact.
# A lease cannot be treated as current without an exact artifact identity,
# freshness fields, and a named stale condition.
writer_lease:
  worker: ""
  artifact:
    repository: ""
    ref_or_path: ""
    head_or_generation: ""
  state: active
  acquired_at: ""
  last_confirmed_at: ""
  stale_after: ""
  transfer_record: null

source_boundary:
  repository: ""
  revision_or_retrieval_boundary: ""
  checked_at: ""

claim_scope: mechanism

expected_deliverable: ""
stop_condition: ""

# One exact issue, PR, or finding where material routing events belong.
reporting_sink: ""

# Authority does not follow from technical readiness. Every authorized action
# must name its authorizing source, bounded scope, and expiry or revocation
# condition. `denied` is the safe default; a bare boolean is invalid.
authority:
  merge:
    state: denied
    source: null
    scope: null
    valid_until_or_revocation: null
  release:
    state: denied
    source: null
    scope: null
    valid_until_or_revocation: null
  deploy:
    state: denied
    source: null
    scope: null
    valid_until_or_revocation: null
  upstream_contact:
    state: denied
    source: null
    scope: null
    valid_until_or_revocation: null
  private_or_production_data:
    state: denied
    source: null
    scope: null
    valid_until_or_revocation: null
  material_spending:
    state: denied
    source: null
    scope: null
    valid_until_or_revocation: null

# Optional known dependencies and exclusions keep parallel workers from
# silently widening the assignment.
dependencies: []
exclusions: []

# Do not post instruction-intake or first-read reports unless a material
# contradiction, stale premise, authority defect, or blocker is discovered.
report_only_material_changes: true
