name: Research decision
description: Request a bounded human or coordinator decision
title: "[Decision] "
labels:
  - "type:decision"
  - "state:ready"
  - "needs:human-decision"
body:
  - type: markdown
    attributes:
      value: |
        External GitHub issue, pull-request, discussion, and commit links must use `redirect.github.com`. External shorthand is prohibited. This decision record does not authorize upstream contact.
  - type: input
    id: parent
    attributes:
      label: Batch, campaign, or lane
    validations:
      required: true
  - type: textarea
    id: decision
    attributes:
      label: Decision required
      description: State the exact choice that must be made.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence available
    validations:
      required: true
  - type: textarea
    id: options
    attributes:
      label: Options and consequences
    validations:
      required: true
  - type: textarea
    id: default
    attributes:
      label: Safe default if unanswered
    validations:
      required: true
