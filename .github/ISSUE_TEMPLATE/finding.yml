name: Finding
description: Record an observation that may become work
title: "[Finding] "
labels:
  - "type:finding"
  - "state:observed"
body:
  - type: markdown
    attributes:
      value: |
        External GitHub issue, pull-request, discussion, and commit links must use `redirect.github.com`. External shorthand is prohibited. This finding does not authorize upstream contact.
  - type: textarea
    id: observation
    attributes:
      label: Observation
      description: State what was observed without overstating certainty.
    validations:
      required: true
  - type: textarea
    id: consequence
    attributes:
      label: Consequence
      description: Why is this worth understanding?
    validations:
      required: true
  - type: textarea
    id: source
    attributes:
      label: Source, revision, and retrieval date
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Current reproduction evidence
      description: Include environment, revisions, commands, and observed output where available.
  - type: textarea
    id: hypotheses
    attributes:
      label: Initial hypotheses and uncertainty
  - type: checkboxes
    id: quiet
    attributes:
      label: External-reference check
      options:
        - label: External interaction references are wrapped and no upstream contact is authorized.
          required: true
