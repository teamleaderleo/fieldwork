name: Finding
description: Record an observation that may become work
title: "[Finding] "
labels:
  - "type:finding"
  - "state:observed"
body:
  - type: markdown
    attributes:
      value: |
        Add the correct `target:<slug>` label after creation. External GitHub issue, pull-request, discussion, and commit links must use `redirect.github.com`. External shorthand is prohibited. This finding does not authorize upstream contact.
  - type: input
    id: target
    attributes:
      label: Target label and hub
      placeholder: target:vercel-ai — Fieldwork target hub issue 2
    validations:
      required: true
  - type: textarea
    id: simple
    attributes:
      label: In simple words
      description: What is this, where does it sit, what was observed, why could it be useful, and what happens next?
    validations:
      required: true
  - type: textarea
    id: observation
    attributes:
      label: Observation
      description: State what was observed without overstating certainty.
    validations:
      required: true
  - type: textarea
    id: consequence
    attributes:
      label: Consequence
      description: What user, operator, dependant, or system property could be affected?
    validations:
      required: true
  - type: textarea
    id: source
    attributes:
      label: Source, revision, and retrieval date
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Current reproduction or integration evidence
      description: Include environment, revisions, commands, testbed, and observed output where available.
  - type: textarea
    id: hypotheses
    attributes:
      label: Initial hypotheses and uncertainty
  - type: checkboxes
    id: quiet
    attributes:
      label: Boundaries
      options:
        - label: External interaction references are wrapped and no upstream contact is authorized.
          required: true
        - label: This is more than a style, wording, lint, or documentation nit.
          required: true