name: Fieldwork Jotai key-scoped JSON cache

on:
  pull_request:
    paths:
      - '.github/workflows/fieldwork-jotai-key-scoped-json-cache.yml'
      - 'programmes/data-durable-workflows/scouts/jotai-json-storage-key-isolation/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate:
    name: Node.js ${{ matrix.node-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 22
          - 24
          - 26
    steps:
      - name: Check out Fieldwork candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          path: fieldwork
          persist-credentials: false

      - name: Check out exact Jotai source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: pmndrs/jotai
          ref: 56a9cc51de8a5dd762b95a145820f12589cc47c9
          path: jotai
          persist-credentials: false

      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093
        with:
          version: 11.3.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: ${{ matrix.node-version }}

      - name: Apply exact source patch and stage native regression
        run: |
          cd jotai
          git apply --check ../fieldwork/programmes/data-durable-workflows/scouts/jotai-json-storage-key-isolation/candidate.patch
          git apply ../fieldwork/programmes/data-durable-workflows/scouts/jotai-json-storage-key-isolation/candidate.patch
          cp ../fieldwork/programmes/data-durable-workflows/scouts/jotai-json-storage-key-isolation/atomWithStorageKeyIsolation.test.ts \
            tests/react/vanilla-utils/atomWithStorageKeyIsolation.test.ts
          git diff --check

      - name: Install exact repository dependencies
        working-directory: jotai
        run: pnpm install --frozen-lockfile

      - name: Run candidate and existing storage suites
        working-directory: jotai
        run: |
          pnpm vitest run \
            tests/react/vanilla-utils/atomWithStorageKeyIsolation.test.ts \
            tests/react/vanilla-utils/atomWithStorage.test.tsx

      - name: Run changed-file static checks
        working-directory: jotai
        run: |
          pnpm eslint \
            src/vanilla/utils/atomWithStorage.ts \
            tests/react/vanilla-utils/atomWithStorageKeyIsolation.test.ts
          pnpm prettier --check \
            src/vanilla/utils/atomWithStorage.ts \
            tests/react/vanilla-utils/atomWithStorageKeyIsolation.test.ts
          pnpm tsc --noEmit
