name: Fieldwork unit 18 current-main parent stdin

on:
  pull_request:
    paths:
      - ".github/workflows/fieldwork-unit-18-current-main-validation.yml"

permissions:
  contents: read

jobs:
  validate:
    name: Current-main parent stdin on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]

    steps:
      - name: Check out exact execution carrier
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: fieldwork
          persist-credentials: false

      - name: Check out exact Playwright candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: teamleaderleo/playwright
          ref: 10e28dfdd7758d92aeed50922fd9c7ce9596c21c
          fetch-depth: 0
          path: playwright
          persist-credentials: false

      - name: Set up Node 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: playwright/package-lock.json

      - name: Verify exact identities and three-file fence
        shell: bash
        run: |
          set -euo pipefail
          carrier="${{ github.event.pull_request.head.sha }}"
          source="10e28dfdd7758d92aeed50922fd9c7ce9596c21c"
          base="2cc9f3ee7fdd82feb87edb7f24af77442bdc10e2"
          expected=$'packages/playwright-core/src/tools/utils/mcp/http.ts\npackages/playwright-core/src/tools/utils/mcp/server.ts\ntests/mcp/http.spec.ts'

          test "$(git -C fieldwork rev-parse HEAD)" = "$carrier"
          test "$(git -C playwright rev-parse HEAD)" = "$source"
          git -C playwright cat-file -e "$base^{commit}"
          git -C playwright diff --check "$base" "$source"
          test "$(git -C playwright diff --name-only "$base" "$source")" = "$expected"

          mkdir -p fieldwork-receipts
          git -C playwright diff --binary "$base" "$source" > "fieldwork-receipts/unit-18-current-main-${{ matrix.os }}.diff"
          git -C playwright log --format=fuller --reverse "$base..$source" > "fieldwork-receipts/unit-18-current-main-${{ matrix.os }}-commits.txt"

      - name: Install exact dependencies
        working-directory: playwright
        run: npm ci

      - name: Build exact source
        working-directory: playwright
        run: npm run build

      - name: Install Chromium and Linux dependencies
        if: runner.os == 'Linux'
        working-directory: playwright
        run: npx playwright install --with-deps chromium

      - name: Install Chromium
        if: runner.os != 'Linux'
        working-directory: playwright
        run: npx playwright install chromium

      - name: Run complete native MCP HTTP file
        shell: bash
        working-directory: playwright
        env:
          CI: "1"
        run: |
          set -o pipefail
          npm run test-mcp tests/mcp/http.spec.ts -- --project=chromium 2>&1 | tee "../fieldwork-receipts/unit-18-current-main-${{ matrix.os }}-test.log"

      - name: Run focused ESLint
        shell: bash
        working-directory: playwright
        run: |
          npx eslint \
            packages/playwright-core/src/tools/utils/mcp/http.ts \
            packages/playwright-core/src/tools/utils/mcp/server.ts \
            tests/mcp/http.spec.ts

      - name: Verify clean tree and exact diff
        shell: bash
        working-directory: playwright
        run: |
          set -euo pipefail
          source="10e28dfdd7758d92aeed50922fd9c7ce9596c21c"
          base="2cc9f3ee7fdd82feb87edb7f24af77442bdc10e2"
          expected=$'packages/playwright-core/src/tools/utils/mcp/http.ts\npackages/playwright-core/src/tools/utils/mcp/server.ts\ntests/mcp/http.spec.ts'
          test -z "$(git status --short)"
          git diff --check "$base" "$source"
          test "$(git diff --name-only "$base" "$source")" = "$expected"
          {
            echo "carrier=${{ github.event.pull_request.head.sha }}"
            echo "source=$source"
            echo "base=$base"
            echo "platform=${{ matrix.os }}"
            echo "result=success"
          } > "../fieldwork-receipts/unit-18-current-main-${{ matrix.os }}-receipt.txt"

      - name: Upload platform receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: playwright-unit-18-current-main-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: fieldwork-receipts/
          if-no-files-found: error
          retention-days: 14
