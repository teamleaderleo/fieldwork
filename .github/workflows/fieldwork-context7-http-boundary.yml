name: Fieldwork Context7 HTTP boundary

on:
  pull_request:
    paths:
      - ".github/workflows/fieldwork-context7-http-boundary.yml"
      - "programmes/high-leverage-open-source/scouts/context7-http-boundary/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  characterize:
    name: Node 22 Linux network boundary
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out Fieldwork carrier
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          path: fieldwork
          persist-credentials: false

      - name: Check out exact Context7 source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: upstash/context7
          ref: 594a73133e14631af8c915a1b4f2c8039c964fe1
          path: context7
          persist-credentials: false

      - name: Verify target and install controls
        id: verify
        run: |
          test "$(git -C context7 rev-parse HEAD)" = "594a73133e14631af8c915a1b4f2c8039c964fe1"
          mkdir -p fieldwork-receipts
          cp \
            fieldwork/programmes/high-leverage-open-source/scouts/context7-http-boundary/fieldwork-http-boundary.test.ts \
            context7/packages/mcp/test/fieldwork-http-boundary.test.ts
          chmod +x fieldwork/programmes/high-leverage-open-source/scouts/context7-http-boundary/check-http-boundary.sh
          bash -n fieldwork/programmes/high-leverage-open-source/scouts/context7-http-boundary/check-http-boundary.sh

      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093
        with:
          version: 10

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: context7/pnpm-lock.yaml

      - name: Install exact dependencies
        working-directory: context7
        run: pnpm install --frozen-lockfile

      - name: Build exact MCP package
        id: build
        working-directory: context7
        run: pnpm --filter @upstash/context7-mcp build

      - name: Characterize real HTTP listener and CORS
        id: network
        env:
          FIELDWORK_CONTEXT7_NETWORK_RECEIPT: ${{ github.workspace }}/fieldwork-receipts/network.json
        run: >-
          fieldwork/programmes/high-leverage-open-source/scouts/context7-http-boundary/check-http-boundary.sh
          context7

      - name: Run forwarded identity and metadata controls
        id: identity
        if: always()
        working-directory: context7
        env:
          CLIENT_IP_ENCRYPTION_KEY: 1111111111111111111111111111111111111111111111111111111111111111
          FIELDWORK_CONTEXT7_IDENTITY_RECEIPT: ${{ github.workspace }}/fieldwork-receipts/identity.json
        run: >-
          pnpm --filter @upstash/context7-mcp exec vitest run
          test/client-ip.test.ts
          test/fieldwork-http-boundary.test.ts

      - name: Run focused static and build gates
        id: static
        if: always()
        working-directory: context7
        run: |
          pnpm --filter @upstash/context7-mcp exec eslint \
            test/client-ip.test.ts \
            test/fieldwork-http-boundary.test.ts
          pnpm --filter @upstash/context7-mcp exec prettier --check \
            test/client-ip.test.ts \
            test/fieldwork-http-boundary.test.ts
          pnpm --filter @upstash/context7-mcp typecheck
          pnpm --filter @upstash/context7-mcp build
          git diff --check

      - name: Assemble durable exact-head receipt
        id: receipt
        if: always()
        env:
          FIELDWORK_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          NETWORK_OUTCOME: ${{ steps.network.outcome }}
          IDENTITY_OUTCOME: ${{ steps.identity.outcome }}
          STATIC_OUTCOME: ${{ steps.static.outcome }}
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");

          const receiptDirectory = path.join(process.cwd(), "fieldwork-receipts");
          const readJson = (name) => {
            const receiptPath = path.join(receiptDirectory, name);
            return fs.existsSync(receiptPath)
              ? JSON.parse(fs.readFileSync(receiptPath, "utf8"))
              : null;
          };

          fs.mkdirSync(receiptDirectory, { recursive: true });
          const receipt = {
            schemaVersion: 1,
            generatedAt: new Date().toISOString(),
            fieldworkHead: process.env.FIELDWORK_HEAD,
            target: {
              repository: "upstash/context7",
              head: "594a73133e14631af8c915a1b4f2c8039c964fe1",
              package: "@upstash/context7-mcp 3.2.5",
            },
            workflowSteps: {
              verify: process.env.VERIFY_OUTCOME || "not-run",
              build: process.env.BUILD_OUTCOME || "not-run",
              network: process.env.NETWORK_OUTCOME || "not-run",
              identity: process.env.IDENTITY_OUTCOME || "not-run",
              static: process.env.STATIC_OUTCOME || "not-run",
            },
            network: readJson("network.json"),
            identity: readJson("identity.json"),
            claimClasses: {
              listenerAndReachability: "target-executed-linux-when-network-step-passes",
              realisticCorsPreflight: "target-executed-linux-when-network-step-passes",
              requestParser: "target-executed-when-identity-step-passes",
              parserToOutboundMetadata: "target-executed-when-identity-step-passes",
              httpRouteContextWiring: "source-read",
              hostedContext7ApiReceipt: "not-executed",
              browserPrivateNetworkExposure: "not-claimed",
            },
          };

          fs.writeFileSync(
            path.join(receiptDirectory, "context7-http-boundary-receipt.json"),
            `${JSON.stringify(receipt, null, 2)}\n`,
          );
          NODE

      - name: Upload exact-head receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: context7-http-boundary-receipt
          path: fieldwork-receipts/context7-http-boundary-receipt.json
          if-no-files-found: error
          retention-days: 14
