name: Fieldwork round 005 execution carrier

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: fieldwork-round-005-base-execution
  cancel-in-progress: true

jobs:
  execute:
    if: github.event.pull_request.head.ref == 'research/developer-tools-round-005'
    runs-on: ubuntu-latest
    steps:
      - name: Check out Fieldwork result branch
        uses: actions/checkout@v4
        with:
          ref: research/developer-tools-round-005
          path: fieldwork-record
          fetch-depth: 0

      - name: Check out Fieldwork main for carrier retirement
        uses: actions/checkout@v4
        with:
          ref: main
          path: fieldwork-main
          fetch-depth: 0

      - name: Check out Meson candidate
        uses: actions/checkout@v4
        with:
          repository: teamleaderleo/meson
          ref: fieldwork/16046-source-option-dependency
          path: meson
          fetch-depth: 0

      - name: Check out ShellCheck candidate
        uses: actions/checkout@v4
        with:
          repository: teamleaderleo/shellcheck
          ref: fieldwork/3263-bats-synthetic-export-read
          path: shellcheck
          fetch-depth: 0

      - name: Check out Cargo packet
        uses: actions/checkout@v4
        with:
          repository: teamleaderleo/cargo
          ref: fieldwork/16574-patch-source-fetch
          path: cargo
          fetch-depth: 0

      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6.6'
          cabal-version: 'latest'

      - name: Verify Meson exact base versus candidate
        id: meson
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/fieldwork-record/programmes/open-source-ecosystems/scouts/developer-tools-build-systems/artifacts/round-005-execution/meson"
          mkdir -p "$OUT"
          cd "$GITHUB_WORKSPACE/meson"
          git worktree add --detach "$RUNNER_TEMP/meson-base" 0b5b32e284709eb5b23ed30207fe978362d30a3d
          python3 "$RUNNER_TEMP/meson-base/meson.py" introspect --dependencies \
            "$GITHUB_WORKSPACE/meson/fieldwork/16046/reproducer/meson.build" \
            > "$OUT/baseline.json"
          python3 meson.py introspect --dependencies fieldwork/16046/reproducer/meson.build \
            > "$OUT/candidate.json"
          python3 - "$OUT" <<'PY'
          import json
          import pathlib
          import sys
          root = pathlib.Path(sys.argv[1])
          baseline = json.loads((root / 'baseline.json').read_text())
          candidate = json.loads((root / 'candidate.json').read_text())
          assert len(baseline) == 1 and baseline[0]['name'] == 'unknown', baseline
          assert candidate == [{
              'name': 'systemd',
              'required': False,
              'version': ['>= 209'],
              'has_fallback': False,
              'conditional': False,
          }], candidate
          PY
          python3 -m compileall -q mesonbuild
          git diff --check
          git rev-parse HEAD > "$OUT/candidate-head.txt"

      - name: Verify ShellCheck sourced-function control
        id: shellcheck
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/fieldwork-record/programmes/open-source-ecosystems/scouts/developer-tools-build-systems/artifacts/round-005-execution/shellcheck"
          mkdir -p "$OUT"
          cd "$GITHUB_WORKSPACE/shellcheck"
          cabal update
          cabal v2-build exe:shellcheck
          BIN=$(realpath "$(cabal list-bin exe:shellcheck)")
          set +e
          (cd fieldwork/3263/resourced && "$BIN" -x -f gcc test.bats) \
            > "$OUT/resourced-control.txt" 2>&1
          status=$?
          set -e
          printf '%s\n' "$status" > "$OUT/exit-status.txt"
          test "$status" -ne 0
          ! grep -q 'SC1091' "$OUT/resourced-control.txt"
          grep -q 'SC2031' "$OUT/resourced-control.txt"
          git diff --check
          git rev-parse HEAD > "$OUT/candidate-head.txt"

      - name: Verify Cargo current and proposed contracts
        id: cargo
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/fieldwork-record/programmes/open-source-ecosystems/scouts/developer-tools-build-systems/artifacts/round-005-execution/cargo"
          mkdir -p "$OUT"
          cd "$GITHUB_WORKSPACE/cargo"
          cargo test --test testsuite patch::patch_git -- --nocapture \
            > "$OUT/current-contract.txt" 2>&1
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tests/testsuite/patch.rs')
          text = path.read_text()
          marker = '''\n#[cargo_test]\nfn patch_to_git() {'''
          test = r'''

#[cargo_test]
fn config_path_patch_can_replace_unreachable_git_dependency_without_fetch() {
    let source = "ssh://127.0.0.1:9/foo-dep.git";
    let p = project()
        .file(
            "Cargo.toml",
            &format!(
                r#"
                    [package]
                    name = "cargo-patch-test"
                    version = "0.0.1"

                    [dependencies.foo-dep]
                    git = "{source}"
                "#,
            ),
        )
        .file(
            ".cargo/config.toml",
            &format!(
                r#"
                    [patch."{source}"]
                    foo-dep = {{ path = "foo-dep" }}
                "#,
            ),
        )
        .file("src/lib.rs", "pub fn local() -> bool { foo_dep::local() }")
        .file("foo-dep/Cargo.toml", &basic_manifest("foo-dep", "0.1.0"))
        .file("foo-dep/src/lib.rs", "pub fn local() -> bool { true }")
        .build();

    p.cargo("check")
        .env("CARGO_NET_RETRY", "0")
        .with_stderr_data(str![[r#"
[LOCKING] 1 package to latest compatible version
[CHECKING] foo-dep v0.1.0 ([ROOT]/foo/foo-dep)
[CHECKING] cargo-patch-test v0.0.1 ([ROOT]/foo)
[FINISHED] `dev` profile [unoptimized + debuginfo] target(s) in [ELAPSED]s

"#]])
        .run();
}
'''
          if text.count(marker) != 1:
              raise SystemExit('unexpected patch_to_git marker')
          path.write_text(text.replace(marker, test + marker, 1))
          PY
          set +e
          cargo test --test testsuite \
            patch::config_path_patch_can_replace_unreachable_git_dependency_without_fetch \
            -- --nocapture > "$OUT/proposed-contract.txt" 2>&1
          status=$?
          set -e
          printf '%s\n' "$status" > "$OUT/proposed-exit-status.txt"
          test "$status" -ne 0
          grep -Eq 'failed to (load source|clone|fetch)|unable to update|Connection refused' \
            "$OUT/proposed-contract.txt"
          git checkout -- tests/testsuite/patch.rs
          git diff --check
          git rev-parse HEAD > "$OUT/packet-head.txt"

      - name: Retain results and retire carrier
        if: always()
        shell: bash
        env:
          MESON_OUTCOME: ${{ steps.meson.outcome }}
          SHELLCHECK_OUTCOME: ${{ steps.shellcheck.outcome }}
          CARGO_OUTCOME: ${{ steps.cargo.outcome }}
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE/fieldwork-main"
          git config user.name fieldwork-bot
          git config user.email fieldwork-bot@users.noreply.github.com
          git rm .github/workflows/fieldwork-round-005-base-execute.yml
          git commit -m "Retire round 005 execution carrier"
          git push origin HEAD:main

          cd "$GITHUB_WORKSPACE/fieldwork-record"
          cat > programmes/open-source-ecosystems/scouts/developer-tools-build-systems/ROUND-005-EXECUTION.md <<EOF
          # Developer tools and build systems — Round 005 execution

          Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}  
          Runner: ubuntu-latest  
          Fieldwork starting head: ${GITHUB_SHA}  
          Upstream contact: none; unauthorized

          ## In simple words

          This execution checked the current Meson fork fix against its exact base, reran ShellCheck's separate sourced-function control from the correct directory, and tested Cargo's current patch behavior against the proposed no-fetch contract. Raw outputs are retained under `artifacts/round-005-execution/`.

          ## Results

          | Target | Outcome | Interpretation |
          | --- | --- | --- |
          | Meson | ${MESON_OUTCOME} | Exact base emits `unknown`; candidate is required to emit `systemd`; Python compilation and diff checks are included. |
          | ShellCheck follow-up | ${SHELLCHECK_OUTCOME} | The include must resolve without SC1091 and the separate sourced-function SC2031 must remain reproducible. |
          | Cargo | ${CARGO_OUTCOME} | Existing `patch_git` must pass; the proposed broad no-fetch contract must fail on the original-source product path; source is restored afterward. |

          Evidence is target-executed only for rows marked `success`. This is focused Linux evidence, not each repository's complete cross-platform gate.
          EOF
          rm -f programmes/open-source-ecosystems/scouts/developer-tools-build-systems/ROUND-005-EXECUTION-TRIGGER.md
          git config user.name fieldwork-bot
          git config user.email fieldwork-bot@users.noreply.github.com
          git add programmes/open-source-ecosystems/scouts/developer-tools-build-systems
          git commit -m "Record round 005 fork execution"
          git push origin HEAD:research/developer-tools-round-005

          if [[ "$MESON_OUTCOME" != success || "$SHELLCHECK_OUTCOME" != success || "$CARGO_OUTCOME" != success ]]; then
            exit 1
          fi
