name: execute-118-tauri-once-panic

on:
  push:
    branches:
      - 'execute/118-tauri-once-panic-control'

permissions:
  contents: read

jobs:
  control:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: tauri-apps/tauri
          ref: 34ec18ba5e1acabebd66ae79d6fc746f63d8eb96
          path: target-tauri
          persist-credentials: false
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential curl libappindicator3-dev libgtk-3-dev librsvg2-dev \
            libssl-dev libwebkit2gtk-4.1-dev wget
      - name: Pin Rust toolchain receipt
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version
          cargo --version
      - name: Inject once-listener panic control
        run: |
          python3 - <<'PY'
          from pathlib import Path
          target = Path('target-tauri/crates/tauri/src/event/listener.rs')
          snippet = Path('programmes/high-leverage-open-source/scouts/tauri-authority-packaging-lifecycle/probe/listener_once_panic_test.rs').read_text()
          text = target.read_text()
          position = text.rfind('\n}')
          if position < 0:
              raise SystemExit('could not locate event listener test-module close')
          target.write_text(text[:position] + '\n' + snippet + text[position:])
          PY
      - name: Require baseline to fail for once cleanup
        working-directory: target-tauri
        shell: bash
        run: |
          set +e
          cargo test -p tauri --lib --no-default-features once_listener_panic_still_cleans_up_before_unwind_resumes -- --nocapture 2>&1 | tee /tmp/once-baseline.log
          status=${PIPESTATUS[0]}
          set -e
          test "$status" -ne 0
          grep -F 'once-listener panic poisoned the handler mutex' /tmp/once-baseline.log
      - name: Apply prepared callback-panic candidate
        run: git -C target-tauri apply ../programmes/high-leverage-open-source/scouts/tauri-authority-packaging-lifecycle/probe/candidate.patch
      - name: Require once cleanup control to pass with candidate
        working-directory: target-tauri
        run: cargo test -p tauri --lib --no-default-features once_listener_panic_still_cleans_up_before_unwind_resumes -- --nocapture
