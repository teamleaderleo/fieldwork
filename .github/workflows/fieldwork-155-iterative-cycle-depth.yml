name: fieldwork-155-iterative-cycle-depth

on:
  push:
    branches:
      - lane/155-static-coordination-compiler
    paths:
      - .github/workflows/fieldwork-155-iterative-cycle-depth.yml

permissions:
  contents: write

concurrency:
  group: fieldwork-155-iterative-cycle-depth
  cancel-in-progress: false

jobs:
  repair-test-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out compiler branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: lane/155-static-coordination-compiler
          fetch-depth: 0
          persist-credentials: true

      - name: Replace recursive cycle detection and add depth control
        shell: python
        run: |
          from pathlib import Path
          from textwrap import dedent

          compiler = Path("scripts/coordination_compiler.py")
          text = compiler.read_text(encoding="utf-8")
          old = dedent('''\
          def _find_readiness_cycle(
              node_ids: Iterable[str], outgoing: dict[str, list[str]]
          ) -> list[str] | None:
              state: dict[str, int] = {node_id: 0 for node_id in node_ids}
              stack: list[str] = []
              stack_index: dict[str, int] = {}

              def visit(node_id: str) -> list[str] | None:
                  state[node_id] = 1
                  stack_index[node_id] = len(stack)
                  stack.append(node_id)
                  for target in outgoing[node_id]:
                      if state[target] == 0:
                          cycle = visit(target)
                          if cycle:
                              return cycle
                      elif state[target] == 1:
                          start = stack_index[target]
                          return stack[start:] + [target]
                  stack.pop()
                  stack_index.pop(node_id)
                  state[node_id] = 2
                  return None

              for node_id in sorted(state):
                  if state[node_id] == 0:
                      cycle = visit(node_id)
                      if cycle:
                          return cycle
              return None
          ''')
          new = dedent('''\
          def _find_readiness_cycle(
              node_ids: Iterable[str], outgoing: dict[str, list[str]]
          ) -> list[str] | None:
              """Return one deterministic cycle without depending on Python recursion depth."""
              state: dict[str, int] = {node_id: 0 for node_id in node_ids}

              for root in sorted(state):
                  if state[root] != 0:
                      continue

                  path: list[str] = []
                  path_index: dict[str, int] = {}
                  stack: list[tuple[str, int]] = [(root, 0)]
                  while stack:
                      node_id, next_neighbor = stack[-1]
                      if state[node_id] == 0:
                          state[node_id] = 1
                          path_index[node_id] = len(path)
                          path.append(node_id)

                      neighbors = outgoing[node_id]
                      if next_neighbor < len(neighbors):
                          target = neighbors[next_neighbor]
                          stack[-1] = (node_id, next_neighbor + 1)
                          if state[target] == 0:
                              stack.append((target, 0))
                          elif state[target] == 1:
                              start = path_index[target]
                              return path[start:] + [target]
                          continue

                      stack.pop()
                      state[node_id] = 2
                      path_index.pop(node_id)
                      if not path or path[-1] != node_id:
                          raise GraphError("cycle traversal stack became inconsistent")
                      path.pop()

              return None
          ''')
          if text.count(old) != 1:
              raise SystemExit("recursive cycle detector anchor mismatch")
          compiler.write_text(text.replace(old, new, 1), encoding="utf-8")

          tests = Path("scripts/test_coordination_compiler.py")
          text = tests.read_text(encoding="utf-8")
          anchor = dedent('''\
              def test_affected_descendants_do_not_include_unrelated_branch(self) -> None:
          ''')
          addition = dedent('''\
              def test_maximum_depth_chain_does_not_depend_on_python_recursion(self) -> None:
                  nodes = [node(f"n-{index:04d}") for index in range(compiler.MAX_NODES)]
                  edges = [
                      {
                          "from": f"n-{index:04d}",
                          "to": f"n-{index + 1:04d}",
                          "kind": "requires",
                      }
                      for index in range(compiler.MAX_NODES - 1)
                  ]

                  normalized = compiler.normalize_graph(graph(nodes, edges))
                  result = compiler.evaluate_graph(normalized, ["n-0000"])

                  self.assertEqual(len(result["topological_order"]), compiler.MAX_NODES)
                  self.assertEqual(len(result["affected_nodes"]), compiler.MAX_NODES)
                  self.assertEqual(result["topological_order"][0], "n-0000")
                  self.assertEqual(
                      result["topological_order"][-1],
                      f"n-{compiler.MAX_NODES - 1:04d}",
                  )

          ''')
          if "test_maximum_depth_chain_does_not_depend_on_python_recursion" in text:
              raise SystemExit("maximum-depth regression already exists")
          if text.count(anchor) != 1:
              raise SystemExit("test insertion anchor mismatch")
          tests.write_text(text.replace(anchor, addition + anchor, 1), encoding="utf-8")

      - name: Run static compiler validation
        run: |
          python3 -m py_compile scripts/coordination_compiler.py scripts/test_coordination_compiler.py
          python3 scripts/test_coordination_compiler.py
          python3 scripts/coordination_compiler.py \
            research/continuous-coordination/fixtures/simple-chain.json \
            --clean > /tmp/simple-chain.json
          git diff --check

      - name: Publish source and tests only
        run: |
          rm .github/workflows/fieldwork-155-iterative-cycle-depth.yml
          git config user.name fieldwork-ci
          git config user.email fieldwork-ci@users.noreply.github.com
          git add scripts .github
          git commit -m 'coordination: make cycle detection depth-safe'
          git push origin HEAD:lane/155-static-coordination-compiler
