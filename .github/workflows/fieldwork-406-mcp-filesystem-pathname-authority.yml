name: Fieldwork MCP filesystem pathname authority

on:
  pull_request:
    paths:
      - ".github/workflows/fieldwork-406-mcp-filesystem-pathname-authority.yml"
      - "findings/F406-mcp-filesystem-pathname-authority/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  characterize:
    name: Node 22 Linux ancestor-swap characterization
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact Fieldwork carrier head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: fieldwork
          persist-credentials: false

      - name: Check out exact MCP servers source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: modelcontextprotocol/servers
          ref: 76d64c822f5125032f89eb71dbdb94e42b434821
          path: servers
          persist-credentials: false

      - name: Verify exact inputs and install control
        id: verify
        env:
          EXPECTED_FIELDWORK_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git -C fieldwork rev-parse HEAD)" = "${EXPECTED_FIELDWORK_HEAD}"
          test "$(git -C servers rev-parse HEAD)" = "76d64c822f5125032f89eb71dbdb94e42b434821"
          cp \
            fieldwork/findings/F406-mcp-filesystem-pathname-authority/evidence/fieldwork-pathname-authority.test.ts \
            servers/src/filesystem/__tests__/fieldwork-pathname-authority.test.ts
          mkdir -p fieldwork-receipts

      - name: Set up Node 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: servers/package-lock.json

      - name: Install committed dependencies
        id: install
        working-directory: servers
        run: npm ci

      - name: Run focused path controls
        id: focused
        working-directory: servers
        run: |
          set -o pipefail
          npm exec --workspace @modelcontextprotocol/server-filesystem -- \
            vitest run \
            __tests__/path-validation.test.ts \
            __tests__/fieldwork-pathname-authority.test.ts \
            2>&1 | tee ../fieldwork-receipts/focused-pathname-authority.log

      - name: Run complete filesystem package tests
        id: package
        working-directory: servers
        run: |
          set -o pipefail
          npm test --workspace @modelcontextprotocol/server-filesystem \
            2>&1 | tee ../fieldwork-receipts/filesystem-package-tests.log

      - name: Build filesystem package
        id: build
        working-directory: servers
        run: |
          set -o pipefail
          npm run build --workspace @modelcontextprotocol/server-filesystem \
            2>&1 | tee ../fieldwork-receipts/filesystem-build.log

      - name: Check exact carrier boundary
        id: boundary
        run: |
          set -euo pipefail
          git -C servers diff --check
          status=$(git -C servers status --porcelain=v1 --untracked-files=all)
          test "${status}" = "?? src/filesystem/__tests__/fieldwork-pathname-authority.test.ts"

      - name: Assemble exact-head receipt
        if: always()
        env:
          FIELDWORK_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          FOCUSED_OUTCOME: ${{ steps.focused.outcome }}
          PACKAGE_OUTCOME: ${{ steps.package.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          BOUNDARY_OUTCOME: ${{ steps.boundary.outcome }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const directory = path.join(process.cwd(), 'fieldwork-receipts');
          fs.mkdirSync(directory, { recursive: true });
          const receipt = {
            schemaVersion: 1,
            generatedAt: new Date().toISOString(),
            fieldworkHead: process.env.FIELDWORK_HEAD,
            target: {
              repository: 'modelcontextprotocol/servers',
              head: '76d64c822f5125032f89eb71dbdb94e42b434821',
              package: '@modelcontextprotocol/server-filesystem',
              platform: 'ubuntu-24.04',
              node: '22',
            },
            workflowSteps: {
              verify: process.env.VERIFY_OUTCOME || 'not-run',
              install: process.env.INSTALL_OUTCOME || 'not-run',
              focused: process.env.FOCUSED_OUTCOME || 'not-run',
              package: process.env.PACKAGE_OUTCOME || 'not-run',
              build: process.env.BUILD_OUTCOME || 'not-run',
              boundary: process.env.BOUNDARY_OUTCOME || 'not-run',
            },
            controls: {
              stableAllowedParent: 'target-executed-when-focused-passes',
              preexistingOutsideSymlink: 'target-executed-when-focused-passes',
              postValidationAncestorSwap: 'target-executed-when-focused-passes',
            },
            claimBoundary: {
              mutation: 'nonexistent-file creation through validatePath plus writeFileContent',
              createDirectory: 'not-executed',
              move: 'not-executed',
              dynamicRoots: 'not-executed',
              otherPlatforms: 'not-executed',
              publicExploitability: 'not-claimed',
            },
            hostedRequest: false,
            credentialsUsed: false,
          };
          fs.writeFileSync(
            path.join(directory, 'mcp-filesystem-pathname-authority-receipt.json'),
            `${JSON.stringify(receipt, null, 2)}\n`,
          );
          NODE

      - name: Upload exact-head receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: mcp-filesystem-pathname-authority-${{ github.run_id }}-${{ github.run_attempt }}
          path: fieldwork-receipts/
          if-no-files-found: error
          retention-days: 14
