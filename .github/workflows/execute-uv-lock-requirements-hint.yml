name: Execute uv lock requirements hint

on:
  pull_request:
    branches:
      - execution/uv-lock-requirements-hint-base
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      UV_BASE: 49e2fc5c821bb69a528308a036b17446bb5ab5a6
      UV_GENERATOR: 88583b756e80dae74bbb3163fda9c9e7ec1f176d
      CARRIER_BASE: 5dedf5499a696f209650daad7c4ab18cdd0f1256
    steps:
      - name: Check out Fieldwork carrier
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          path: carrier

      - name: Verify carrier boundary
        shell: bash
        working-directory: carrier
        run: |
          set -euo pipefail
          test "$(git merge-base "$CARRIER_BASE" HEAD)" = "$CARRIER_BASE"
          git diff --name-only "$CARRIER_BASE"...HEAD | sort > "$RUNNER_TEMP/carrier-files.txt"
          cat > "$RUNNER_TEMP/expected-carrier-files.txt" <<'EOF'
          .github/workflows/execute-uv-lock-requirements-hint.yml
          execution/uv-lock-requirements-hint.txt
          EOF
          diff -u "$RUNNER_TEMP/expected-carrier-files.txt" "$RUNNER_TEMP/carrier-files.txt"

      - name: Check out exact uv source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: teamleaderleo/uv
          ref: ${{ env.UV_BASE }}
          fetch-depth: 1
          path: uv

      - name: Check out exact generator
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: teamleaderleo/uv
          ref: ${{ env.UV_GENERATOR }}
          fetch-depth: 1
          sparse-checkout: scripts/fieldwork/generate-uv-lock-requirements-hint.py
          sparse-checkout-cone-mode: false
          path: generator

      - name: Generate and fence exact source
        shell: bash
        working-directory: uv
        run: |
          set -euo pipefail
          python ../generator/scripts/fieldwork/generate-uv-lock-requirements-hint.py
          git add -N crates/uv/tests/pip_install/uv_lock_requirements_hint.rs
          git diff --name-only | sort > "$RUNNER_TEMP/source-files.txt"
          cat > "$RUNNER_TEMP/expected-source-files.txt" <<'EOF'
          crates/uv-requirements/Cargo.toml
          crates/uv-requirements/src/specification.rs
          crates/uv/src/commands/pip/operations.rs
          crates/uv/tests/pip_install/main.rs
          crates/uv/tests/pip_install/uv_lock_requirements_hint.rs
          EOF
          diff -u "$RUNNER_TEMP/expected-source-files.txt" "$RUNNER_TEMP/source-files.txt"
          git diff --check

      - name: Install Rust components
        shell: bash
        working-directory: uv
        run: rustup component add rustfmt clippy

      - name: Format and compile
        shell: bash
        working-directory: uv
        run: |
          set -euo pipefail
          cargo fmt --all
          git diff --name-only | sort > "$RUNNER_TEMP/source-files-formatted.txt"
          diff -u "$RUNNER_TEMP/expected-source-files.txt" "$RUNNER_TEMP/source-files-formatted.txt"
          git diff --check
          cargo fmt --all --check
          git diff --stat | tee "$RUNNER_TEMP/source-stat.txt"
          git diff > "$RUNNER_TEMP/source.patch"
          cargo check -p uv-requirements -p uv

      - name: Run focused integration controls
        shell: bash
        working-directory: uv
        run: |
          set -euo pipefail
          cargo test -p uv --test pip_install --features test-python,test-pypi \
            uv_lock_requirements_hint -- --nocapture \
            | tee "$RUNNER_TEMP/focused-tests.txt"

      - name: Run affected Clippy gates
        shell: bash
        working-directory: uv
        run: |
          set -euo pipefail
          cargo clippy -p uv-requirements -p uv --tests \
            --features test-python,test-pypi -- -D warnings

      - name: Record exact generated tree
        shell: bash
        working-directory: uv
        run: |
          set -euo pipefail
          git config user.name "fieldwork-execution"
          git config user.email "fieldwork-execution@users.noreply.github.com"
          git add \
            crates/uv-requirements/Cargo.toml \
            crates/uv-requirements/src/specification.rs \
            crates/uv/src/commands/pip/operations.rs \
            crates/uv/tests/pip_install/main.rs \
            crates/uv/tests/pip_install/uv_lock_requirements_hint.rs
          git commit -m "fix: hint when uv lockfiles are used as requirements"
          git rev-parse HEAD | tee "$RUNNER_TEMP/source-head.txt"
          git rev-parse HEAD^{tree} | tee "$RUNNER_TEMP/source-tree.txt"

      - name: Retain receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: uv-lock-requirements-hint-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/carrier-files.txt
            ${{ runner.temp }}/source-files.txt
            ${{ runner.temp }}/source-files-formatted.txt
            ${{ runner.temp }}/source-stat.txt
            ${{ runner.temp }}/source.patch
            ${{ runner.temp }}/focused-tests.txt
            ${{ runner.temp }}/source-head.txt
            ${{ runner.temp }}/source-tree.txt
          if-no-files-found: warn
          retention-days: 14
