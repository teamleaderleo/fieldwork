name: Fieldwork F406 procfd nested authority

on:
  pull_request:
    paths:
      - ".github/workflows/fieldwork-406-procfd-nested-boundary.yml"
      - "findings/F406-mcp-filesystem-pathname-authority/evidence/linux-procfd-nested-boundary.test.mjs"
      - "findings/F406-mcp-filesystem-pathname-authority/evidence/linux-procfd-nested-boundary.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nested-boundary:
    name: Linux procfd nested authority
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact helper head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Node 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22

      - name: Execute nested authority discriminators
        run: |
          set -euo pipefail
          test "$(uname -s)" = "Linux"
          test -e /proc/self/fd
          node --check findings/F406-mcp-filesystem-pathname-authority/evidence/linux-procfd-nested-boundary.test.mjs
          node --test findings/F406-mcp-filesystem-pathname-authority/evidence/linux-procfd-nested-boundary.test.mjs \
            | tee /tmp/procfd-nested-boundary.tap
          grep -F "# pass 2" /tmp/procfd-nested-boundary.tap
          grep -F "# fail 0" /tmp/procfd-nested-boundary.tap
          git diff --check

      - name: Retain exact execution receipt
        env:
          FIELDWORK_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          RUN_ID_VALUE: ${{ github.run_id }}
          RUN_ATTEMPT_VALUE: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          mkdir -p fieldwork-receipts
          cp /tmp/procfd-nested-boundary.tap fieldwork-receipts/procfd-nested-boundary.tap
          export NODE_VERSION_VALUE="$(node --version)"
          python3 <<'PY'
          import json
          import os
          from pathlib import Path

          receipt = {
              "schemaVersion": 1,
              "fieldworkHead": os.environ["FIELDWORK_HEAD"],
              "runId": os.environ["RUN_ID_VALUE"],
              "runAttempt": os.environ["RUN_ATTEMPT_VALUE"],
              "environment": {
                  "os": "Linux",
                  "runner": "ubuntu-24.04",
                  "node": os.environ["NODE_VERSION_VALUE"],
                  "procfs": "/proc/self/fd",
              },
              "evidenceClass": "primitive-executed-local",
              "targetContext": "modelcontextprotocol/servers@76d64c822f5125032f89eb71dbdb94e42b434821",
              "controls": {
                  "topParentProcfdNestedSwapWritesOutside": True,
                  "preopenedImmediateParentNestedSwapWritesInside": True,
              },
              "targetSourceMutated": False,
              "hostedRequest": False,
              "credentialsUsed": False,
          }
          Path("fieldwork-receipts/procfd-nested-boundary.json").write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload exact execution receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: fieldwork-406-procfd-nested-${{ github.run_id }}-${{ github.run_attempt }}
          path: fieldwork-receipts/
          if-no-files-found: error
          retention-days: 14
