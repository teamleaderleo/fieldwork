name: Fieldwork Playwright parent IPC shutdown

on:
  pull_request:
    paths:
      - ".github/workflows/fieldwork-playwright-parent-ipc-shutdown.yml"
      - "programmes/high-leverage-open-source/scouts/playwright-mcp-remote-shutdown/candidate-parent-ipc.patch"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ipc-shutdown:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out exact Fieldwork candidate head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: fieldwork
          persist-credentials: false

      - name: Check out exact Playwright source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: microsoft/playwright
          ref: 368941457a82da112aa8610107e25f4bde94339a
          path: playwright
          persist-credentials: false

      - name: Set up Node 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: playwright/package-lock.json

      - name: Verify exact inputs and apply IPC candidate
        id: verify
        run: |
          set -euo pipefail
          test "$(git -C fieldwork rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git -C playwright rev-parse HEAD)" = "368941457a82da112aa8610107e25f4bde94339a"
          PATCH="../fieldwork/programmes/high-leverage-open-source/scouts/playwright-mcp-remote-shutdown/candidate-parent-ipc.patch"
          git -C playwright apply --check "$PATCH"
          git -C playwright apply "$PATCH"
          git -C playwright diff --check
          test "$(git -C playwright diff --name-only | sort)" = "$(printf '%s\n' \
            packages/playwright-core/src/entry/mcp.ts \
            packages/playwright-core/src/tools/utils/mcp/http.ts \
            tests/mcp/http.spec.ts | sort)"
          mkdir -p fieldwork-receipts
          git -C playwright diff --binary > fieldwork-receipts/parent-ipc-applied.diff

      - name: Install exact dependencies
        id: install
        working-directory: playwright
        run: npm ci

      - name: Build exact Playwright source
        id: build
        working-directory: playwright
        run: npm run build

      - name: Install Chromium and runner dependencies
        id: browser
        working-directory: playwright
        run: npx playwright install --with-deps chromium

      - name: Run complete MCP HTTP suite
        id: test
        working-directory: playwright
        env:
          CI: "1"
        run: |
          set -euo pipefail
          set -o pipefail
          npm run test-mcp tests/mcp/http.spec.ts -- --project=chromium \
            2>&1 | tee ../fieldwork-receipts/parent-ipc-http.log

      - name: Run focused ESLint
        id: lint
        working-directory: playwright
        run: |
          npx eslint \
            packages/playwright-core/src/entry/mcp.ts \
            packages/playwright-core/src/tools/utils/mcp/http.ts \
            tests/mcp/http.spec.ts

      - name: Recheck exact diff hygiene
        id: diff
        working-directory: playwright
        run: |
          git diff --check
          test "$(git diff --name-only | sort)" = "$(printf '%s\n' \
            packages/playwright-core/src/entry/mcp.ts \
            packages/playwright-core/src/tools/utils/mcp/http.ts \
            tests/mcp/http.spec.ts | sort)"
          git status --short

      - name: Assemble exact receipt
        if: always()
        env:
          FIELDWORK_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          BROWSER_OUTCOME: ${{ steps.browser.outcome }}
          TEST_OUTCOME: ${{ steps.test.outcome }}
          LINT_OUTCOME: ${{ steps.lint.outcome }}
          DIFF_OUTCOME: ${{ steps.diff.outcome }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          fs.mkdirSync('fieldwork-receipts', { recursive: true });
          const steps = {
            verify: process.env.VERIFY_OUTCOME || 'not-run',
            install: process.env.INSTALL_OUTCOME || 'not-run',
            build: process.env.BUILD_OUTCOME || 'not-run',
            browser: process.env.BROWSER_OUTCOME || 'not-run',
            test: process.env.TEST_OUTCOME || 'not-run',
            lint: process.env.LINT_OUTCOME || 'not-run',
            diff: process.env.DIFF_OUTCOME || 'not-run',
          };
          const receipt = {
            schemaVersion: 1,
            generatedAt: new Date().toISOString(),
            fieldworkHead: process.env.FIELDWORK_HEAD,
            target: {
              repository: 'microsoft/playwright',
              head: '368941457a82da112aa8610107e25f4bde94339a',
              project: 'chromium',
            },
            candidate: 'parent-owned-ipc-shutdown',
            changedFiles: [
              'packages/playwright-core/src/entry/mcp.ts',
              'packages/playwright-core/src/tools/utils/mcp/http.ts',
              'tests/mcp/http.spec.ts',
            ],
            workflowSteps: steps,
            reusableCandidateEvidence: Object.values(steps).every(value => value === 'success'),
            claims: {
              oldHttpShutdownRequest: 'target-executed-when-test-passes',
              wrongIpcMessage: 'target-executed-when-test-passes',
              exactParentIpcGracefulSigint: 'target-executed-when-test-passes',
              crossPlatformBehavior: 'not-claimed',
              publicExploitability: 'not-claimed',
              sourceAcceptance: 'not-claimed',
            },
          };
          fs.writeFileSync('fieldwork-receipts/parent-ipc-receipt.json', `${JSON.stringify(receipt, null, 2)}\n`);
          NODE

      - name: Upload exact receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: playwright-parent-ipc-${{ github.run_id }}-${{ github.run_attempt }}
          path: fieldwork-receipts/
          if-no-files-found: error
          retention-days: 14
