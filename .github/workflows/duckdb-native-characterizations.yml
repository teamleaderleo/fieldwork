name: DuckDB native characterizations

on:
  pull_request:
    paths:
      - '.github/workflows/duckdb-native-characterizations.yml'
      - 'programmes/data-durable-workflows/scouts/duckdb-native-characterizations/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out Fieldwork record
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          path: fieldwork
          persist-credentials: false

      - name: Check out immutable DuckDB source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: duckdb/duckdb
          ref: de477da7606fc2d857f81117f0140d0550a5c42c
          path: duckdb
          persist-credentials: false

      - name: Check out owned Hive test carrier
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: teamleaderleo/duckdb
          ref: 520052d13b567cd5546289b9e4f31c4cb4ca99cc
          path: hive-carrier
          persist-credentials: false

      - name: Check out owned window test carrier
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: teamleaderleo/duckdb
          ref: cac295334e56fd816aaefb13d09dc2716795aa2c
          path: window-carrier
          persist-credentials: false

      - name: Stage native tests and independent controls
        run: |
          cp hive-carrier/test/sql/copy/parquet/parquet_hive_default_collision.test \
            duckdb/test/sql/copy/parquet/parquet_hive_default_collision.test
          cp window-carrier/test/sql/window/test_rows_following_overflow.test \
            duckdb/test/sql/window/test_rows_following_overflow.test

          cat > duckdb/test/sql/window/fieldwork_rows_following_control.test <<'EOF'
          # name: test/sql/window/fieldwork_rows_following_control.test
          # description: Ordinary bounded FOLLOWING remains correct
          # group: [window]

          query III
          SELECT i,
                 count(*) OVER (ORDER BY i ROWS BETWEEN 1 FOLLOWING AND 1 FOLLOWING) AS cnt,
                 list(i) OVER (ORDER BY i ROWS BETWEEN 1 FOLLOWING AND 1 FOLLOWING) AS members
          FROM range(3) t(i)
          ORDER BY i;
          ----
          0	1	[1]
          1	1	[2]
          2	0	NULL
          EOF

          cat > duckdb/test/sql/copy/parquet/fieldwork_hive_raw_marker_control.test <<'EOF'
          # name: test/sql/copy/parquet/fieldwork_hive_raw_marker_control.test
          # description: SQL NULL still writes and reads through the raw Hive default marker
          # group: [parquet]

          require parquet

          statement ok
          COPY (SELECT NULL::VARCHAR AS p, 3 AS id)
          TO '{TEST_DIR}/hive-existing'
          (FORMAT PARQUET, PARTITION_BY (p), OVERWRITE);

          query I
          SELECT count(*)
          FROM glob('{TEST_DIR}/hive-existing/p=__HIVE_DEFAULT_PARTITION__/*.parquet');
          ----
          1

          query II
          SELECT (p IS NULL)::INTEGER AS is_null, id
          FROM parquet_scan('{TEST_DIR}/hive-existing/**/*.parquet', hive_partitioning=1)
          ----
          1	3
          EOF

      - name: Install build dependencies
        run: |
          sudo apt-get update -y -qq
          sudo apt-get install -y -qq ninja-build

      - name: Configure minimal pinned build
        working-directory: duckdb
        run: |
          cmake -S . -B build/fieldwork -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DBUILD_EXTENSIONS=parquet \
            -DFORCE_COLORED_OUTPUT=1

      - name: Build native test runner
        working-directory: duckdb
        run: cmake --build build/fieldwork --target unittest --parallel 2

      - name: Run independent passing controls
        working-directory: duckdb
        run: |
          ./build/fieldwork/test/run 'test/sql/window/fieldwork_rows_following_control.test'
          ./build/fieldwork/test/run 'test/sql/copy/parquet/fieldwork_hive_raw_marker_control.test'

      - name: Retain intended failing characterizations
        working-directory: duckdb
        run: |
          set +e
          ./build/fieldwork/test/run 'test/sql/window/test_rows_following_overflow.test' \
            > window-overflow.log 2>&1
          window_status=$?
          ./build/fieldwork/test/run 'test/sql/copy/parquet/parquet_hive_default_collision.test' \
            > hive-marker-collision.log 2>&1
          hive_status=$?
          set -e

          cat window-overflow.log
          cat hive-marker-collision.log

          test "$window_status" -ne 0
          test "$hive_status" -ne 0
          grep -F 'test_rows_following_overflow.test' window-overflow.log
          grep -F 'parquet_hive_default_collision.test' hive-marker-collision.log
          ! grep -E 'Parser Error|Catalog Error|INTERNAL Error|Unknown test command' window-overflow.log
          ! grep -E 'Parser Error|Catalog Error|INTERNAL Error|Unknown test command' hive-marker-collision.log

      - name: Upload native receipts
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: duckdb-native-characterizations
          path: |
            duckdb/window-overflow.log
            duckdb/hive-marker-collision.log
          if-no-files-found: warn
          retention-days: 30
