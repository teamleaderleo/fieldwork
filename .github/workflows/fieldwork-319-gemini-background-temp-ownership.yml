name: Fieldwork 319 Gemini background temp ownership

on:
  pull_request:
    paths:
      - .github/workflows/fieldwork-319-gemini-background-temp-ownership.yml
      - findings/F319-gemini-background-temp-ownership/**

permissions:
  contents: read

concurrency:
  group: fieldwork-319-gemini-background-temp-ownership
  cancel-in-progress: true

env:
  GEMINI_SOURCE: d55e366f6ab393e024c613d940fead3696d56eac

jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out exact Fieldwork candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          path: fieldwork
          persist-credentials: false

      - name: Check out exact Gemini source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: teamleaderleo/gemini-cli
          ref: ${{ env.GEMINI_SOURCE }}
          path: gemini
          persist-credentials: false

      - name: Apply selected ownership-transfer candidate
        run: |
          set -euo pipefail
          source_dir="$GITHUB_WORKSPACE/fieldwork/findings/F319-gemini-background-temp-ownership/artifacts"
          cd gemini
          git apply --check "$source_dir/background-temp-ownership-candidate.patch"
          git apply "$source_dir/background-temp-ownership-candidate.patch"
          git apply --check "$source_dir/process-exit-finalization-once.patch"
          git apply "$source_dir/process-exit-finalization-once.patch"
          cp "$source_dir/shell-background-temp-ownership-repair.test.ts" \
            packages/core/src/tools/shell-background-temp-ownership-repair.test.ts
          cp "$source_dir/shell-execution-process-exit-cleanup.test.ts" \
            packages/core/src/services/shell-execution-process-exit-cleanup.test.ts
          git diff --check
          {
            git diff --name-only
            git ls-files --others --exclude-standard
          } | sort -u > /tmp/actual-files
          cat > /tmp/expected-files <<'EOF'
          packages/core/src/services/executionLifecycleService.ts
          packages/core/src/services/shell-execution-process-exit-cleanup.test.ts
          packages/core/src/services/shellExecutionService.ts
          packages/core/src/tools/shell-background-temp-ownership-repair.test.ts
          packages/core/src/tools/shell.ts
          EOF
          diff -u /tmp/expected-files /tmp/actual-files
          echo 'FIELDWORK_PARENT_PATCH_HUNKS=12/12'

      - name: Use Node.js 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gemini/package-lock.json

      - name: Install locked dependencies
        working-directory: gemini
        run: npm ci

      - name: Run focused and adjacent target controls
        working-directory: gemini
        run: |
          set -euo pipefail
          files=(
            packages/core/src/services/executionLifecycleService.ts
            packages/core/src/services/shell-execution-process-exit-cleanup.test.ts
            packages/core/src/services/shellExecutionService.ts
            packages/core/src/tools/shell-background-temp-ownership-repair.test.ts
            packages/core/src/tools/shell.ts
          )
          npx prettier --write "${files[@]}"
          npx prettier --check "${files[@]}"
          git add -N \
            packages/core/src/services/shell-execution-process-exit-cleanup.test.ts \
            packages/core/src/tools/shell-background-temp-ownership-repair.test.ts
          npm run test --workspace @google/gemini-cli-core -- \
            src/tools/shell-background-temp-ownership-repair.test.ts \
            src/services/shell-execution-process-exit-cleanup.test.ts \
            src/tools/shell.test.ts \
            src/services/executionLifecycleService.test.ts
          npm run typecheck --workspace @google/gemini-cli-core
          git diff --check
          echo 'FIELDWORK_TARGET_FORMATTER=5/5-files'
          echo 'FIELDWORK_BACKGROUND_TEMP_OWNERSHIP_CANDIDATE=5/5-files'
          echo 'FIELDWORK_PROCESS_EXIT_FINALIZATION_ONCE=1/1'

      - name: Export exact candidate evidence
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/fieldwork-319-gemini-background-temp-ownership"
          mkdir -p "$output"
          cd gemini
          git diff --binary > "$output/candidate.patch"
          git diff --name-only | sort -u > "$output/files.txt"
          {
            echo "gemini_source=$GEMINI_SOURCE"
            echo "fieldwork_head=${{ github.event.pull_request.head.sha }}"
            echo "runner=$RUNNER_OS"
          } > "$output/metadata.txt"
          sha256sum "$output"/* > "$output/SHA256SUMS"
          cat "$output/metadata.txt"
          cat "$output/SHA256SUMS"

      - name: Upload candidate evidence
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: fieldwork-319-gemini-background-temp-ownership
          path: ${{ runner.temp }}/fieldwork-319-gemini-background-temp-ownership
          if-no-files-found: error
          retention-days: 14
