name: Fieldwork Delta wide wrap symbol probe

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  delta-wide-wrap:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DELTA_SHA: 95a0e224f55ccfdf3a7d1278fdea98a3edb9fbf4
    steps:
      - uses: actions/checkout@v4

      - name: Fetch exact Delta source read-only
        run: |
          set -euxo pipefail
          git init /tmp/delta
          git -C /tmp/delta remote add origin https://github.com/dandavison/delta.git
          git -C /tmp/delta fetch --depth=1 origin "$DELTA_SHA"
          git -C /tmp/delta checkout --detach FETCH_HEAD
          test "$(git -C /tmp/delta rev-parse HEAD)" = "$DELTA_SHA"

      - name: Inject execution-only controls
        run: |
          set -euxo pipefail
          cat playgrounds/EXP-20260811-delta-wide-wrap-symbol/delta_probe_tests.rs >> /tmp/delta/src/wrapping.rs
          tail -n 120 /tmp/delta/src/wrapping.rs

      - name: Compile target tests and binary
        working-directory: /tmp/delta
        run: |
          set -euxo pipefail
          cargo test --locked --no-run
          cargo build --locked --bin delta

      - name: Prove validator reachability
        working-directory: /tmp/delta
        run: |
          set -euxo pipefail
          cargo test --locked fieldwork_delta_wide_marker_is_accepted_as_width_one_option -- --nocapture

      - name: Prove one-column ASCII negative control terminates
        working-directory: /tmp/delta
        run: |
          set -euxo pipefail
          timeout -k 2s 15s cargo test --locked fieldwork_delta_one_column_marker_unlimited_wrap_terminates -- --nocapture

      - name: Classify two-column marker owner progress
        working-directory: /tmp/delta
        run: |
          set +e
          timeout -k 2s 8s cargo test --locked fieldwork_delta_two_column_marker_unlimited_wrap_must_make_progress -- --nocapture
          status=$?
          set -e
          case "$status" in
            0) echo 'FIELDWORK_RESULT owner-two-column-marker=terminated' ;;
            124|137) echo 'FIELDWORK_RESULT owner-two-column-marker=watchdog-expired' ;;
            *) echo "Unexpected test status: $status" >&2; exit "$status" ;;
          esac

      - name: Classify valid-marker wide-grapheme owner progress
        working-directory: /tmp/delta
        run: |
          set +e
          timeout -k 2s 8s cargo test --locked fieldwork_delta_valid_marker_wide_first_grapheme_unlimited_wrap_must_make_progress -- --nocapture
          status=$?
          set -e
          case "$status" in
            0) echo 'FIELDWORK_RESULT owner-valid-marker-wide-grapheme=terminated' ;;
            124|137) echo 'FIELDWORK_RESULT owner-valid-marker-wide-grapheme=watchdog-expired' ;;
            *) echo "Unexpected wide-grapheme owner status: $status" >&2; exit "$status" ;;
          esac

      - name: Prepare public CLI fixtures
        working-directory: /tmp/delta
        run: |
          cat > /tmp/delta-fieldwork.diff <<'EOF'
          diff --git a/a.txt b/a.txt
          --- a/a.txt
          +++ b/a.txt
          @@ -1 +1 @@
          -abc
          +def
          EOF
          cat > /tmp/delta-fieldwork-cjk.diff <<'EOF'
          diff --git a/a.txt b/a.txt
          --- a/a.txt
          +++ b/a.txt
          @@ -1 +1 @@
          -abc
          +界a
          EOF
          cat /tmp/delta-fieldwork.diff
          cat /tmp/delta-fieldwork-cjk.diff

      - name: Prove one-column ASCII public CLI control terminates
        working-directory: /tmp/delta
        run: |
          set -euxo pipefail
          timeout -k 2s 15s ./target/debug/delta \
            --side-by-side \
            --width 16 \
            --line-fill-method=spaces \
            --wrap-max-lines unlimited \
            --wrap-left-symbol '+' \
            < /tmp/delta-fieldwork.diff \
            > /tmp/delta-control.out
          test -s /tmp/delta-control.out
          echo 'FIELDWORK_RESULT cli-one-column-marker-ascii=terminated'
          cat /tmp/delta-control.out

      - name: Classify two-column marker public CLI progress
        working-directory: /tmp/delta
        run: |
          set +e
          timeout -k 2s 8s ./target/debug/delta \
            --side-by-side \
            --width 16 \
            --line-fill-method=spaces \
            --wrap-max-lines unlimited \
            --wrap-left-symbol '界' \
            < /tmp/delta-fieldwork.diff \
            > /tmp/delta-wide.out
          status=$?
          set -e
          case "$status" in
            0) echo 'FIELDWORK_RESULT cli-two-column-marker=terminated'; cat /tmp/delta-wide.out ;;
            124|137) echo 'FIELDWORK_RESULT cli-two-column-marker=watchdog-expired' ;;
            *) echo "Unexpected CLI status: $status" >&2; cat /tmp/delta-wide.out || true; exit "$status" ;;
          esac

      - name: Classify valid-marker wide-grapheme public CLI progress
        working-directory: /tmp/delta
        run: |
          set +e
          timeout -k 2s 8s ./target/debug/delta \
            --side-by-side \
            --width 16 \
            --line-fill-method=spaces \
            --wrap-max-lines unlimited \
            --wrap-left-symbol '+' \
            < /tmp/delta-fieldwork-cjk.diff \
            > /tmp/delta-cjk.out
          status=$?
          set -e
          case "$status" in
            0) echo 'FIELDWORK_RESULT cli-valid-marker-wide-grapheme=terminated'; cat /tmp/delta-cjk.out ;;
            124|137) echo 'FIELDWORK_RESULT cli-valid-marker-wide-grapheme=watchdog-expired' ;;
            *) echo "Unexpected CJK CLI status: $status" >&2; cat /tmp/delta-cjk.out || true; exit "$status" ;;
          esac

      - name: Preserve exact receipt
        if: always()
        run: |
          set +e
          printf 'delta=%s\n' "$(git -C /tmp/delta rev-parse HEAD 2>/dev/null)"
          printf 'fieldwork_head=%s\n' '${{ github.event.pull_request.head.sha }}'
          printf 'experiment=%s\n' 'EXP-20260811-delta-wide-wrap-symbol'
          git -C /tmp/delta diff -- src/wrapping.rs 2>/dev/null || true
