name: Fieldwork Delta wide wrap symbol probe

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  delta-wide-wrap:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DELTA_SHA: 95a0e224f55ccfdf3a7d1278fdea98a3edb9fbf4
    steps:
      - uses: actions/checkout@v4

      - name: Fetch exact Delta source read-only
        run: |
          set -euxo pipefail
          git init /tmp/delta
          git -C /tmp/delta remote add origin https://github.com/dandavison/delta.git
          git -C /tmp/delta fetch --depth=1 origin "$DELTA_SHA"
          git -C /tmp/delta checkout --detach FETCH_HEAD
          test "$(git -C /tmp/delta rev-parse HEAD)" = "$DELTA_SHA"

      - name: Inject execution-only controls
        run: |
          set -euxo pipefail
          cat playgrounds/EXP-20260811-delta-wide-wrap-symbol/delta_probe_tests.rs >> /tmp/delta/src/wrapping.rs
          tail -n 100 /tmp/delta/src/wrapping.rs

      - name: Compile target tests
        working-directory: /tmp/delta
        run: |
          set -euxo pipefail
          cargo test --locked --no-run

      - name: Prove validator reachability
        working-directory: /tmp/delta
        run: |
          set -euxo pipefail
          cargo test --locked fieldwork_delta_wide_marker_is_accepted_as_width_one_option -- --nocapture

      - name: Prove one-column negative control terminates
        working-directory: /tmp/delta
        run: |
          set -euxo pipefail
          timeout -k 2s 15s cargo test --locked fieldwork_delta_one_column_marker_unlimited_wrap_terminates -- --nocapture

      - name: Classify two-column unlimited-wrap progress
        working-directory: /tmp/delta
        run: |
          set +e
          timeout -k 2s 8s cargo test --locked fieldwork_delta_two_column_marker_unlimited_wrap_must_make_progress -- --nocapture
          status=$?
          set -e
          case "$status" in
            0)
              echo 'FIELDWORK_RESULT two-column-marker=terminated'
              ;;
            124|137)
              echo 'FIELDWORK_RESULT two-column-marker=watchdog-expired'
              ;;
            *)
              echo "Unexpected test status: $status" >&2
              exit "$status"
              ;;
          esac

      - name: Preserve exact receipt
        if: always()
        run: |
          set +e
          printf 'delta=%s\n' "$(git -C /tmp/delta rev-parse HEAD 2>/dev/null)"
          printf 'fieldwork_head=%s\n' '${{ github.event.pull_request.head.sha }}'
          printf 'experiment=%s\n' 'EXP-20260811-delta-wide-wrap-symbol'
          git -C /tmp/delta diff -- src/wrapping.rs 2>/dev/null || true
