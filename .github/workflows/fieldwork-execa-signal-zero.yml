name: Fieldwork Execa signal-zero safety

on:
  pull_request:
    paths:
      - '.github/workflows/fieldwork-execa-signal-zero.yml'
      - 'programmes/agent-cli-execution/scouts/execa-descendant-termination/**'
  workflow_dispatch:

jobs:
  focused:
    name: Node.js ${{ matrix.node-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}-latest
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 22
          - 24
          - 26
        os:
          - ubuntu
          - windows
    steps:
      - uses: actions/checkout@v4
        with:
          repository: teamleaderleo/execa
          ref: fieldwork/kill-descendants-signal-zero
          path: execa
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm install
        working-directory: execa
      - run: npx ava test/terminate/kill-descendants.js test/terminate/kill-descendants-signal-zero.js
        working-directory: execa
