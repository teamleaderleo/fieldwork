name: Fieldwork Stensibly MCP attempt admission repair

on:
  pull_request:
    paths:
      - ".github/workflows/fieldwork-stensibly-mcp-attempt-admission.yml"
      - "programmes/high-leverage-open-source/scouts/stensibly-mcp-attempt-admission/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repair:
    name: Bun 1.3.10 exact-source admission repair
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact Fieldwork carrier head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: fieldwork
          persist-credentials: false

      - name: Check out exact Stensibly source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: teamleaderleo/stensibly
          ref: 7a5146da52139dec062575baa512eb2c97531060
          path: stensibly
          persist-credentials: false

      - name: Verify exact inputs and apply repair
        id: verify
        run: |
          set -euo pipefail
          test "$(git -C fieldwork rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git -C stensibly rev-parse HEAD)" = "7a5146da52139dec062575baa512eb2c97531060"
          python3 -m py_compile \
            fieldwork/programmes/high-leverage-open-source/scouts/stensibly-mcp-attempt-admission/apply_repair.py
          python3 \
            fieldwork/programmes/high-leverage-open-source/scouts/stensibly-mcp-attempt-admission/apply_repair.py \
            stensibly
          cp \
            fieldwork/programmes/high-leverage-open-source/scouts/stensibly-mcp-attempt-admission/fieldwork-mcp-attempt-admission.test.ts \
            stensibly/test/fieldwork-mcp-attempt-admission.test.ts
          mkdir -p fieldwork-receipts

      - name: Set up Node 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "22"

      - name: Install exact Bun runtime
        id: bun
        run: |
          npm install --global bun@1.3.10
          test "$(bun --version)" = "1.3.10"

      - name: Install committed dependencies
        id: install
        working-directory: stensibly
        run: bun install --frozen-lockfile

      - name: Run focused attempt-observation controls
        id: test
        working-directory: stensibly
        run: |
          set -o pipefail
          bun test \
            test/mcp-attempt-observation.test.ts \
            test/mcp-attempt-observation-single-failure.test.ts \
            test/fieldwork-mcp-attempt-admission.test.ts \
            2>&1 | tee ../fieldwork-receipts/stensibly-mcp-attempt-admission-tests.log

      - name: Run typecheck and runtime parity
        id: parity
        working-directory: stensibly
        run: |
          set -o pipefail
          {
            bun run typecheck
            bun run test:runtime-parity
          } 2>&1 | tee ../fieldwork-receipts/stensibly-mcp-attempt-parity.log

      - name: Check repaired diff and clean carrier boundary
        id: diff
        working-directory: stensibly
        run: |
          set -euo pipefail
          git diff --check
          test -z "$(git status --short --untracked-files=no | sed -n '/^ M \|^M  /p' | grep -v -E '^( M|M ) (src/mcp-attempt-observation.ts|test/mcp-attempt-observation.test.ts)$' || true)"
          git diff --binary -- \
            src/mcp-attempt-observation.ts \
            test/mcp-attempt-observation.test.ts \
            > ../fieldwork-receipts/stensibly-mcp-attempt-admission.patch

      - name: Assemble exact-head receipt
        if: always()
        env:
          FIELDWORK_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
          BUN_OUTCOME: ${{ steps.bun.outcome }}
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          TEST_OUTCOME: ${{ steps.test.outcome }}
          PARITY_OUTCOME: ${{ steps.parity.outcome }}
          DIFF_OUTCOME: ${{ steps.diff.outcome }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const directory = path.join(process.cwd(), 'fieldwork-receipts');
          fs.mkdirSync(directory, { recursive: true });
          const receipt = {
            schemaVersion: 1,
            generatedAt: new Date().toISOString(),
            fieldworkHead: process.env.FIELDWORK_HEAD,
            target: {
              repository: 'teamleaderleo/stensibly',
              head: '7a5146da52139dec062575baa512eb2c97531060',
              changedFiles: [
                'src/mcp-attempt-observation.ts',
                'test/mcp-attempt-observation.test.ts',
              ],
            },
            workflowSteps: {
              verify: process.env.VERIFY_OUTCOME || 'not-run',
              bun: process.env.BUN_OUTCOME || 'not-run',
              install: process.env.INSTALL_OUTCOME || 'not-run',
              tests: process.env.TEST_OUTCOME || 'not-run',
              typecheckAndRuntimeParity: process.env.PARITY_OUTCOME || 'not-run',
              diff: process.env.DIFF_OUTCOME || 'not-run',
            },
            claimClasses: {
              arrayKeyAdmission: 'target-executed-when-tests-pass',
              fixedDiagnosticPrivacy: 'target-executed-when-tests-pass',
              secretShapedIdentityAdmission: 'target-executed-when-tests-pass',
              derivedFailureStageVocabulary: 'target-executed-when-tests-pass',
              publicUpstreamCompatibility: 'not-claimed',
            },
          };
          fs.writeFileSync(
            path.join(directory, 'stensibly-mcp-attempt-admission-receipt.json'),
            `${JSON.stringify(receipt, null, 2)}\n`,
          );
          NODE

      - name: Upload exact-head receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: stensibly-mcp-attempt-admission-receipt
          path: fieldwork-receipts/
          if-no-files-found: error
          retention-days: 14
