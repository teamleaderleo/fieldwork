name: cmux Computer Use generation fence

on:
  push:
    branches:
      - fieldwork/cmux-cross-generation-identity-20260901
    paths:
      - .github/workflows/cmux-computer-use-generation.yml

permissions:
  contents: read

env:
  UPSTREAM_BASE_SHA: 2ead47750ab2f47c13972d0709d99cdcbaa8ad73
  RED_SHA: 1af0c0dcec183757027e823b569a20995c302341
  FIX_SHA: 9c69bd85cccd5a608c7b98bb145f91341046f2a8
  GREEN_SHA: 7f3370aff19744ee085661626a5fc162dee69678
  SWIFT_BACKTRACE: interactive=no,timeout=0s,symbolicate=off,color=no
  CMUX_SKIP_ZIG_BUILD: "1"

jobs:
  prove-generation-fence:
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - name: Checkout exact green candidate
        uses: actions/checkout@v4
        with:
          repository: teamleaderleo/cmux
          ref: ${{ env.GREEN_SHA }}
          fetch-depth: 0
          submodules: recursive

      - name: Verify immutable ancestry and diff
        run: |
          set -euo pipefail
          test "$(git rev-parse "$RED_SHA^")" = "$UPSTREAM_BASE_SHA"
          test "$(git rev-parse "$FIX_SHA^")" = "$UPSTREAM_BASE_SHA"
          test "$(git rev-parse "$GREEN_SHA^")" = "$FIX_SHA"
          test "$(git diff --name-only "$UPSTREAM_BASE_SHA" "$RED_SHA")" = "cmuxTests/ComputerUseCrossGenerationIdentityTests.swift"
          test "$(git diff --name-only "$UPSTREAM_BASE_SHA" "$GREEN_SHA" | sort)" = $'Sources/App/ComputerUseLiveSessionProjection.swift\ncmuxTests/ComputerUseCrossGenerationIdentityTests.swift'

      - name: Select Xcode
        run: ./scripts/select-ci-xcode.sh

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Download pre-built GhosttyKit.xcframework
        run: ./scripts/download-prebuilt-ghosttykit.sh

      - name: Install Zig
        run: ./scripts/install-zig-ci.sh

      - name: Install Rust
        run: ./scripts/install-rust-ci.sh

      - name: Prepare DerivedData
        run: |
          set -euo pipefail
          DERIVED_DATA_PATH="${RUNNER_TEMP}/cmux-generation-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$DERIVED_DATA_PATH"
          echo "CMUX_DERIVED_DATA_PATH=$DERIVED_DATA_PATH" >> "$GITHUB_ENV"

      - name: Resolve Swift packages
        run: |
          set -euo pipefail
          SOURCE_PACKAGES_DIR="$PWD/.ci-source-packages"
          mkdir -p "$SOURCE_PACKAGES_DIR"
          xcodebuild -project cmux.xcodeproj -scheme cmux-unit -configuration Debug \
            -derivedDataPath "$CMUX_DERIVED_DATA_PATH" \
            -clonedSourcePackagesDirPath "$SOURCE_PACKAGES_DIR" \
            -resolvePackageDependencies

      - name: Prove current upstream plus regression is red
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach "$RED_SHA"
          SOURCE_PACKAGES_DIR="$PWD/.ci-source-packages"
          set +e
          python3 scripts/ci/xcodebuild_noninteractive.py \
            xcodebuild -project cmux.xcodeproj -scheme cmux-unit -configuration Debug \
              -derivedDataPath "$CMUX_DERIVED_DATA_PATH" \
              -clonedSourcePackagesDirPath "$SOURCE_PACKAGES_DIR" \
              -disableAutomaticPackageResolution \
              -destination "platform=macOS" \
              EXCLUDED_SOURCE_FILE_NAMES="BrowserPanelTests.swift BrowserPanelViewIdentityTests.swift" \
              -only-testing:cmuxTests/ComputerUseCrossGenerationIdentityTests/delayedGenerationACompletionCannotResolveGenerationBWithSameLogicalSession \
              test 2>&1 | tee /tmp/cmux-generation-red.log
          RED_STATUS=${PIPESTATUS[0]}
          set -e
          if [ "$RED_STATUS" -eq 0 ]; then
            echo "expected the test-only current-upstream commit to fail"
            exit 1
          fi
          grep -F "delayedGenerationACompletionCannotResolveGenerationBWithSameLogicalSession" /tmp/cmux-generation-red.log
          grep -F "Expectation failed" /tmp/cmux-generation-red.log

      - name: Prove generation fence is green
        run: |
          set -euo pipefail
          git checkout --detach "$GREEN_SHA"
          SOURCE_PACKAGES_DIR="$PWD/.ci-source-packages"
          python3 scripts/ci/xcodebuild_noninteractive.py \
            xcodebuild -project cmux.xcodeproj -scheme cmux-unit -configuration Debug \
              -derivedDataPath "$CMUX_DERIVED_DATA_PATH" \
              -clonedSourcePackagesDirPath "$SOURCE_PACKAGES_DIR" \
              -disableAutomaticPackageResolution \
              -destination "platform=macOS" \
              EXCLUDED_SOURCE_FILE_NAMES="BrowserPanelTests.swift BrowserPanelViewIdentityTests.swift" \
              -only-testing:cmuxTests/ComputerUseCrossGenerationIdentityTests/delayedGenerationACompletionCannotResolveGenerationBWithSameLogicalSession \
              test
