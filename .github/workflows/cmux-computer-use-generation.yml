name: cmux Computer Use generation fence

on:
  push:
    branches:
      - fieldwork/cmux-cross-generation-identity-20260901
    paths:
      - .github/workflows/cmux-computer-use-generation.yml

permissions:
  contents: read

env:
  UPSTREAM_BASE_SHA: 6044a8b3f43152d2e6fc17f771fd4b277b393118
  RED_SHA: d13e9a7cb3a3712f9f7a7f507c13d3a312c41d20
  PARTIAL_SHA: fbc7742dc04a5e7d14172a48aa43066296d24ac6
  GREEN_SHA: 1287e78a3a751e41d7fb23ca4157d57403fac1d2
  SWIFT_BACKTRACE: interactive=no,timeout=0s,symbolicate=off,color=no
  CMUX_SKIP_ZIG_BUILD: "1"

jobs:
  prove-generation-fence:
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - name: Checkout exact full candidate
        uses: actions/checkout@v4
        with:
          repository: teamleaderleo/cmux
          ref: ${{ env.GREEN_SHA }}
          fetch-depth: 0
          submodules: recursive

      - name: Verify immutable ancestry and diff
        run: |
          set -euo pipefail
          test "$(git rev-parse "$RED_SHA^")" = "$UPSTREAM_BASE_SHA"
          test "$(git rev-parse "$PARTIAL_SHA^")" = "$RED_SHA"
          test "$(git rev-parse "$GREEN_SHA^")" = "$PARTIAL_SHA"
          test "$(git diff --name-only "$UPSTREAM_BASE_SHA" "$RED_SHA")" = "cmuxTests/HostSettingsShortcutNotificationTests.swift"
          test "$(git diff --name-only "$UPSTREAM_BASE_SHA" "$GREEN_SHA" | sort)" = $'Sources/App/ComputerUseLiveSessionProjection.swift\nSources/App/ComputerUseUXCoordinator.swift\nSources/TerminalController+FeedAcknowledgment.swift\ncmuxTests/HostSettingsShortcutNotificationTests.swift'

      - name: Select Xcode
        run: ./scripts/select-ci-xcode.sh

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Download pre-built GhosttyKit.xcframework
        run: ./scripts/download-prebuilt-ghosttykit.sh

      - name: Install Zig
        run: ./scripts/install-zig-ci.sh

      - name: Install Rust
        run: ./scripts/install-rust-ci.sh

      - name: Prepare DerivedData
        run: |
          set -euo pipefail
          DERIVED_DATA_PATH="${RUNNER_TEMP}/cmux-generation-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$DERIVED_DATA_PATH"
          echo "CMUX_DERIVED_DATA_PATH=$DERIVED_DATA_PATH" >> "$GITHUB_ENV"

      - name: Resolve Swift packages
        run: |
          set -euo pipefail
          SOURCE_PACKAGES_DIR="$PWD/.ci-source-packages"
          mkdir -p "$SOURCE_PACKAGES_DIR"
          xcodebuild -project cmux.xcodeproj -scheme cmux-unit -configuration Debug \
            -derivedDataPath "$CMUX_DERIVED_DATA_PATH" \
            -clonedSourcePackagesDirPath "$SOURCE_PACKAGES_DIR" \
            -resolvePackageDependencies

      - name: Prove full ingress-generation fence is green
        run: |
          set -euo pipefail
          git checkout --detach "$GREEN_SHA"
          SOURCE_PACKAGES_DIR="$PWD/.ci-source-packages"
          python3 scripts/ci/xcodebuild_noninteractive.py \
            xcodebuild -project cmux.xcodeproj -scheme cmux-unit -configuration Debug \
              -derivedDataPath "$CMUX_DERIVED_DATA_PATH" \
              -clonedSourcePackagesDirPath "$SOURCE_PACKAGES_DIR" \
              -disableAutomaticPackageResolution \
              -destination "platform=macOS" \
              EXCLUDED_SOURCE_FILE_NAMES="BrowserPanelTests.swift BrowserPanelViewIdentityTests.swift" \
              -only-testing:cmuxTests/ComputerUseCrossGenerationIdentityTests \
              test

      - name: Characterize current-upstream stale-A regression
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach "$RED_SHA"
          SOURCE_PACKAGES_DIR="$PWD/.ci-source-packages"
          set +e
          python3 scripts/ci/xcodebuild_noninteractive.py \
            xcodebuild -project cmux.xcodeproj -scheme cmux-unit -configuration Debug \
              -derivedDataPath "$CMUX_DERIVED_DATA_PATH" \
              -clonedSourcePackagesDirPath "$SOURCE_PACKAGES_DIR" \
              -disableAutomaticPackageResolution \
              -destination "platform=macOS" \
              EXCLUDED_SOURCE_FILE_NAMES="BrowserPanelTests.swift BrowserPanelViewIdentityTests.swift" \
              -only-testing:cmuxTests/ComputerUseCrossGenerationIdentityTests \
              test 2>&1 | tee /tmp/cmux-generation-red.log
          RED_STATUS=${PIPESTATUS[0]}
          set -e
          echo "red_xcodebuild_status=$RED_STATUS"
          if [ "$RED_STATUS" -eq 0 ]; then
            echo "RED_CLASSIFICATION=unexpected-pass-or-selector-miss"
            exit 1
          fi
          if grep -Eq "(BUILD FAILED|CompileSwift|SwiftCompile.*failed|error:.*cannot find|error:.*no member)" /tmp/cmux-generation-red.log; then
            echo "RED_CLASSIFICATION=build-or-compile-failure"
            exit 1
          fi
          if grep -Fq "delayedGenerationACompletionCannotResolveGenerationBWithSameLogicalSession" /tmp/cmux-generation-red.log; then
            echo "RED_CLASSIFICATION=behavioral-regression-reached"
            exit 0
          fi
          echo "RED_CLASSIFICATION=nonzero-without-test-marker"
          exit 1
