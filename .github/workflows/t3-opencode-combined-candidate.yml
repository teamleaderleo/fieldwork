name: T3 OpenCode composed lifecycle candidate

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: t3-opencode-combined-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.filter.outputs.run }}
    steps:
      - name: Checkout Fieldwork head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2

      - name: Check candidate inputs
        id: filter
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif git diff-tree --no-commit-id --name-only -r HEAD | grep -Eq '^(.github/workflows/t3-opencode-combined-candidate.yml|campaigns/t3-opencode-completion-reconciliation/candidates/0002-opencode-interrupt-settlement.patch|campaigns/t3-opencode-completion-reconciliation/candidates/0004-opencode-interrupt-and-request-expiry.patch|campaigns/t3-opencode-completion-reconciliation/artifacts/target-head.txt)$'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  candidate-check:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Composed focused lifecycle
            command: >-
              vp test run
              apps/server/src/provider/Layers/OpenCodeAdapter.interrupt.test.ts
              apps/server/src/provider/Layers/OpenCodeAdapter.interrupt-error.test.ts
              apps/server/src/provider/Layers/OpenCodeAdapter.interrupt-owner-cancellation.test.ts
              apps/server/src/provider/Layers/OpenCodeAdapter.interrupt-projection.test.ts
              apps/server/src/provider/Layers/OpenCodeAdapter.pending-request.test.ts
              apps/server/src/provider/Layers/OpenCodeAdapter.pending-request-stop.test.ts
              -t "^(settles|rejects|coalesces|preserves|continues|classifies|reuses|emits|maps|expires)"
          - name: Runtime ingestion compatibility
            command: vp test run apps/server/src/orchestration/Layers/ProviderRuntimeIngestion.test.ts
          - name: Existing OpenCode adapter suite
            command: vp test run apps/server/src/provider/Layers/OpenCodeAdapter.test.ts
          - name: Server typecheck
            command: vp run --filter t3 typecheck
    steps:
      - name: Checkout Fieldwork candidate
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: fieldwork

      - name: Resolve pinned T3 head
        id: target
        run: echo "ref=$(tr -d '\n' < fieldwork/campaigns/t3-opencode-completion-reconciliation/artifacts/target-head.txt)" >> "$GITHUB_OUTPUT"

      - name: Checkout owned T3 campaign head
        uses: actions/checkout@v6
        with:
          repository: teamleaderleo/t3code
          ref: ${{ steps.target.outputs.ref }}
          path: t3code

      - name: Apply interrupt candidate, expiry overlay, and harness correction
        working-directory: t3code
        run: |
          sed -i 's/Fiber.Fiber<never, void>/Fiber.Fiber<void, never>/' apps/server/src/provider/Layers/OpenCodeAdapter.restart.test.ts
          git apply --check ../fieldwork/campaigns/t3-opencode-completion-reconciliation/candidates/0002-opencode-interrupt-settlement.patch
          git apply ../fieldwork/campaigns/t3-opencode-completion-reconciliation/candidates/0002-opencode-interrupt-settlement.patch
          git apply --check ../fieldwork/campaigns/t3-opencode-completion-reconciliation/candidates/0004-opencode-interrupt-and-request-expiry.patch
          git apply ../fieldwork/campaigns/t3-opencode-completion-reconciliation/candidates/0004-opencode-interrupt-and-request-expiry.patch
          git diff --check

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: t3code/package.json
          cache: false
          run-install: false

      - name: Install target dependencies
        working-directory: t3code
        run: vp install

      - name: Run candidate check
        working-directory: t3code
        run: ${{ matrix.command }}