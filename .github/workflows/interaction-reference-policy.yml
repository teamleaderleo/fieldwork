name: Interaction reference policy

on:
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created, edited]
  pull_request_target:
    types: [opened, edited, reopened, synchronize, ready_for_review]
  pull_request_review:
    types: [submitted, edited]
  pull_request_review_comment:
    types: [created, edited]
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  check-interaction:
    if: >-
      github.event_name == 'issues' ||
      github.event_name == 'issue_comment' ||
      github.event_name == 'pull_request_target' ||
      github.event_name == 'pull_request_review' ||
      github.event_name == 'pull_request_review_comment'
    runs-on: ubuntu-latest
    steps:
      - name: Check out trusted default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Test interaction reference scanner
        run: node scripts/test_interaction_references.js
      - name: Check the complete issue or pull-request thread
        uses: actions/github-script@v7
        with:
          script: |
            const check = require('./scripts/check_interaction_references.js');
            await check({ github, context, core });

  audit-repository:
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch'
    continue-on-error: true
    permissions:
      contents: read
      issues: read
      pull-requests: read
    runs-on: ubuntu-latest
    steps:
      - name: Check out trusted default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Test interaction reference scanner
        run: node scripts/test_interaction_references.js
      - name: Audit every issue and pull-request thread
        uses: actions/github-script@v7
        with:
          script: |
            const { auditRepository } = require('./scripts/check_interaction_references.js');
            await auditRepository({ github, context, core });
