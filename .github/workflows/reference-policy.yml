name: External reference policy

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Test tracked-file reference scanner
        run: python3 scripts/test_external_references.py
      - name: Test interaction reference scanner
        run: node scripts/test_interaction_references.js
      - name: Check external references
        run: python3 scripts/check_external_references.py
