name: Fieldwork unit 18 current source

on:
  pull_request:
    paths:
      - ".github/workflows/fieldwork-unit-18-current-source.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  current-source:
    name: Current source on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]

    steps:
      - name: Check out exact execution carrier
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: fieldwork
          persist-credentials: false

      - name: Check out exact Playwright candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: teamleaderleo/playwright
          ref: e99e97da2acfc6c1a67749bc749e1d0cb71b5607
          fetch-depth: 0
          path: playwright
          persist-credentials: false

      - name: Set up Node 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: playwright/package-lock.json

      - name: Verify exact source identity and diff fence
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          carrier="${{ github.event.pull_request.head.sha || github.sha }}"
          source="e99e97da2acfc6c1a67749bc749e1d0cb71b5607"
          base="15b1aec478d90f0293dae7b7b6dafd494d9f0154"
          expected=$'packages/playwright-core/src/entry/mcp.ts\npackages/playwright-core/src/tools/utils/mcp/http.ts\ntests/mcp/http.spec.ts'

          test "$(git -C fieldwork rev-parse HEAD)" = "$carrier"
          test "$(git -C playwright rev-parse HEAD)" = "$source"
          git -C playwright cat-file -e "$base^{commit}"
          git -C playwright diff --check "$base" "$source"
          test "$(git -C playwright diff --name-only "$base" "$source")" = "$expected"

          mkdir -p fieldwork-receipts
          git -C playwright diff --binary "$base" "$source" > "fieldwork-receipts/unit-18-${{ matrix.os }}.diff"
          git -C playwright log --format=fuller --reverse "$base..$source" > "fieldwork-receipts/unit-18-${{ matrix.os }}-commits.txt"

      - name: Install exact dependencies
        id: install
        working-directory: playwright
        run: npm ci

      - name: Build exact source
        id: build
        working-directory: playwright
        run: npm run build

      - name: Install Chromium and Linux dependencies
        id: browser_linux
        if: runner.os == 'Linux'
        working-directory: playwright
        run: npx playwright install --with-deps chromium

      - name: Install Chromium
        id: browser_other
        if: runner.os != 'Linux'
        working-directory: playwright
        run: npx playwright install chromium

      - name: Run complete MCP HTTP suite
        id: test
        shell: bash
        working-directory: playwright
        env:
          CI: "1"
        run: |
          set -o pipefail
          npm run test-mcp tests/mcp/http.spec.ts -- --project=chromium \
            2>&1 | tee "../fieldwork-receipts/unit-18-${{ matrix.os }}-test.log"

      - name: Run focused ESLint
        id: lint
        shell: bash
        working-directory: playwright
        run: |
          npx eslint \
            packages/playwright-core/src/entry/mcp.ts \
            packages/playwright-core/src/tools/utils/mcp/http.ts \
            tests/mcp/http.spec.ts

      - name: Verify source tree remains clean
        id: diff
        shell: bash
        working-directory: playwright
        run: |
          set -euo pipefail
          test -z "$(git status --short)"
          base="15b1aec478d90f0293dae7b7b6dafd494d9f0154"
          source="e99e97da2acfc6c1a67749bc749e1d0cb71b5607"
          expected=$'packages/playwright-core/src/entry/mcp.ts\npackages/playwright-core/src/tools/utils/mcp/http.ts\ntests/mcp/http.spec.ts'
          git diff --check "$base" "$source"
          test "$(git diff --name-only "$base" "$source")" = "$expected"

      - name: Assemble platform receipt
        if: always()
        shell: bash
        env:
          FIELDWORK_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          RUNNER_OS: ${{ runner.os }}
          RUNNER_ARCH: ${{ runner.arch }}
          MATRIX_OS: ${{ matrix.os }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          BROWSER_LINUX_OUTCOME: ${{ steps.browser_linux.outcome }}
          BROWSER_OTHER_OUTCOME: ${{ steps.browser_other.outcome }}
          TEST_OUTCOME: ${{ steps.test.outcome }}
          LINT_OUTCOME: ${{ steps.lint.outcome }}
          DIFF_OUTCOME: ${{ steps.diff.outcome }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const directory = 'fieldwork-receipts';
          fs.mkdirSync(directory, { recursive: true });
          const browser = process.env.RUNNER_OS === 'Linux'
            ? process.env.BROWSER_LINUX_OUTCOME
            : process.env.BROWSER_OTHER_OUTCOME;
          const outcomes = {
            verify: process.env.VERIFY_OUTCOME || 'not-run',
            install: process.env.INSTALL_OUTCOME || 'not-run',
            build: process.env.BUILD_OUTCOME || 'not-run',
            browser: browser || 'not-run',
            test: process.env.TEST_OUTCOME || 'not-run',
            lint: process.env.LINT_OUTCOME || 'not-run',
            diff: process.env.DIFF_OUTCOME || 'not-run',
          };
          const receipt = {
            schemaVersion: 1,
            generatedAt: new Date().toISOString(),
            fieldworkCarrierHead: process.env.FIELDWORK_HEAD,
            target: {
              repository: 'teamleaderleo/playwright',
              base: '15b1aec478d90f0293dae7b7b6dafd494d9f0154',
              head: 'e99e97da2acfc6c1a67749bc749e1d0cb71b5607',
              changedFiles: [
                'packages/playwright-core/src/entry/mcp.ts',
                'packages/playwright-core/src/tools/utils/mcp/http.ts',
                'tests/mcp/http.spec.ts',
              ],
            },
            platform: {
              matrixLabel: process.env.MATRIX_OS,
              runnerOS: process.env.RUNNER_OS,
              runnerArch: process.env.RUNNER_ARCH,
              node: process.version,
              project: 'chromium',
            },
            workflowSteps: outcomes,
            reusableCandidateEvidence: Object.values(outcomes).every(value => value === 'success'),
            claims: {
              exactCurrentHead: outcomes.verify,
              completeMcpHttpSuite: outcomes.test,
              strictMessageControls: outcomes.test,
              oldHttpRouteAbsent: outcomes.test,
              focusedEslint: outcomes.lint,
              exactDiffFence: outcomes.diff,
              fullRepositoryGate: 'not-claimed',
              sourceAcceptance: 'not-claimed',
            },
          };
          fs.writeFileSync(path.join(directory, `unit-18-current-${process.env.MATRIX_OS}-receipt.json`), `${JSON.stringify(receipt, null, 2)}\n`);
          NODE

      - name: Upload platform receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: playwright-unit-18-current-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: fieldwork-receipts/
          if-no-files-found: error
          retention-days: 14
