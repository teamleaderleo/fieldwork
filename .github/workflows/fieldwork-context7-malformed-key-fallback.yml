name: Fieldwork Context7 malformed-key fallback

on:
  pull_request:
    paths:
      - ".github/workflows/fieldwork-context7-malformed-key-fallback.yml"
      - "programmes/high-leverage-open-source/scouts/context7-http-boundary/fieldwork-metadata-fallback-receipt.mjs"
      - "programmes/high-leverage-open-source/scouts/context7-http-boundary/malformed-key-fallback.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  characterize:
    name: Node 22 exact local metadata fallback
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact Fieldwork carrier head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: fieldwork
          persist-credentials: false

      - name: Verify actual Fieldwork checkout identity
        env:
          EXPECTED_FIELDWORK_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          actual_head=$(git -C fieldwork rev-parse HEAD)
          test "${actual_head}" = "${EXPECTED_FIELDWORK_HEAD}"
          test "$(printf '%s' "${actual_head}" | wc -c)" -eq 40
          printf '%s\n' "${actual_head}" > fieldwork-head.txt
          node --check \
            fieldwork/programmes/high-leverage-open-source/scouts/context7-http-boundary/fieldwork-metadata-fallback-receipt.mjs

      - name: Check out exact Context7 source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: upstash/context7
          ref: 594a73133e14631af8c915a1b4f2c8039c964fe1
          path: context7
          persist-credentials: false

      - name: Verify exact target
        run: |
          test "$(git -C context7 rev-parse HEAD)" = "594a73133e14631af8c915a1b4f2c8039c964fe1"
          mkdir -p fieldwork-receipts

      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093
        with:
          version: 10

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: context7/pnpm-lock.yaml

      - name: Install exact dependencies
        working-directory: context7
        run: pnpm install --frozen-lockfile

      - name: Build exact MCP package
        working-directory: context7
        run: pnpm --filter @upstash/context7-mcp build

      - name: Execute focused malformed-key control
        working-directory: context7/packages/mcp
        run: |
          FIELDWORK_HEAD=$(cat "${GITHUB_WORKSPACE}/fieldwork-head.txt") \
          FIELDWORK_CONTEXT7_COMPOSED_RECEIPT="${GITHUB_WORKSPACE}/fieldwork-receipts/context7-malformed-key-fallback.json" \
            node \
              ../../../fieldwork/programmes/high-leverage-open-source/scouts/context7-http-boundary/fieldwork-metadata-fallback-receipt.mjs \
              | tee "${GITHUB_WORKSPACE}/fieldwork-receipts/stdout.txt"
          grep -Fx "FIELDWORK_CONTEXT7_METADATA_FALLBACK_EXACT=3/3" \
            "${GITHUB_WORKSPACE}/fieldwork-receipts/stdout.txt"

      - name: Verify exact receipt and diff hygiene
        run: |
          node <<'NODE'
          const assert = require("node:assert/strict");
          const fs = require("node:fs");
          const expectedHead = fs.readFileSync("fieldwork-head.txt", "utf8").trim();
          const receipt = JSON.parse(
            fs.readFileSync(
              "fieldwork-receipts/context7-malformed-key-fallback.json",
              "utf8",
            ),
          );
          assert.equal(receipt.schemaVersion, 1);
          assert.equal(receipt.evidenceClass, "target-executed-local-helper");
          assert.equal(receipt.fieldworkHead, expectedHead);
          assert.equal(
            receipt.exactTarget,
            "594a73133e14631af8c915a1b4f2c8039c964fe1",
          );
          assert.equal(receipt.outcomes.forwardedIdentitySelected, true);
          assert.equal(
            receipt.outcomes.repositoryDefaultKeyProducesCiphertextShapedMetadata,
            true,
          );
          assert.equal(
            receipt.outcomes.malformedConfiguredKeyEmitsPlaintextSelectedIp,
            true,
          );
          assert.equal(receipt.outcomes.rejectOrOmitPlaintextRepairPresent, false);
          assert.deepEqual(receipt.boundaries, {
            mcpSessionCreated: false,
            hostedContext7ApiCalled: false,
            redisOperationCalled: false,
            credentialUsed: false,
          });
          NODE
          git -C fieldwork diff --check
          git -C context7 diff --check

      - name: Upload exact-head receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: context7-malformed-key-fallback-receipt
          path: |
            fieldwork-head.txt
            fieldwork-receipts/context7-malformed-key-fallback.json
            fieldwork-receipts/stdout.txt
          if-no-files-found: error
          retention-days: 14
