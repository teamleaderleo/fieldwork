name: Fieldwork unit 18 current-main materialization macOS

on:
  pull_request:
    paths:
      - ".github/workflows/fieldwork-unit-18-current-main-materialize-macos.yml"

permissions:
  contents: read

jobs:
  materialize:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: fieldwork
          persist-credentials: false

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: teamleaderleo/playwright
          ref: 2cc9f3ee7fdd82feb87edb7f24af77442bdc10e2
          fetch-depth: 0
          path: playwright
          persist-credentials: false

      - name: Execute final deterministic edit
        shell: bash
        run: |
          set -euo pipefail
          sed -n '/^        run: |$/,$p' fieldwork/.github/workflows/fieldwork-unit-18-current-main-materialize-final.yml \
            | tail -n +2 \
            | sed 's/^          //' > /tmp/unit-18-final-wrapper.sh
          bash /tmp/unit-18-final-wrapper.sh

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: unit-18-current-main-materialized-${{ github.run_id }}
          path: materialized/
          if-no-files-found: error
          retention-days: 14
