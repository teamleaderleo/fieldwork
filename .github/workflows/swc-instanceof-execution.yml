name: SWC instanceof execution carrier

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/swc-instanceof-execution.yml"

permissions:
  contents: read

env:
  CARGO_HTTP_MULTIPLEXING: "false"
  CARGO_INCREMENTAL: "0"
  CARGO_NET_RETRY: "10"
  RUST_BACKTRACE: "1"

jobs:
  red-green:
    name: ${{ matrix.lane }} RED -> GREEN
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: utils
            source_head: 7f02482bdcecafdbf2b7c8d5d3667e2f9db6211b
          - lane: transforms
            source_head: 1bfc544804d8c5f675a064f6670511973fc30f52
          - lane: minifier-member
            source_head: ea9d75c2bf1effd3fb8a191c030380961a1eaa15
          - lane: folding
            source_head: 8bdbf2119bc93d3e6e20d0c97d61b7c0d43f1530

    steps:
      - name: Checkout exact owned-fork source head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: teamleaderleo/swc
          ref: ${{ matrix.source_head }}
          persist-credentials: false
          submodules: true

      - name: Install SWC Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: nightly-2026-04-10
          components: rustfmt,clippy

      - name: Confirm exact source head
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "${{ matrix.source_head }}"
          echo "source_head=$actual"

      - name: Execute base RED and candidate GREEN
        shell: bash
        env:
          LANE: ${{ matrix.lane }}
        run: |
          set -euo pipefail

          test_name=""
          if [ "$LANE" = "minifier-member" ]; then
            cargo test -p swc_ecma_minifier --features concurrent --features par-core/chili --test compress -- --list | tee /tmp/minifier-tests.list
            test_name="$(grep -i 'instanceof.*member.*extraction' /tmp/minifier-tests.list | head -n 1 | sed 's/: test$//')"
            if [ -z "$test_name" ]; then
              echo "::error::Unable to locate the instanceof member-extraction fixture test"
              exit 41
            fi
            echo "minifier_test=$test_name"
          fi

          run_focused_test() {
            case "$LANE" in
              utils)
                cargo test -p swc_ecma_utils --test operator_effects -- --nocapture
                ;;
              transforms)
                cargo test -p swc_ecma_transforms_optimization --test operator_effects -- --nocapture
                ;;
              minifier-member)
                cargo test -p swc_ecma_minifier --features concurrent --features par-core/chili --test compress "$test_name" -- --exact --nocapture
                ;;
              folding)
                cargo test -p swc_ecma_transforms_optimization --test instanceof_folding -- --nocapture
                ;;
              *)
                echo "unknown lane: $LANE" >&2
                return 42
                ;;
            esac
          }

          set +e
          run_focused_test 2>&1 | tee /tmp/red.log
          red_status=${PIPESTATUS[0]}
          set -e

          if [ "$red_status" -eq 0 ]; then
            echo "::error::Expected the base regression to fail, but it passed"
            exit 43
          fi
          if ! grep -q 'test result: FAILED' /tmp/red.log; then
            echo "::error::Base command failed before producing a test assertion failure"
            exit 44
          fi

          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          lane = os.environ["LANE"]

          if lane == "folding":
              path = Path("crates/swc_ecma_transforms_optimization/src/simplify/expr/mod.rs")
              text = path.read_text()
              needle = '        op!("instanceof") => {'
              start = text.find(needle)
              if start < 0:
                  raise SystemExit("instanceof simplifier arm not found")

              open_brace = text.find("{", start)
              depth = 0
              end = None
              for index in range(open_brace, len(text)):
                  char = text[index]
                  if char == "{":
                      depth += 1
                  elif char == "}":
                      depth -= 1
                      if depth == 0:
                          end = index + 1
                          break

              if end is None:
                  raise SystemExit("instanceof simplifier arm was not balanced")

              text = text[:start] + '        op!("instanceof") => {}' + text[end:]
              path.write_text(text)
          else:
              path = Path("crates/swc_ecma_utils/src/lib.rs")
              text = path.read_text()

              classification = re.compile(
                  r'(?m)^(?P<i>[ \t]*)Expr::Bin\(BinExpr \{ left, right, \.\. \}\) => \{\n'
                  r'(?P=i)    left\.may_have_side_effects\(ctx\) \|\| right\.may_have_side_effects\(ctx\)\n'
                  r'(?P=i)\}'
              )

              def add_instanceof_classification(match):
                  i = match.group('i')
                  prefix = (
                      f'{i}Expr::Bin(BinExpr {{\n'
                      f'{i}    op: op!("instanceof"),\n'
                      f'{i}    ..\n'
                      f'{i}}}) => true,\n'
                  )
                  return prefix + match.group(0)

              text, classification_count = classification.subn(
                  add_instanceof_classification, text, count=1
              )
              if classification_count != 1:
                  raise SystemExit(
                      f"classification patch context matched {classification_count} times"
                  )

              extraction = re.compile(
                  r'(?m)^(?P<i>[ \t]*)Expr::Bin\(BinExpr \{ left, right, \.\. \}\) => \{\n'
                  r'(?P=i)    self\.extract_side_effects_to\(to, \*left\);\n'
                  r'(?P=i)    self\.extract_side_effects_to\(to, \*right\);\n'
                  r'(?P=i)\}'
              )

              def add_instanceof_extraction(match):
                  i = match.group('i')
                  prefix = (
                      f'{i}Expr::Bin(BinExpr {{\n'
                      f'{i}    op: op!("instanceof"),\n'
                      f'{i}    ..\n'
                      f'{i}}}) => {{\n'
                      f'{i}    to.push(Box::new(expr));\n'
                      f'{i}}}\n'
                  )
                  return prefix + match.group(0)

              text, extraction_count = extraction.subn(
                  add_instanceof_extraction, text, count=1
              )
              if extraction_count != 1:
                  raise SystemExit(
                      f"extraction patch context matched {extraction_count} times"
                  )

              path.write_text(text)
          PY

          cargo fmt --all -- --check
          run_focused_test 2>&1 | tee /tmp/green.log

          echo "RED confirmed at ${{ matrix.source_head }}"
          if [ "$LANE" = "folding" ]; then
            echo "GREEN confirmed with the in-runner candidate that disables unconditional instanceof folding"
          else
            echo "GREEN confirmed with the in-runner two-branch instanceof effect candidate"
          fi
