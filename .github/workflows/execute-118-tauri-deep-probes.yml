name: execute-118-tauri-deep-probes

on:
  push:
    branches:
      - 'execute/118-tauri-listener-panic'

permissions:
  contents: read

jobs:
  authority-deny-scope:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: tauri-apps/tauri
          ref: 34ec18ba5e1acabebd66ae79d6fc746f63d8eb96
          path: target-tauri
          persist-credentials: false
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential curl libappindicator3-dev libgtk-3-dev librsvg2-dev \
            libssl-dev libwebkit2gtk-4.1-dev wget
      - name: Pin Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version
          cargo --version
      - name: Inject tests
        run: cat programmes/high-leverage-open-source/scouts/tauri-authority-packaging-lifecycle/probe/authority_deny_scope_test.rs >> target-tauri/crates/tauri/src/ipc/authority.rs
      - name: Require baseline cross-scope deny failures
        working-directory: target-tauri
        shell: bash
        run: |
          set +e
          cargo test -p tauri --lib --no-default-features fieldwork_deny_scope_tests -- --nocapture 2>&1 | tee /tmp/base.log
          status=${PIPESTATUS[0]}
          set -e
          test "$status" -ne 0
          grep -F 'deny rule for another origin blocked local access' /tmp/base.log
          grep -F 'deny rule for another window blocked main-window access' /tmp/base.log
      - name: Apply candidate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('target-tauri/crates/tauri/src/ipc/authority.rs')
          s=p.read_text()
          old="""    if self
      .denied_commands
      .get(command)
      .map(|resolved| resolved.iter().any(|cmd| origin.matches(&cmd.context)))
      .is_some()
    {
"""
          new="""    if self.denied_commands.get(command).is_some_and(|resolved| {
      resolved.iter().any(|cmd| {
        origin.matches(&cmd.context)
          && (cmd.webviews.iter().any(|w| w.matches(webview))
            || cmd.windows.iter().any(|w| w.matches(window)))
      })
    }) {
"""
          if old not in s: raise SystemExit('deny branch not found')
          p.write_text(s.replace(old,new,1))
          PY
          git -C target-tauri diff --check
      - name: Require candidate controls to pass
        working-directory: target-tauri
        run: cargo test -p tauri --lib --no-default-features fieldwork_deny_scope_tests -- --nocapture

  js-filter-panic:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: tauri-apps/tauri
          ref: 34ec18ba5e1acabebd66ae79d6fc746f63d8eb96
          path: target-tauri
          persist-credentials: false
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential curl libappindicator3-dev libgtk-3-dev librsvg2-dev \
            libssl-dev libwebkit2gtk-4.1-dev wget
      - name: Pin Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version
          cargo --version
      - name: Inject test
        run: |
          python3 - <<'PY'
          from pathlib import Path
          target=Path('target-tauri/crates/tauri/src/event/listener.rs')
          snippet=Path('programmes/high-leverage-open-source/scouts/tauri-authority-packaging-lifecycle/probe/js_filter_panic_test.rs').read_text()
          text=target.read_text(); pos=text.rfind('\n}')
          if pos < 0: raise SystemExit('test module close not found')
          target.write_text(text[:pos]+'\n'+snippet+text[pos:])
          PY
      - name: Require baseline poison failure
        working-directory: target-tauri
        shell: bash
        run: |
          set +e
          cargo test -p tauri --lib --no-default-features --features test js_filter_panic_does_not_poison_listener_registry -- --nocapture 2>&1 | tee /tmp/base.log
          status=${PIPESTATUS[0]}
          set -e
          test "$status" -ne 0
          grep -F 'JS listener registry was poisoned by filter panic' /tmp/base.log
      - name: Apply candidate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('target-tauri/crates/tauri/src/event/listener.rs'); s=p.read_text()
          old="""    let event = &emit_args.event;
    let js_listeners = self.inner.js_event_listeners.lock().unwrap();
    webviews.try_for_each(|webview| {
      if let Some(handlers) = js_listeners.get(webview.label()).and_then(|s| s.get(event)) {
        let ids = handlers
          .iter()
          .filter(|handler| match_any_or_filter(&handler.target, &filter))
          .map(|handler| handler.id)
          .collect::<Vec<_>>();
        webview.emit_js(emit_args, &ids)?;
      }

      Ok(())
    })
"""
          new="""    let event = &emit_args.event;
    let js_listeners = self.inner.js_event_listeners.lock().unwrap();
    let result = std::panic::catch_unwind(std::panic::AssertUnwindSafe(|| {
      webviews.try_for_each(|webview| {
        if let Some(handlers) = js_listeners.get(webview.label()).and_then(|s| s.get(event)) {
          let ids = handlers
            .iter()
            .filter(|handler| match_any_or_filter(&handler.target, &filter))
            .map(|handler| handler.id)
            .collect::<Vec<_>>();
          webview.emit_js(emit_args, &ids)?;
        }
        Ok(())
      })
    }));
    drop(js_listeners);
    match result {
      Ok(result) => result,
      Err(payload) => std::panic::resume_unwind(payload),
    }
"""
          if old not in s: raise SystemExit('emit_js_filter body not found')
          p.write_text(s.replace(old,new,1))
          PY
          git -C target-tauri diff --check
      - name: Require candidate to pass
        working-directory: target-tauri
        run: cargo test -p tauri --lib --no-default-features --features test js_filter_panic_does_not_poison_listener_registry -- --nocapture

  invoke-headers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: tauri-apps/tauri
          ref: 34ec18ba5e1acabebd66ae79d6fc746f63d8eb96
          path: target-tauri
          persist-credentials: false
      - name: Confirm contracts and run model
        run: |
          node --version
          grep -F 'interface InvokeOptions' target-tauri/packages/api/src/core.ts
          grep -F 'headers: HeadersInit' target-tauri/packages/api/src/core.ts
          grep -F 'HashMap::<String, String>::deserialize' target-tauri/crates/tauri/src/ipc/protocol.rs
          node programmes/high-leverage-open-source/scouts/tauri-authority-packaging-lifecycle/probe/invoke_headers_model.mjs
      - name: Check normalization candidate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('target-tauri/crates/tauri/scripts/ipc-protocol.js'); s=p.read_text()
          old="""    } else {
      // otherwise use the postMessage interface
      const { data } = processIpcMessage({
        cmd,
        callback,
        error,
        options: {
          ...options,
          customProtocolIpcBlocked: customProtocolIpcFailed
        },
"""
          new="""    } else {
      // otherwise use the postMessage interface
      const headers = Object.fromEntries(
        new Headers((options && options.headers) || {}).entries()
      )
      const { data } = processIpcMessage({
        cmd,
        callback,
        error,
        options: {
          ...options,
          headers,
          customProtocolIpcBlocked: customProtocolIpcFailed
        },
"""
          if old not in s: raise SystemExit('postMessage branch not found')
          p.write_text(s.replace(old,new,1))
          PY
          node --check target-tauri/crates/tauri/scripts/ipc-protocol.js
          git -C target-tauri diff --check

  resource-target-collision:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: tauri-apps/tauri
          ref: 34ec18ba5e1acabebd66ae79d6fc746f63d8eb96
          path: target-tauri
          persist-credentials: false
      - name: Pin Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version
          cargo --version
      - name: Inject test
        run: cat programmes/high-leverage-open-source/scouts/tauri-authority-packaging-lifecycle/probe/resource_target_collision_test.rs >> target-tauri/crates/tauri-build/src/lib.rs
      - name: Require baseline overwrite failure
        working-directory: target-tauri
        shell: bash
        run: |
          set +e
          cargo test -p tauri-build duplicate_resource_targets_are_rejected -- --nocapture 2>&1 | tee /tmp/base.log
          status=${PIPESTATUS[0]}
          set -e
          test "$status" -ne 0
          grep -F 'duplicate resource targets were silently overwritten' /tmp/base.log
      - name: Apply candidate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('target-tauri/crates/tauri-build/src/lib.rs'); s=p.read_text()
          old="""fn copy_resources(resources: ResourcePaths<'_>, path: &Path) -> Result<()> {
  let path = path.canonicalize()?;
  let mut resources = resources.iter();
  for resource in resources.by_ref() {
    let resource = resource?;

    // avoid copying the resource if target is the same as source
    let src = resource.path().canonicalize()?;
    let target = path.join(resource.target());
    if src != target {
      copy_file(src, target)?;
    }
  }

  for path in resources.rerun_if_changed() {
    println!("cargo:rerun-if-changed={}", path.display());
  }

  Ok(())
}
"""
          new="""fn copy_resources(resources: ResourcePaths<'_>, path: &Path) -> Result<()> {
  let path = path.canonicalize()?;
  let mut resources = resources.iter();
  let mut copies = Vec::new();
  let mut targets = HashMap::new();
  for resource in resources.by_ref() {
    let resource = resource?;
    let src = resource.path().canonicalize()?;
    let target = path.join(resource.target());
    if let Some(previous) = targets.insert(target.clone(), src.clone()) {
      if previous != src {
        return Err(anyhow::anyhow!(
          "resources `{}` and `{}` both target `{}`",
          previous.display(), src.display(), target.display()
        ));
      }
    }
    if src != target { copies.push((src, target)); }
  }
  for (src, target) in copies { copy_file(src, target)?; }
  for path in resources.rerun_if_changed() {
    println!("cargo:rerun-if-changed={}", path.display());
  }
  Ok(())
}
"""
          if old not in s: raise SystemExit('copy_resources body not found')
          p.write_text(s.replace(old,new,1))
          PY
          git -C target-tauri diff --check
      - name: Require candidate to pass
        working-directory: target-tauri
        run: cargo test -p tauri-build duplicate_resource_targets_are_rejected -- --nocapture
