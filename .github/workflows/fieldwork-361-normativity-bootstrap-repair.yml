name: Fieldwork PR 361 repaired-head validation

on:
  pull_request:
    branches:
      - repair/347-unaccepted-state-dependency

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/347-unaccepted-state-dependency
          fetch-depth: 0
      - name: Verify exact repaired head and fence
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "fcb615f998fc0c8a277ff45fd02ed3f308f83d7a"
          git diff --check f12acefc9856711bd737e1f9fc51a8e69e9c7916 HEAD
          test "$(git diff --name-only f12acefc9856711bd737e1f9fc51a8e69e9c7916 HEAD)" = "AGENTS.md"
          git diff --numstat f12acefc9856711bd737e1f9fc51a8e69e9c7916 HEAD -- AGENTS.md | grep -Fx $'1\t1\tAGENTS.md'
          grep -Fq 'Until then, a later clean-kernel experiment may cite #306 only as non-normative architecture under review' AGENTS.md
      - name: Test interaction reference scanner
        run: node scripts/test_interaction_references.js
      - name: Validate batch contracts
        run: python3 scripts/check_fieldwork_integrity.py
