name: Fieldwork Zustand owned fix

on:
  pull_request:
    paths:
      - '.github/workflows/fieldwork-zustand-owned-fix.yml'
      - 'programmes/data-durable-workflows/scouts/zustand-hydration-failure-completion/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused-test:
    name: Node.js ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 22
          - 24
          - 26
    steps:
      - name: Check out owned fork candidate
        uses: actions/checkout@v4
        with:
          repository: teamleaderleo/zustand
          ref: fc68d9c87b821a60731cf15158d549b2b25201ef

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Enable pnpm
        run: corepack enable

      - name: Apply candidate source patch
        run: git apply --check .fieldwork/persist-rehydrate-error-settlement.patch && git apply .fieldwork/persist-rehydrate-error-settlement.patch

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run focused regression
        run: pnpm vitest run tests/persistRehydrateError.test.ts

      - name: Lint focused regression
        run: pnpm eslint tests/persistRehydrateError.test.ts
