name: Fieldwork Zustand owned fix

on:
  pull_request:
    paths:
      - '.github/workflows/fieldwork-zustand-owned-fix.yml'
      - 'programmes/data-durable-workflows/scouts/zustand-hydration-failure-completion/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused-test:
    name: Node.js ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 22
          - 24
          - 26
    steps:
      - name: Check out owned fork candidate
        uses: actions/checkout@v4
        with:
          repository: teamleaderleo/zustand
          ref: 66adffc63c8a4dd6aaee2b5c5761fb71ff35b351

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run persist regression suites
        run: pnpm vitest run tests/persistRehydrateError.test.ts tests/persistAsync.test.tsx tests/persistSync.test.tsx

      - name: Lint changed source and regression
        run: pnpm eslint src/middleware/persist.ts tests/persistRehydrateError.test.ts
