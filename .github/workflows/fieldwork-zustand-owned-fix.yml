name: Fieldwork Zustand owned fix

on:
  pull_request:
    paths:
      - '.github/workflows/fieldwork-zustand-owned-fix.yml'
      - 'programmes/data-durable-workflows/scouts/zustand-hydration-failure-completion/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused-test:
    name: Node.js ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 22
          - 24
          - 26
    steps:
      - name: Check out owned fork candidate
        uses: actions/checkout@v4
        with:
          repository: teamleaderleo/zustand
          ref: be359415bd1b5712131157b7dc149e7cb38e821f

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Enable pnpm
        run: corepack enable

      - name: Apply candidate source patch
        run: git apply --check .fieldwork/persist-rehydrate-error-settlement.patch && git apply .fieldwork/persist-rehydrate-error-settlement.patch

      - name: Stage candidate-only regression
        run: cp .fieldwork/persistRehydrateError.vitest.ts tests/persistRehydrateError.test.ts

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run persist regression suites
        run: pnpm vitest run tests/persistRehydrateError.test.ts tests/persistAsync.test.tsx tests/persistSync.test.tsx

      - name: Lint candidate regression
        run: pnpm eslint .fieldwork/persistRehydrateError.vitest.ts
