name: Fieldwork receipt identity uniqueness repair

on:
  push:
    branches:
      - finding/169-enforce-receipt-schema
    paths:
      - '.github/workflows/fieldwork-receipt-id-uniqueness-repair.yml'

permissions:
  contents: write

concurrency:
  group: fieldwork-receipt-id-uniqueness-repair
  cancel-in-progress: false

jobs:
  repair-test-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: finding/169-enforce-receipt-schema
          fetch-depth: 0
          persist-credentials: true
      - name: Verify reviewed source generation
        run: |
          test "$(git hash-object campaigns/0002-tool-surface-continuity/lanes/L06-effective-surface-diagnostics/artifacts/classify_receipts.py)" = d062fa0e6cb1cbbe59631a1352831f5095da311c
          test "$(git hash-object campaigns/0002-tool-surface-continuity/lanes/L06-effective-surface-diagnostics/artifacts/test_classify_receipts.py)" = 6450d867a7f4b5b2812abe2039444563271761cc
      - name: Enforce document-level receipt identity
        shell: python
        run: |
          from pathlib import Path

          root = Path('campaigns/0002-tool-surface-continuity/lanes/L06-effective-surface-diagnostics/artifacts')
          classifier = root / 'classify_receipts.py'
          text = classifier.read_text(encoding='utf-8')
          old = '''    if "source_boundary" in document and not isinstance(
              document["source_boundary"], dict
          ):
              raise ValueError("document.source_boundary must be an object")
          return document
          '''
          new = '''    if "source_boundary" in document and not isinstance(
              document["source_boundary"], dict
          ):
              raise ValueError("document.source_boundary must be an object")

          seen_receipt_ids: set[str] = set()
          for receipt in receipts:
              validated_receipt = validate_receipt_schema(receipt)
              receipt_id = validated_receipt["receipt_id"]
              if receipt_id in seen_receipt_ids:
                  raise ValueError(f"document has duplicate receipt_id {receipt_id!r}")
              seen_receipt_ids.add(receipt_id)
          return document
          '''
          if text.count(old) != 1:
              raise SystemExit('document validation anchor mismatch')
          classifier.write_text(text.replace(old, new, 1), encoding='utf-8')

          tests = root / 'test_classify_receipts.py'
          text = tests.read_text(encoding='utf-8')
          anchor = '''    def test_privacy_allowlist(self):
          '''
          addition = '''    def test_document_rejects_duplicate_receipt_ids(self):
              document = json.loads(json.dumps(self.document))
              document["receipts"][1]["receipt_id"] = document["receipts"][0][
                  "receipt_id"
              ]
              with self.assertRaisesRegex(ValueError, "duplicate receipt_id"):
                  validate_document(document)

          '''
          if 'test_document_rejects_duplicate_receipt_ids' in text:
              raise SystemExit('duplicate receipt regression already exists')
          if text.count(anchor) != 1:
              raise SystemExit('test insertion anchor mismatch')
          tests.write_text(text.replace(anchor, addition + anchor, 1), encoding='utf-8')
      - name: Execute focused gate
        working-directory: campaigns/0002-tool-surface-continuity/lanes/L06-effective-surface-diagnostics/artifacts
        run: |
          python3 -m py_compile classify_receipts.py test_classify_receipts.py
          python3 test_classify_receipts.py
          python3 classify_receipts.py fixtures.json --output /tmp/receipt-classifier-latest.json
          cmp /tmp/receipt-classifier-latest.json results/latest.json
      - name: Publish source-only repair
        run: |
          rm .github/workflows/fieldwork-receipt-id-uniqueness-repair.yml
          git diff --check
          git config user.name fieldwork-ci
          git config user.email fieldwork-ci@users.noreply.github.com
          git add campaigns .github/workflows
          git commit -m 'diagnostics: reject duplicate receipt identities'
          git push origin HEAD:finding/169-enforce-receipt-schema
