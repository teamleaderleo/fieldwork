name: Playwright symlink file boundary research

on:
  pull_request:
    paths:
      - ".github/workflows/playwright-symlink-file-boundary-research.yml"

permissions:
  contents: read

jobs:
  validate:
    name: Explicit filename preserves allowed-root boundary
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out carrier
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: fieldwork
          persist-credentials: false

      - name: Check out exact Playwright research head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: teamleaderleo/playwright
          ref: 72e8fef9cf96623aeef2c3f023eac55969ba0afd
          fetch-depth: 0
          path: playwright
          persist-credentials: false

      - name: Set up Node 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: playwright/package-lock.json

      - name: Verify exact research diff
        shell: bash
        run: |
          set -euo pipefail
          source="72e8fef9cf96623aeef2c3f023eac55969ba0afd"
          base="931121dc6f1ce8d672ce2bd5845220203cb98920"
          test "$(git -C playwright rev-parse HEAD)" = "$source"
          git -C playwright cat-file -e "$base^{commit}"
          git -C playwright diff --check "$base" "$source"
          test "$(git -C playwright diff --name-only "$base" "$source")" = "tests/mcp/file-access-research.spec.ts"

      - name: Install dependencies
        working-directory: playwright
        run: npm ci

      - name: Build source
        working-directory: playwright
        run: npm run build

      - name: Install Chromium and Linux dependencies
        working-directory: playwright
        run: npx playwright install --with-deps chromium

      - name: Run focused file-boundary regression
        shell: bash
        working-directory: playwright
        env:
          CI: "1"
        run: |
          set -o pipefail
          mkdir -p ../fieldwork-receipts
          set +e
          npm run test-mcp tests/mcp/file-access-research.spec.ts -- --project=chromium 2>&1 | tee ../fieldwork-receipts/file-boundary-test.log
          status=${PIPESTATUS[0]}
          set -e
          {
            echo "source=72e8fef9cf96623aeef2c3f023eac55969ba0afd"
            echo "base=931121dc6f1ce8d672ce2bd5845220203cb98920"
            echo "test_status=$status"
          } > ../fieldwork-receipts/file-boundary-receipt.txt
          exit "$status"

      - name: Upload receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: playwright-symlink-file-boundary-${{ github.run_id }}-${{ github.run_attempt }}
          path: fieldwork-receipts/
          if-no-files-found: warn
          retention-days: 14
