name: Fieldwork Playwright MCP sandbox CLI validation

on:
  pull_request:
    paths:
      - ".github/workflows/fieldwork-playwright-mcp-sandbox-cli-validation.yml"

permissions:
  contents: read

jobs:
  validate:
    name: MCP sandbox CLI receipt on Ubuntu
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out execution carrier
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: fieldwork
          persist-credentials: false

      - name: Check out exact Playwright source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: microsoft/playwright
          ref: 931121dc6f1ce8d672ce2bd5845220203cb98920
          fetch-depth: 1
          path: playwright
          persist-credentials: false

      - name: Set up Node 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: playwright/package-lock.json

      - name: Verify exact source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C playwright rev-parse HEAD)" = "931121dc6f1ce8d672ce2bd5845220203cb98920"
          mkdir -p fieldwork-receipts
          echo "source=931121dc6f1ce8d672ce2bd5845220203cb98920" > fieldwork-receipts/playwright-mcp-sandbox-cli-receipt.txt

      - name: Install exact dependencies
        working-directory: playwright
        run: npm ci

      - name: Build exact source
        working-directory: playwright
        run: npm run build

      - name: Install Chrome and Linux dependencies
        working-directory: playwright
        run: npx playwright install --with-deps chrome

      - name: Add execution-only regression probe
        shell: bash
        working-directory: playwright
        run: |
          cat > tests/mcp/fieldwork-sandbox-cli.spec.ts <<'EOF'
          import { execFileSync } from 'child_process';
          import { test, expect } from './fixtures';
          import { tools } from '../../packages/playwright-core/lib/coreBundle';

          test('real MCP CLI default disagrees with sandbox config default', async ({ startClient, server }) => {
            const config = await tools.resolveCLIConfigForMCP({ browser: 'chrome' }, {});
            expect(config.browser.launchOptions.chromiumSandbox).toBe(true);

            const { client } = await startClient();
            await client.callTool({
              name: 'browser_navigate',
              arguments: { url: server.PREFIX },
            });

            const processList = execFileSync('ps', ['-eo', 'args='], { encoding: 'utf8' });
            const profileRoot = test.info().outputPath('ms-playwright');
            const browserLines = processList.split('\n').filter(line =>
              line.includes(profileRoot) &&
              line.includes('--remote-debugging-pipe') &&
              !line.includes('--type=')
            );

            console.log('resolved chromiumSandbox:', config.browser.launchOptions.chromiumSandbox);
            console.log('browser process:', browserLines.join('\n'));

            expect(browserLines).toHaveLength(1);
            expect(browserLines[0]).toContain('--no-sandbox');
          });
          EOF

      - name: Run real MCP CLI probe
        shell: bash
        working-directory: playwright
        env:
          CI: "1"
        run: |
          set -o pipefail
          npm run test-mcp tests/mcp/fieldwork-sandbox-cli.spec.ts -- --project=chrome 2>&1 | tee ../fieldwork-receipts/playwright-mcp-sandbox-cli-test.log

      - name: Record receipt
        if: always()
        shell: bash
        run: |
          {
            echo "carrier=${{ github.event.pull_request.head.sha }}"
            echo "source=931121dc6f1ce8d672ce2bd5845220203cb98920"
            echo "platform=ubuntu-24.04"
          } >> fieldwork-receipts/playwright-mcp-sandbox-cli-receipt.txt

      - name: Upload receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: playwright-mcp-sandbox-cli-${{ github.run_id }}-${{ github.run_attempt }}
          path: fieldwork-receipts/
          if-no-files-found: error
          retention-days: 14
