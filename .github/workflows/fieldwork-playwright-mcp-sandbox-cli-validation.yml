name: Fieldwork Playwright MCP CLI validation

on:
  pull_request:
    paths:
      - ".github/workflows/fieldwork-playwright-mcp-sandbox-cli-validation.yml"

permissions:
  contents: read

jobs:
  validate:
    name: MCP CLI parser receipts on Ubuntu
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out execution carrier
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: fieldwork
          persist-credentials: false

      - name: Check out exact Playwright source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: microsoft/playwright
          ref: 931121dc6f1ce8d672ce2bd5845220203cb98920
          fetch-depth: 1
          path: playwright
          persist-credentials: false

      - name: Set up Node 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: playwright/package-lock.json

      - name: Verify exact source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C playwright rev-parse HEAD)" = "931121dc6f1ce8d672ce2bd5845220203cb98920"
          mkdir -p fieldwork-receipts
          echo "source=931121dc6f1ce8d672ce2bd5845220203cb98920" > fieldwork-receipts/playwright-mcp-cli-receipt.txt

      - name: Install exact dependencies
        working-directory: playwright
        run: npm ci

      - name: Build exact source
        working-directory: playwright
        run: npm run build

      - name: Install Chrome and Linux dependencies
        working-directory: playwright
        run: npx playwright install --with-deps chrome

      - name: Add execution-only probes
        shell: bash
        working-directory: playwright
        run: |
          cat > tests/mcp/fieldwork-cli-parser.spec.ts <<'EOF'
          import fs from 'fs';
          import { execFileSync } from 'child_process';
          import { Command } from 'commander';
          import { test, expect } from './fixtures';
          import { tools } from '../../packages/playwright-core/lib/coreBundle';
          import { commaSeparatedList } from '../../packages/playwright-core/src/tools/mcp/config';

          test('explicit --sandbox is lost before it can override config', async ({ startClient, server }, testInfo) => {
            const configFile = testInfo.outputPath('config.json');
            await fs.promises.writeFile(configFile, JSON.stringify({
              browser: { launchOptions: { chromiumSandbox: false } },
            }));

            // The resolver itself has the expected precedence when given sandbox:true.
            const direct = await tools.resolveCLIConfigForMCP({
              browser: 'chrome',
              config: configFile,
              sandbox: true,
            }, {});
            expect(direct.browser.launchOptions.chromiumSandbox).toBe(true);

            // The real Commander path normalizes the explicit true to undefined,
            // so the config-file false survives and Chrome launches with --no-sandbox.
            const { client } = await startClient({
              args: [`--config=${configFile}`, '--sandbox'],
            });
            await client.callTool({
              name: 'browser_navigate',
              arguments: { url: server.PREFIX },
            });

            const processList = execFileSync('ps', ['-eo', 'args='], { encoding: 'utf8' });
            const browserLines = processList.split('\n').filter(line =>
              line.includes('--remote-debugging-pipe') &&
              !line.includes('--type=')
            );
            console.log('direct chromiumSandbox:', direct.browser.launchOptions.chromiumSandbox);
            console.log('browser process:', browserLines.join('\n'));
            expect(browserLines.length).toBeGreaterThan(0);
            expect(browserLines.some(line => line.includes('--no-sandbox'))).toBe(true);
          });

          test('unknown browser silently resolves to default Chrome', async () => {
            const config = await tools.resolveCLIConfigForMCP({ browser: 'definitely-not-a-browser' }, {});
            console.log('unknown browser resolved as:', JSON.stringify({
              browserName: config.browser.browserName,
              channel: config.browser.launchOptions.channel,
            }));
            expect(config.browser.browserName).toBe('chromium');
            expect(config.browser.launchOptions.channel).toBe('chrome');
          });

          test('unknown device silently resolves to default context', async () => {
            const config = await tools.resolveCLIConfigForMCP({ device: 'Definitely Not A Device' }, {});
            console.log('unknown device context:', JSON.stringify(config.browser.contextOptions));
            expect(config.browser.contextOptions.userAgent).toBeUndefined();
            expect(config.browser.contextOptions.isMobile).toBeUndefined();
          });

          test('documented PLAYWRIGHT_MCP_NO_SANDBOX env is ignored', async () => {
            const config = await tools.resolveCLIConfigForMCP({ browser: 'chrome' }, {
              PLAYWRIGHT_MCP_NO_SANDBOX: '1',
            });
            console.log('NO_SANDBOX env chromiumSandbox:', config.browser.launchOptions.chromiumSandbox);
            expect(config.browser.launchOptions.chromiumSandbox).toBe(true);
          });

          test('custom comma parser drops earlier values from variadic option', () => {
            const command = new Command();
            command.exitOverride();
            command.option('--grant-permissions <permissions...>', '', commaSeparatedList);
            command.parse(['--grant-permissions', 'geolocation', 'clipboard-read'], { from: 'user' });
            console.log('parsed grant permissions:', JSON.stringify(command.opts().grantPermissions));
            expect(command.opts().grantPermissions).toEqual(['clipboard-read']);
          });
          EOF

      - name: Run MCP CLI probes
        shell: bash
        working-directory: playwright
        env:
          CI: "1"
        run: |
          set -o pipefail
          npm run test-mcp tests/mcp/fieldwork-cli-parser.spec.ts -- --project=chrome 2>&1 | tee ../fieldwork-receipts/playwright-mcp-cli-test.log

      - name: Record receipt
        if: always()
        shell: bash
        run: |
          {
            echo "carrier=${{ github.event.pull_request.head.sha }}"
            echo "source=931121dc6f1ce8d672ce2bd5845220203cb98920"
            echo "platform=ubuntu-24.04"
          } >> fieldwork-receipts/playwright-mcp-cli-receipt.txt

      - name: Upload receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: playwright-mcp-cli-${{ github.run_id }}-${{ github.run_attempt }}
          path: fieldwork-receipts/
          if-no-files-found: error
          retention-days: 14
