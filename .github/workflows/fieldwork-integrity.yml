name: Fieldwork integrity

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Test interaction reference scanner
        run: node scripts/test_interaction_references.js
      - name: Validate batch contracts
        run: python3 scripts/check_fieldwork_integrity.py

  swc-mapped-arguments-probe:
    if: github.event_name == 'pull_request' && github.head_ref == 'fieldwork/execution/swc-mapped-arguments-probe'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: "0"
      RUST_BACKTRACE: "1"
    steps:
      - name: Check out pinned SWC
        uses: actions/checkout@v4
        with:
          repository: teamleaderleo/swc
          ref: 5bf27fd72e4667bac6cc86888b8facb8b91f8077
          fetch-depth: 0

      - name: Install SWC Rust toolchain
        run: |
          rustup toolchain install nightly-2026-04-10 --profile minimal
          rustup override set nightly-2026-04-10

      - name: Prepare mapped-arguments runtime fixture
        shell: bash
        run: |
          set -euo pipefail
          dir=crates/swc_ecma_minifier/tests/fixture/fieldwork/mapped-arguments-nested-write
          mkdir -p "$dir"
          cat > "$dir/config.json" <<'JSON'
          {
              "defaults": true
          }
          JSON
          cat > "$dir/input.js" <<'JS'
          function run(f) {
              f();
          }

          function sloppy(b) {
              run(() => {
                  b = 2;
              });
              return arguments[0];
          }

          function strict(b) {
              "use strict";
              run(() => {
                  b = 2;
              });
              return arguments[0];
          }

          console.log(sloppy(1), strict(1));
          JS
          printf '2 1\n' > "$dir/expected.stdout"

      - name: Run current default-compressor runtime oracle
        shell: bash
        run: |
          set -euo pipefail
          UPDATE=1 cargo test -p swc_ecma_minifier --test compress -- mapped_arguments_nested_write --nocapture 2>&1 | tee /tmp/mapped-arguments.log
          echo '--- generated output.js ---'
          cat crates/swc_ecma_minifier/tests/fixture/fieldwork/mapped-arguments-nested-write/output.js

      - name: Confirm generated output remains runtime-correct without UPDATE
        run: cargo test -p swc_ecma_minifier --test compress -- mapped_arguments_nested_write --nocapture
