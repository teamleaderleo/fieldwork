name: Fieldwork integrity

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Test interaction reference scanner
        run: node scripts/test_interaction_references.js
      - name: Validate batch contracts
        run: python3 scripts/check_fieldwork_integrity.py
      - name: Test coordination state contracts
        run: python3 scripts/test_coordination_state.py
      - name: Validate coordination state
        run: python3 scripts/validate_coordination_state.py
      - name: Test coordination views
        run: python3 scripts/test_coordination_views.py
      - name: Render empty coordination views
        run: python3 scripts/render_coordination_views.py --output-dir /tmp/coordination-views
