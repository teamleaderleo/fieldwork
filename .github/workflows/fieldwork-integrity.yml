name: Fieldwork integrity

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Test interaction reference scanner
        run: node scripts/test_interaction_references.js
      - name: Validate batch contracts
        run: python3 scripts/check_fieldwork_integrity.py

  execute-tauri-authority-deny-scope:
    if: github.head_ref == 'execute/118-tauri-listener-panic'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out carrier
        uses: actions/checkout@v4
      - name: Check out pinned Tauri source
        uses: actions/checkout@v4
        with:
          repository: tauri-apps/tauri
          ref: 34ec18ba5e1acabebd66ae79d6fc746f63d8eb96
          path: target-tauri
          persist-credentials: false
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential curl libappindicator3-dev libgtk-3-dev librsvg2-dev \
            libssl-dev libwebkit2gtk-4.1-dev wget
      - name: Pin Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version
          cargo --version
      - name: Inject authority regressions
        run: cat programmes/high-leverage-open-source/scouts/tauri-authority-packaging-lifecycle/probe/authority_deny_scope_test.rs >> target-tauri/crates/tauri/src/ipc/authority.rs
      - name: Require baseline cross-scope deny failures
        working-directory: target-tauri
        shell: bash
        run: |
          set +e
          cargo test -p tauri --lib --no-default-features fieldwork_deny_scope_tests -- --nocapture 2>&1 | tee /tmp/authority-baseline.log
          status=${PIPESTATUS[0]}
          set -e
          test "$status" -ne 0
          grep -F 'deny rule for another origin blocked local access' /tmp/authority-baseline.log
          grep -F 'deny rule for another window blocked main-window access' /tmp/authority-baseline.log
      - name: Apply scoped-deny candidate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('target-tauri/crates/tauri/src/ipc/authority.rs')
          text = path.read_text()
          old = """    if self
      .denied_commands
      .get(command)
      .map(|resolved| resolved.iter().any(|cmd| origin.matches(&cmd.context)))
      .is_some()
    {
"""
          new = """    if self.denied_commands.get(command).is_some_and(|resolved| {
      resolved.iter().any(|cmd| {
        origin.matches(&cmd.context)
          && (cmd.webviews.iter().any(|w| w.matches(webview))
            || cmd.windows.iter().any(|w| w.matches(window)))
      })
    }) {
"""
          if old not in text:
              raise SystemExit('expected resolve_access deny branch not found')
          path.write_text(text.replace(old, new, 1))
          PY
          git -C target-tauri diff --check
      - name: Require candidate to pass all controls
        working-directory: target-tauri
        run: cargo test -p tauri --lib --no-default-features fieldwork_deny_scope_tests -- --nocapture
