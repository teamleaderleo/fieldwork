name: Fieldwork integrity

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Test interaction reference scanner
        run: node scripts/test_interaction_references.js
      - name: Validate batch contracts
        run: python3 scripts/check_fieldwork_integrity.py

  swc-instanceof-red-green:
    if: github.event_name == 'pull_request' && github.head_ref == 'fieldwork/execution/swc-instanceof-red-green'
    name: SWC ${{ matrix.lane }} RED -> GREEN
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: utils
            source_head: 7f02482bdcecafdbf2b7c8d5d3667e2f9db6211b
          - lane: transforms
            source_head: 1bfc544804d8c5f675a064f6670511973fc30f52
          - lane: minifier-member
            source_head: ea9d75c2bf1effd3fb8a191c030380961a1eaa15
    env:
      CARGO_HTTP_MULTIPLEXING: "false"
      CARGO_INCREMENTAL: "0"
      CARGO_NET_RETRY: "10"
      RUST_BACKTRACE: "1"
    steps:
      - name: Checkout exact owned-fork source head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: teamleaderleo/swc
          ref: ${{ matrix.source_head }}
          persist-credentials: false
          submodules: true

      - name: Install SWC Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: nightly-2026-04-10
          components: rustfmt,clippy

      - name: Confirm exact source head
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "${{ matrix.source_head }}"
          echo "source_head=$actual"

      - name: Execute base RED and candidate GREEN
        shell: bash
        env:
          LANE: ${{ matrix.lane }}
        run: |
          set -euo pipefail

          test_name=""
          if [ "$LANE" = "minifier-member" ]; then
            cargo test -p swc_ecma_minifier --features concurrent --features par-core/chili --test compress -- --list | tee /tmp/minifier-tests.list
            test_name="$(grep -i 'instanceof.*member.*extraction' /tmp/minifier-tests.list | head -n 1 | sed 's/: test$//')"
            if [ -z "$test_name" ]; then
              echo "::error::Unable to locate the instanceof member-extraction fixture test"
              exit 41
            fi
            echo "minifier_test=$test_name"
          fi

          run_focused_test() {
            case "$LANE" in
              utils)
                cargo test -p swc_ecma_utils --test operator_effects -- --nocapture
                ;;
              transforms)
                cargo test -p swc_ecma_transforms_optimization --test operator_effects -- --nocapture
                ;;
              minifier-member)
                cargo test -p swc_ecma_minifier --features concurrent --features par-core/chili --test compress "$test_name" -- --exact --nocapture
                ;;
              *)
                echo "unknown lane: $LANE" >&2
                return 42
                ;;
            esac
          }

          set +e
          run_focused_test 2>&1 | tee /tmp/red.log
          red_status=${PIPESTATUS[0]}
          set -e

          if [ "$red_status" -eq 0 ]; then
            echo "::error::Expected the base regression to fail, but it passed"
            exit 43
          fi
          if ! grep -q 'test result: FAILED' /tmp/red.log; then
            echo "::error::Base command failed before producing a test assertion failure"
            exit 44
          fi

          python3 - <<'PY'
          from pathlib import Path

          path = Path("crates/swc_ecma_utils/src/lib.rs")
          text = path.read_text()

          classification_old = '''        Expr::Unary(UnaryExpr { arg, .. }) => arg.may_have_side_effects(ctx),
          Expr::Bin(BinExpr { left, right, .. }) => {
              left.may_have_side_effects(ctx) || right.may_have_side_effects(ctx)
          }
          '''
          classification_new = '''        Expr::Unary(UnaryExpr { arg, .. }) => arg.may_have_side_effects(ctx),
          Expr::Bin(BinExpr {
              op: op!("instanceof"),
              ..
          }) => true,
          Expr::Bin(BinExpr { left, right, .. }) => {
              left.may_have_side_effects(ctx) || right.may_have_side_effects(ctx)
          }
          '''

          extraction_old = '''            Expr::Bin(BinExpr { op, .. }) if op.may_short_circuit() => {
              to.push(Box::new(expr));
          }
          Expr::Bin(BinExpr { left, right, .. }) => {
              self.extract_side_effects_to(to, *left);
              self.extract_side_effects_to(to, *right);
          }
          '''
          extraction_new = '''            Expr::Bin(BinExpr { op, .. }) if op.may_short_circuit() => {
              to.push(Box::new(expr));
          }
          Expr::Bin(BinExpr {
              op: op!("instanceof"),
              ..
          }) => {
              to.push(Box::new(expr));
          }
          Expr::Bin(BinExpr { left, right, .. }) => {
              self.extract_side_effects_to(to, *left);
              self.extract_side_effects_to(to, *right);
          }
          '''

          if text.count(classification_old) != 1:
              raise SystemExit("classification patch context did not match exactly once")
          if text.count(extraction_old) != 1:
              raise SystemExit("extraction patch context did not match exactly once")

          text = text.replace(classification_old, classification_new, 1)
          text = text.replace(extraction_old, extraction_new, 1)
          path.write_text(text)
          PY

          cargo fmt --all -- --check
          run_focused_test 2>&1 | tee /tmp/green.log

          echo "RED confirmed at ${{ matrix.source_head }}"
          echo "GREEN confirmed with the in-runner two-branch instanceof candidate"
