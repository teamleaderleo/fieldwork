name: Fieldwork integrity

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Test interaction reference scanner
        run: node scripts/test_interaction_references.js
      - name: Validate batch contracts
        run: python3 scripts/check_fieldwork_integrity.py
      - name: Validate compendium entries
        run: node scripts/compendium-index.mjs validate
      - name: Smoke-test compendium retrieval
        run: |
          node scripts/compendium-index.mjs search "external effect retry" | grep -F 'ambiguous-external-outcome'
          node scripts/compendium-index.mjs search "selected work success" | grep -F 'false-success-after-incomplete-work'
          node scripts/compendium-index.mjs search "validation identity change" | grep -F 'validated-identity-goes-stale-before-use'
          node scripts/compendium-index.mjs search "normalization cache identity" | grep -F 'normalization-erases-semantic-distinction'
          node scripts/compendium-index.mjs search "older generation publication" | grep -F 'stale-generation-publication'
          node scripts/compendium-index.mjs search "generation aba" | grep -F 'recycled-generation-aba'
          node scripts/compendium-index.mjs search "shared promise child" | grep -F 'shared-terminal-operation-self-dependency'
          node scripts/compendium-index.mjs search "opening membership mutation" | grep -F 'fanout-iterates-live-membership'
          node scripts/compendium-index.mjs search "whole message mutation" | grep -F 'element-loop-becomes-accidental-transaction-boundary'
          node scripts/compendium-index.mjs search "skipped proof green" | grep -F 'suite-green-while-discriminator-skipped'
          node scripts/compendium-index.mjs search "checksum representation" | grep -F 'fingerprint-consumes-authoritative-representation'
          node scripts/compendium-index.mjs related publication-before-ownership | grep -F 'ownership-before-publication'
      - name: Smoke-test compendium structured packets
        run: |
          node scripts/compendium-index.mjs packet ambiguous-external-outcome > /tmp/packet.json
          node -e "const p=require('/tmp/packet.json'); if (p.root !== 'ambiguous-external-outcome' || !p.entries.some(e => e.id === 'remote-effect-certainty') || p.entries.length > 50) process.exit(1)"
          node scripts/compendium-index.mjs export > /tmp/compendium.json
          node -e "const i=require('/tmp/compendium.json'); if (i.schema !== 1 || i.entries.length < 30 || !i.entries.some(e => e.kind === 'anti-pattern') || !i.entries.some(e => e.kind === 'executable-graduation')) process.exit(1)"
          node scripts/compendium-index.mjs stats > /tmp/stats.json
          node -e "const s=require('/tmp/stats.json'); if (s.entries < 30 || s.relations < 10 || s.cases < 10) process.exit(1)"
      - name: Smoke-test compendium curation hints
        run: |
          node scripts/compendium-curate.mjs --json > /tmp/curation.json
          node -e "const c=require('/tmp/curation.json'); const ids=new Set(c.queues.map(q => q.id)); if (c.schema !== 1 || c.entries < 30 || !ids.has('graph-orphans') || !ids.has('thin-candidates') || !ids.has('mature-boundary-review')) process.exit(1)"
