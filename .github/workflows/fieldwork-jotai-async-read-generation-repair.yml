name: Fieldwork Jotai async read generation repair

on:
  pull_request:
    paths:
      - '.github/workflows/fieldwork-jotai-async-read-generation-repair.yml'
      - 'programmes/data-durable-workflows/scouts/jotai-json-storage-key-isolation/candidate.patch'
      - 'programmes/data-durable-workflows/scouts/jotai-json-storage-key-isolation/async-read-generation-candidate.patch'
      - 'programmes/data-durable-workflows/scouts/jotai-json-storage-key-isolation/atomWithStorageKeyIsolation.test.ts'
      - 'programmes/data-durable-workflows/scouts/jotai-json-storage-key-isolation/atomWithStorageReadInvalidation.test.ts'
      - 'programmes/data-durable-workflows/scouts/jotai-json-storage-key-isolation/atomWithStorageAsyncReadGenerationRepair.test.ts'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repair:
    name: Node.js ${{ matrix.node-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 22
          - 24
          - 26
    steps:
      - name: Check out Fieldwork repair
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          path: fieldwork
          persist-credentials: false

      - name: Check out exact Jotai source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: pmndrs/jotai
          ref: 56a9cc51de8a5dd762b95a145820f12589cc47c9
          path: jotai
          persist-credentials: false

      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093
        with:
          version: 11.3.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: ${{ matrix.node-version }}

      - name: Apply key-scoped cache and generation-counter repair
        run: |
          cd jotai
          source_dir=../fieldwork/programmes/data-durable-workflows/scouts/jotai-json-storage-key-isolation
          target_dir=tests/react/vanilla-utils
          git apply --check "$source_dir/candidate.patch"
          git apply "$source_dir/candidate.patch"
          git apply --check "$source_dir/async-read-generation-candidate.patch"
          git apply "$source_dir/async-read-generation-candidate.patch"
          for test_file in \
            atomWithStorageKeyIsolation.test.ts \
            atomWithStorageReadInvalidation.test.ts \
            atomWithStorageAsyncReadGenerationRepair.test.ts
          do
            cp "$source_dir/$test_file" "$target_dir/$test_file"
          done
          git diff --check

      - name: Install exact repository dependencies
        working-directory: jotai
        run: pnpm install --frozen-lockfile

      - name: Run generation repair and adjacent controls
        working-directory: jotai
        run: |
          pnpm vitest run \
            tests/react/vanilla-utils/atomWithStorageAsyncReadGenerationRepair.test.ts \
            tests/react/vanilla-utils/atomWithStorageKeyIsolation.test.ts \
            tests/react/vanilla-utils/atomWithStorageReadInvalidation.test.ts \
            tests/react/vanilla-utils/atomWithStorage.test.tsx

      - name: Run changed-file static checks
        working-directory: jotai
        run: |
          changed_files=(
            src/vanilla/utils/atomWithStorage.ts
            tests/react/vanilla-utils/atomWithStorageKeyIsolation.test.ts
            tests/react/vanilla-utils/atomWithStorageReadInvalidation.test.ts
            tests/react/vanilla-utils/atomWithStorageAsyncReadGenerationRepair.test.ts
          )
          pnpm eslint "${changed_files[@]}"
          pnpm prettier --check "${changed_files[@]}"
          pnpm tsc --noEmit
