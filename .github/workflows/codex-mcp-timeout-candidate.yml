name: Codex MCP timeout candidate matrix

on:
  pull_request:
    branches:
      - main
    paths:
      - campaigns/codex-rust-mcp-lifecycle/lanes/L01-timeout-cancellation/**
      - .github/workflows/codex-mcp-timeout-candidate.yml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out exact Codex experiment
        uses: actions/checkout@v4
        with:
          repository: teamleaderleo/codex
          ref: e322eb92a6745616953bc00a3db8046c499dc6a7
          path: codex
          fetch-depth: 1

      - name: Baseline controls
        working-directory: codex/codex-rs
        run: |
          cargo test -p codex-rmcp-client --test tool_timeout_cancellation_probe -- --nocapture
          cargo test -p codex-rmcp-client --test tool_timeout_elicitation_probe -- --nocapture
          cargo test -p codex-rmcp-client --test tool_timeout_modern_http_probe -- --nocapture
          cargo test -p codex-rmcp-client --test tool_timeout_cancel_delivery_probe -- --nocapture
          cargo test -p codex-rmcp-client --test tool_timeout_ignored_cancellation_probe -- --nocapture
          cargo test -p codex-rmcp-client --test tool_timeout_concurrent_request_probe -- --nocapture

      - name: SDK-native timeout controls
        working-directory: codex
        env:
          FIELDWORK_EXPECT_MCP_CANCEL: "1"
          FIELDWORK_EXPECT_ELICITATION_TIMEOUT: "1"
          FIELDWORK_EXPECT_CANCEL_SEND_STALL: "1"
        run: |
          python3 fieldwork/patches/mcp-timeout/apply_candidate_scoped.py native-sdk-timeout
          cd codex-rs
          rustfmt --edition 2024 --check rmcp-client/src/rmcp_client.rs
          git diff --check
          cargo test -p codex-rmcp-client --test tool_timeout_cancellation_probe -- --nocapture
          cargo test -p codex-rmcp-client --test tool_timeout_elicitation_probe -- --nocapture
          cargo test -p codex-rmcp-client --test tool_timeout_modern_http_probe -- --nocapture
          cargo test -p codex-rmcp-client --test tool_timeout_cancel_delivery_probe -- --nocapture
          cargo test -p codex-rmcp-client --test tool_timeout_ignored_cancellation_probe -- --nocapture
          cargo test -p codex-rmcp-client --test tool_timeout_concurrent_request_probe -- --nocapture
          git checkout -- rmcp-client/src/rmcp_client.rs

      - name: Pause-aware explicit cancellation controls
        working-directory: codex
        env:
          FIELDWORK_EXPECT_MCP_CANCEL: "1"
          FIELDWORK_EXPECT_CANCEL_SEND_STALL: "1"
        run: |
          python3 fieldwork/patches/mcp-timeout/apply_candidate_scoped.py pause-aware-explicit-cancel
          cd codex-rs
          rustfmt --edition 2024 --check rmcp-client/src/rmcp_client.rs
          git diff --check
          cargo test -p codex-rmcp-client --test tool_timeout_cancellation_probe -- --nocapture
          cargo test -p codex-rmcp-client --test tool_timeout_elicitation_probe -- --nocapture
          cargo test -p codex-rmcp-client --test tool_timeout_modern_http_probe -- --nocapture
          cargo test -p codex-rmcp-client --test tool_timeout_cancel_delivery_probe -- --nocapture
          cargo test -p codex-rmcp-client --test tool_timeout_ignored_cancellation_probe -- --nocapture
          cargo test -p codex-rmcp-client --test tool_timeout_concurrent_request_probe -- --nocapture
          git checkout -- rmcp-client/src/rmcp_client.rs

      - name: Pause-aware bounded cancellation controls
        working-directory: codex
        env:
          FIELDWORK_EXPECT_MCP_CANCEL: "1"
          FIELDWORK_EXPECT_BOUNDED_CANCEL: "1"
        run: |
          python3 fieldwork/patches/mcp-timeout/apply_candidate_scoped.py pause-aware-bounded-cancel
          cd codex-rs
          rustfmt --edition 2024 --check rmcp-client/src/rmcp_client.rs
          git diff --check
          cargo test -p codex-rmcp-client --test tool_timeout_cancellation_probe -- --nocapture
          cargo test -p codex-rmcp-client --test tool_timeout_elicitation_probe -- --nocapture
          cargo test -p codex-rmcp-client --test tool_timeout_modern_http_probe -- --nocapture
          cargo test -p codex-rmcp-client --test tool_timeout_cancel_delivery_probe -- --nocapture
          cargo test -p codex-rmcp-client --test tool_timeout_ignored_cancellation_probe -- --nocapture
          cargo test -p codex-rmcp-client --test tool_timeout_concurrent_request_probe -- --nocapture
