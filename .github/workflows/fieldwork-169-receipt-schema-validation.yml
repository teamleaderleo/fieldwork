name: fieldwork-169-receipt-schema-validation

on:
  push:
    branches:
      - finding/169-enforce-receipt-schema

permissions:
  contents: write

concurrency:
  group: fieldwork-169-receipt-schema-validation
  cancel-in-progress: false

jobs:
  apply-test-publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out candidate branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: finding/169-enforce-receipt-schema
          fetch-depth: 0
          persist-credentials: true

      - name: Apply dependency-free receipt v1 validation
        shell: python
        run: |
          from pathlib import Path
          from textwrap import dedent

          root = Path("campaigns/0002-tool-surface-continuity/lanes/L06-effective-surface-diagnostics")
          classifier = root / "artifacts/classify_receipts.py"
          tests = root / "artifacts/test_classify_receipts.py"
          report = root / "report.md"

          text = classifier.read_text(encoding="utf-8")
          anchor = dedent('''\
          VIEW_ORDER = (
              "saved_host",
              "current_host",
              "effective_host",
              "logical_request",
              "wire_request",
              "global_catalogue",
              "binding",
              "router",
              "model_exposure",
              "discovery",
              "executable",
              "server_completion",
              "result_persistence",
              "client_delivery",
              "display",
              "fallback_authority",
          )
          ''')
          validation = dedent('''\

          DOCUMENT_KEYS = {"schema_version", "source_boundary", "receipts"}
          RECEIPT_KEYS = {
              "schema_version",
              "receipt_id",
              "source_lane",
              "transition",
              "request_kind",
              "operation_kind",
              "prior_receipt_digest",
              "views",
              "expected",
          }
          REQUIRED_RECEIPT_KEYS = {
              "schema_version",
              "receipt_id",
              "transition",
              "request_kind",
              "operation_kind",
              "views",
          }
          VIEW_NAMES = frozenset(VIEW_ORDER)
          VIEW_KEYS = {
              "state",
              "count",
              "digest",
              "identity_digest",
              "provenance",
              "required",
              "executable",
              "previous_response",
              "deferred_family_count",
              "identity_state",
              "decision",
              "delta_count",
          }
          VIEW_STATES = {"present", "absent", "unavailable"}
          IDENTITY_STATES = {"complete", "missing", "duplicated", "reordered", "orphaned"}
          AUTHORITY_DECISIONS = {"allow_equivalent", "require_explicit_approval", "fail_closed"}
          OPERATION_KINDS = {"read", "mutation", "mixed"}
          NONNEGATIVE_INTEGER_VIEW_FIELDS = {"count", "deferred_family_count", "delta_count"}
          BOOLEAN_VIEW_FIELDS = {"required", "executable", "previous_response"}
          STRING_VIEW_FIELDS = {"digest", "identity_digest", "provenance"}


          def _require_object(value: Any, label: str) -> dict[str, Any]:
              if not isinstance(value, dict):
                  raise ValueError(f"{label} must be an object")
              return value


          def _reject_unknown_keys(value: dict[str, Any], allowed: set[str] | frozenset[str], label: str) -> None:
              unknown = sorted(set(value) - set(allowed))
              if unknown:
                  raise ValueError(f"{label} has unknown field {unknown[0]!r}")


          def _require_string(value: Any, label: str, *, nonempty: bool = False) -> str:
              if not isinstance(value, str):
                  raise ValueError(f"{label} must be a string")
              if nonempty and not value:
                  raise ValueError(f"{label} must be a non-empty string")
              return value


          def validate_document(document: Any) -> dict[str, Any]:
              document = _require_object(document, "document")
              _reject_unknown_keys(document, DOCUMENT_KEYS, "document")
              if document.get("schema_version") != SCHEMA_VERSION:
                  raise ValueError(
                      f"document schema_version must be {SCHEMA_VERSION}, got "
                      f"{document.get('schema_version')!r}"
                  )
              receipts = document.get("receipts")
              if not isinstance(receipts, list):
                  raise ValueError("document.receipts must be an array")
              if "source_boundary" in document and not isinstance(document["source_boundary"], dict):
                  raise ValueError("document.source_boundary must be an object")
              return document


          def validate_receipt_schema(receipt: Any) -> dict[str, Any]:
              receipt = _require_object(receipt, "receipt")
              _reject_unknown_keys(receipt, RECEIPT_KEYS, "receipt")
              missing = sorted(REQUIRED_RECEIPT_KEYS - set(receipt))
              if missing:
                  raise ValueError(f"receipt is missing required field {missing[0]!r}")
              if receipt["schema_version"] != SCHEMA_VERSION:
                  raise ValueError(
                      f"unsupported schema_version: {receipt['schema_version']!r}"
                  )

              receipt_id = _require_string(receipt["receipt_id"], "receipt.receipt_id", nonempty=True)
              _require_string(receipt["transition"], f"receipt {receipt_id!r} transition")
              _require_string(receipt["request_kind"], f"receipt {receipt_id!r} request_kind")
              if receipt["operation_kind"] not in OPERATION_KINDS:
                  raise ValueError(
                      f"receipt {receipt_id!r} operation_kind must be one of "
                      f"{sorted(OPERATION_KINDS)!r}"
                  )
              if "source_lane" in receipt:
                  _require_string(receipt["source_lane"], f"receipt {receipt_id!r} source_lane")
              if "prior_receipt_digest" in receipt and receipt["prior_receipt_digest"] is not None:
                  _require_string(
                      receipt["prior_receipt_digest"],
                      f"receipt {receipt_id!r} prior_receipt_digest",
                  )

              views = _require_object(receipt["views"], f"receipt {receipt_id!r} views")
              if not views:
                  raise ValueError(f"receipt {receipt_id!r} views must contain an observation")
              unknown_views = sorted(set(views) - VIEW_NAMES)
              if unknown_views:
                  raise ValueError(
                      f"receipt {receipt_id!r} has unknown view {unknown_views[0]!r}"
                  )

              for name, raw_view in views.items():
                  label = f"receipt {receipt_id!r} view {name!r}"
                  view = _require_object(raw_view, label)
                  _reject_unknown_keys(view, VIEW_KEYS, label)
                  if "state" not in view:
                      raise ValueError(f"{label} is missing required field 'state'")
                  if view["state"] not in VIEW_STATES:
                      raise ValueError(
                          f"{label}.state must be one of {sorted(VIEW_STATES)!r}"
                      )
                  for field in NONNEGATIVE_INTEGER_VIEW_FIELDS & set(view):
                      value = view[field]
                      if isinstance(value, bool) or not isinstance(value, int) or value < 0:
                          raise ValueError(f"{label}.{field} must be a nonnegative integer")
                  for field in BOOLEAN_VIEW_FIELDS & set(view):
                      if not isinstance(view[field], bool):
                          raise ValueError(f"{label}.{field} must be boolean")
                  for field in STRING_VIEW_FIELDS & set(view):
                      _require_string(view[field], f"{label}.{field}")
                  if "identity_state" in view and view["identity_state"] not in IDENTITY_STATES:
                      raise ValueError(
                          f"{label}.identity_state must be one of {sorted(IDENTITY_STATES)!r}"
                      )
                  if "decision" in view and view["decision"] not in AUTHORITY_DECISIONS:
                      raise ValueError(
                          f"{label}.decision must be one of {sorted(AUTHORITY_DECISIONS)!r}"
                      )

              if "expected" in receipt:
                  expected = _require_object(
                      receipt["expected"], f"receipt {receipt_id!r} expected"
                  )
                  for field in ("first_divergent_layer", "typed_reason"):
                      if field in expected and expected[field] is not None:
                          _require_string(expected[field], f"receipt {receipt_id!r} expected.{field}")
              return receipt
          ''')
          if "def validate_receipt_schema(" in text:
              raise SystemExit("receipt schema validation already exists")
          if text.count(anchor) != 1:
              raise SystemExit("VIEW_ORDER anchor mismatch")
          text = text.replace(anchor, anchor + validation, 1)

          classify_anchor = "def classify(receipt: dict[str, Any]) -> dict[str, Any]:\n"
          classify_replacement = (
              "def classify(receipt: dict[str, Any]) -> dict[str, Any]:\n"
              "    validate_receipt_schema(receipt)\n"
          )
          if text.count(classify_anchor) != 1:
              raise SystemExit("classify anchor mismatch")
          text = text.replace(classify_anchor, classify_replacement, 1)

          run_anchor = dedent('''\
          def run(input_path: Path, output_path: Path) -> dict[str, Any]:
              document = json.loads(input_path.read_text(encoding="utf-8"))
              receipts = document["receipts"]
              results = []
              for receipt in receipts:
                  violations = validate_privacy(receipt)
          ''')
          run_replacement = dedent('''\
          def run(input_path: Path, output_path: Path) -> dict[str, Any]:
              document = json.loads(input_path.read_text(encoding="utf-8"))
              validate_document(document)
              receipts = document["receipts"]
              results = []
              for receipt in receipts:
                  validate_receipt_schema(receipt)
                  violations = validate_privacy(receipt)
          ''')
          if text.count(run_anchor) != 1:
              raise SystemExit("run validation anchor mismatch")
          classifier.write_text(text.replace(run_anchor, run_replacement, 1), encoding="utf-8")

          text = tests.read_text(encoding="utf-8")
          import_anchor = "from classify_receipts import classify, run, validate_privacy\n"
          import_replacement = dedent('''\
          from classify_receipts import (
              classify,
              run,
              validate_document,
              validate_privacy,
              validate_receipt_schema,
          )
          ''')
          if text.count(import_anchor) != 1:
              raise SystemExit("test import anchor mismatch")
          text = text.replace(import_anchor, import_replacement, 1)

          test_anchor = "    def test_unavailable_views_do_not_create_false_divergence(self):\n"
          added_tests = dedent('''\
              def test_schema_accepts_all_retained_fixtures(self):
                  validate_document(self.document)
                  for receipt in self.document["receipts"]:
                      with self.subTest(receipt=receipt["receipt_id"]):
                          validate_receipt_schema(receipt)

              def test_schema_rejects_missing_required_receipt_field(self):
                  receipt = dict(self.document["receipts"][0])
                  del receipt["transition"]
                  with self.assertRaisesRegex(ValueError, "missing required field 'transition'"):
                      validate_receipt_schema(receipt)

              def test_schema_rejects_unknown_receipt_field(self):
                  receipt = dict(self.document["receipts"][0])
                  receipt["unexpected"] = True
                  with self.assertRaisesRegex(ValueError, "unknown field 'unexpected'"):
                      validate_receipt_schema(receipt)

              def test_schema_rejects_unknown_view_and_view_field(self):
                  receipt = json.loads(json.dumps(self.document["receipts"][0]))
                  receipt["views"]["unknown_view"] = {"state": "present"}
                  with self.assertRaisesRegex(ValueError, "unknown view 'unknown_view'"):
                      validate_receipt_schema(receipt)

                  receipt = json.loads(json.dumps(self.document["receipts"][0]))
                  receipt["views"]["router"] = {
                      "state": "present",
                      "tool_name": "retained-sensitive-name",
                  }
                  with self.assertRaisesRegex(ValueError, "unknown field 'tool_name'"):
                      validate_receipt_schema(receipt)

              def test_schema_rejects_wrong_enums_and_primitive_types(self):
                  receipt = json.loads(json.dumps(self.document["receipts"][0]))
                  receipt["operation_kind"] = "unknown"
                  with self.assertRaisesRegex(ValueError, "operation_kind"):
                      validate_receipt_schema(receipt)

                  receipt = json.loads(json.dumps(self.document["receipts"][0]))
                  receipt["views"]["saved_host"]["state"] = "maybe"
                  with self.assertRaisesRegex(ValueError, "saved_host.*state"):
                      validate_receipt_schema(receipt)

                  receipt = json.loads(json.dumps(self.document["receipts"][0]))
                  receipt["views"]["saved_host"]["count"] = True
                  with self.assertRaisesRegex(ValueError, "count must be a nonnegative integer"):
                      validate_receipt_schema(receipt)

              def test_schema_rejects_empty_observation_set(self):
                  receipt = dict(self.document["receipts"][0])
                  receipt["views"] = {}
                  with self.assertRaisesRegex(ValueError, "views must contain an observation"):
                      validate_receipt_schema(receipt)

              def test_document_contract_is_bounded(self):
                  invalid = dict(self.document)
                  invalid["unexpected"] = True
                  with self.assertRaisesRegex(ValueError, "document has unknown field"):
                      validate_document(invalid)

                  invalid = dict(self.document)
                  invalid["receipts"] = {}
                  with self.assertRaisesRegex(ValueError, "document.receipts must be an array"):
                      validate_document(invalid)

              def test_run_rejects_schema_drift_before_classification(self):
                  document = json.loads(json.dumps(self.document))
                  document["receipts"][0]["views"]["router"] = {
                      "state": "present",
                      "tool_name": "retained-sensitive-name",
                  }
                  with tempfile.TemporaryDirectory() as temp_dir:
                      input_path = Path(temp_dir) / "invalid.json"
                      output_path = Path(temp_dir) / "result.json"
                      input_path.write_text(json.dumps(document), encoding="utf-8")
                      with self.assertRaisesRegex(ValueError, "unknown field 'tool_name'"):
                          run(input_path, output_path)
                      self.assertFalse(output_path.exists())

          ''')
          if "test_schema_accepts_all_retained_fixtures" in text:
              raise SystemExit("schema regression tests already exist")
          if text.count(test_anchor) != 1:
              raise SystemExit("test insertion anchor mismatch")
          tests.write_text(text.replace(test_anchor, added_tests + test_anchor, 1), encoding="utf-8")

          report_text = report.read_text(encoding="utf-8")
          report_note = dedent('''\

          ## Executable receipt-schema boundary

          Finding #169 distinguishes the published receipt shape from the semantic
          divergence classifier. The bounded repair validates the v1 document and
          receipt structure before privacy checking or classification: required
          fields, exact receipt and view keys, known view names, primitive types,
          enums, and a nonempty observation set. The existing privacy denylist
          remains an independent second defense.

          The eight retained campaign fixtures and their seven divergence results
          are unchanged. Schema-invalid input is rejected before a healthy or
          divergent semantic result can be emitted.
          ''')
          if "## Executable receipt-schema boundary" not in report_text:
              report.write_text(report_text.rstrip() + report_note + "\n", encoding="utf-8")

          Path(".github/workflows/fieldwork-169-receipt-schema-validation.yml").unlink()

      - name: Run focused receipt tests
        working-directory: campaigns/0002-tool-surface-continuity/lanes/L06-effective-surface-diagnostics/artifacts
        run: |
          python3 -m py_compile classify_receipts.py test_classify_receipts.py
          python3 test_classify_receipts.py
          python3 classify_receipts.py fixtures.json --output /tmp/fieldwork-169-latest.json
          cmp /tmp/fieldwork-169-latest.json results/latest.json

      - name: Verify source hygiene
        run: |
          git diff --check
          test ! -e .github/workflows/fieldwork-169-receipt-schema-validation.yml

      - name: Publish source-only repair
        run: |
          git config user.name fieldwork-ci
          git config user.email fieldwork-ci@users.noreply.github.com
          git add campaigns .github
          git commit -m 'diagnostics: enforce receipt v1 schema before classification'
          git push origin HEAD:finding/169-enforce-receipt-schema
