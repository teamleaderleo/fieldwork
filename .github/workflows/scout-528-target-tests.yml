name: Scout 528 target regressions

on:
  push:
    branches:
      - scout/528-agent-runtime-run-authority
  workflow_dispatch:

permissions:
  contents: read

jobs:
  models:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Execute reduced lifecycle models
        working-directory: programmes/open-source-ecosystems/scouts/agent-runtime-run-authority
        run: |
          node artifacts/opencode-stale-idle-model.mjs
          node artifacts/tanstack-transform-order-model.mjs
          node artifacts/vercel-resume-adoption-model.mjs
          node artifacts/vercel-poll-deadline-model.mjs

  tanstack-final-result:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          path: fieldwork
      - uses: actions/checkout@v4
        with:
          repository: TanStack/ai
          ref: 6feb5644a38073c5865f7b4ff4d64d62195e755b
          path: target
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: target/pnpm-lock.yaml
      - name: Install target workspace
        working-directory: target
        run: pnpm install --frozen-lockfile
      - name: Install focused regression
        run: |
          cp fieldwork/programmes/open-source-ecosystems/scouts/agent-runtime-run-authority/target-tests/tanstack-generation-final-result.test.ts \
            target/packages/ai-persistence/tests/fieldwork-generation-final-result.test.ts
      - name: Run target-native regression
        working-directory: target/packages/ai-persistence
        run: pnpm exec vitest run tests/fieldwork-generation-final-result.test.ts

  opencode-status-authority:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          repository: teamleaderleo/opencode
          ref: research/runner-stale-idle-authority
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Install target workspace
        run: bun install --frozen-lockfile
      - name: Run target-native regression
        working-directory: packages/opencode
        run: bun test test/session/run-state-authority.test.ts --timeout 30000

  vercel-poll-deadlines:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          repository: teamleaderleo/ai
          ref: research/google-video-poll-deadline
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install target workspace
        run: pnpm install --frozen-lockfile
      - name: Run legacy polling regression
        working-directory: packages/google
        run: pnpm exec vitest --config vitest.node.config.js --run src/google-video-poll-deadline.test.ts
      - name: Run slow-status polling regression
        working-directory: packages/xai
        run: pnpm exec vitest --config vitest.node.config.js --run src/xai-video-poll-deadline.test.ts

  vercel-core-poll-deadline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          path: fieldwork
      - uses: actions/checkout@v4
        with:
          repository: vercel/ai
          ref: dd11a4bf2eebc609292740262951dc00445dbf6a
          path: target
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: target/pnpm-lock.yaml
      - name: Install target workspace
        working-directory: target
        run: pnpm install --frozen-lockfile
      - name: Install focused core regressions
        run: |
          cp fieldwork/programmes/open-source-ecosystems/scouts/agent-runtime-run-authority/target-tests/vercel-core-poll-deadline-authority.test.ts \
            target/packages/ai/src/generate-video/fieldwork-poll-deadline-authority.test.ts
      - name: Run target-native core regressions
        working-directory: target/packages/ai
        run: pnpm exec vitest --config vitest.node.config.js --run src/generate-video/fieldwork-poll-deadline-authority.test.ts
