name: Repair stale reference-policy labels

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  repair:
    if: >-
      github.event.issue.number == 569 &&
      github.event.comment.body == '<!-- fieldwork: repair-reference-policy-labels -->'
    runs-on: ubuntu-latest
    steps:
      - name: Check out trusted default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Test interaction reference scanner
        run: node scripts/test_interaction_references.js
      - name: Rescan labeled threads
        uses: actions/github-script@v7
        with:
          script: |
            const check = require('./scripts/check_interaction_references.js');
            const policyMarker = '<!-- fieldwork-reference-policy-result -->';
            const violationLabel = 'policy:reference-violation';
            const currentRepository = `${context.repo.owner}/${context.repo.repo}`.toLowerCase();

            const labeled = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'all',
              labels: violationLabel,
              per_page: 100,
            });

            let cleared = 0;
            let retained = 0;

            for (const issue of labeled) {
              const issueNumber = issue.number;
              const { entries, comments } = await check.collectThreadEntries({
                github,
                context,
                issueNumber,
              });
              const failures = check.scanEntries(entries, currentRepository);

              if (failures.length === 0) {
                try {
                  await github.rest.issues.removeLabel({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: issueNumber,
                    name: violationLabel,
                  });
                } catch (error) {
                  if (error.status !== 404) throw error;
                }
                cleared += 1;
              } else {
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  labels: [violationLabel],
                });
                retained += 1;
              }

              const existing = comments.find(
                (comment) =>
                  comment.user?.type === 'Bot' &&
                  comment.body?.includes(policyMarker),
              );
              const body = check.policyCommentBody(failures);

              if (existing) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: existing.id,
                  body,
                });
              } else if (failures.length > 0) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  body,
                });
              }
            }

            await core.summary
              .addHeading('Reference-policy label repair')
              .addRaw(`Rescanned ${labeled.length} labeled threads. Cleared ${cleared}; retained ${retained}.`)
              .write();
