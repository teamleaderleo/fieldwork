name: Fieldwork issue 122 Polars publication cancellation

on:
  push:
    branches:
      - scout/122-datafusion-polars-publication-cancellation
    paths:
      - programmes/high-leverage-open-source/scouts/datafusion-polars-reproducible-analytics/probes/polars-local-cancel/**
      - .github/workflows/fieldwork-issue122-publication-cancellation.yml
  pull_request:
    paths:
      - programmes/high-leverage-open-source/scouts/datafusion-polars-reproducible-analytics/probes/polars-local-cancel/**
      - .github/workflows/fieldwork-issue122-publication-cancellation.yml
  workflow_dispatch:

concurrency:
  group: fieldwork-issue122-polars-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  POLARS_COMMIT: 36e414b4cb1e74e7a171995b35b83c1163974324
  POLARS_OBJECT_STORE_COMMIT: f50a6e5c564b2b5933eca15cd20ff9b5614374a1
  POLARS_PROBE_DIR: programmes/high-leverage-open-source/scouts/datafusion-polars-reproducible-analytics/probes/polars-local-cancel

jobs:
  polars-local-publication:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Fetch exact read-only Polars source set
        run: |
          set -euxo pipefail
          for spec in \
            "polars https://github.com/pola-rs/polars.git $POLARS_COMMIT" \
            "polars-object-store https://github.com/kdn36/arrow-rs-object-store.git $POLARS_OBJECT_STORE_COMMIT"
          do
            set -- $spec
            name="$1"
            remote="$2"
            commit="$3"
            mkdir -p ".fieldwork/$name"
            git -C ".fieldwork/$name" init
            git -C ".fieldwork/$name" remote add origin "$remote"
            git -C ".fieldwork/$name" fetch --depth=1 origin "$commit"
            git -C ".fieldwork/$name" checkout --detach FETCH_HEAD
            test "$(git -C ".fieldwork/$name" rev-parse HEAD)" = "$commit"
          done

      - name: Verify source ownership anchors
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          checks = {
              "polars_cancel_token": (
                  Path(".fieldwork/polars/crates/polars-lazy/src/frame/exitable.rs"),
                  [
                      "Cancel the query at earliest convenience.",
                      "self.token.store(true)",
                      "impl Drop for InProcessQuery",
                  ],
              ),
              "polars_parquet_close": (
                  Path(".fieldwork/polars/crates/polars-stream/src/nodes/io_sinks/writers/parquet/io_writer.rs"),
                  [
                      "parquet_writer.finish()?",
                      "file.close(sync_on_close)?",
                  ],
              ),
              "polars_local_final_path": (
                  Path(".fieldwork/polars/crates/polars-io/src/utils/file.rs"),
                  [
                      "create_file(&path)?;",
                      "Self::Local(polars_utils::open_file_write(&path)?)",
                  ],
              ),
              "polars_object_store_dns_resolver": (
                  Path(".fieldwork/polars-object-store/src/client/mod.rs"),
                  ["with_dns_resolver"],
              ),
          }

          receipt = {}
          for label, (path, needles) in checks.items():
              text = path.read_text(encoding="utf-8")
              missing = [needle for needle in needles if needle not in text]
              if missing:
                  raise SystemExit(f"{label}: missing anchors {missing}")
              receipt[label] = {"path": str(path), "anchors": len(needles)}

          Path("issue122-polars-source-contract.json").write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Lock and verify exact dependency selection
        run: |
          set -euxo pipefail
          cargo generate-lockfile --manifest-path "$POLARS_PROBE_DIR/Cargo.toml"
          cp "$POLARS_PROBE_DIR/Cargo.lock" issue122-polars-Cargo.lock
          cargo tree --locked --manifest-path "$POLARS_PROBE_DIR/Cargo.toml" -i object_store \
            | tee issue122-polars-object-store-tree.txt
          grep -F 'object_store v0.13.2 (/home/runner/work/fieldwork/fieldwork/.fieldwork/polars-object-store)' \
            issue122-polars-object-store-tree.txt

      - name: Build Polars probe
        run: |
          set -euxo pipefail
          cargo fmt --manifest-path "$POLARS_PROBE_DIR/Cargo.toml" -- --check
          cargo test --locked --manifest-path "$POLARS_PROBE_DIR/Cargo.toml" --no-run

      - name: Run and classify Polars publication race
        id: polars
        run: |
          set +e
          cargo run --locked --quiet --manifest-path "$POLARS_PROBE_DIR/Cargo.toml" \
            > issue122-polars-local-cancel.json \
            2> issue122-polars-local-cancel.stderr
          status=$?
          set -e
          printf '%s\n' "$status" > issue122-polars-exit-status.txt
          cat issue122-polars-local-cancel.stderr
          cat issue122-polars-local-cancel.json
          test "$status" -eq 0
          python3 - <<'PY'
          import json
          from pathlib import Path

          receipt = json.loads(Path("issue122-polars-local-cancel.json").read_text())
          cancelled = receipt["cancelled"]
          retry = receipt["retry_success"]
          allowed = {
              "completed_before_cancel_request",
              "completed_after_cancel_request",
              "interrupted_after_cancel_request",
          }
          assert cancelled["outcome"] in allowed
          assert cancelled["barrier_bytes"] > 0
          assert retry["file"]["parquet_valid"] is True
          assert retry["file"]["readable_rows"] == retry["rows"]
          PY

      - name: Upload exact Polars receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fieldwork-issue122-polars-publication-cancellation
          path: |
            issue122-polars-source-contract.json
            issue122-polars-object-store-tree.txt
            issue122-polars-Cargo.lock
            issue122-polars-local-cancel.json
            issue122-polars-local-cancel.stderr
            issue122-polars-exit-status.txt
          if-no-files-found: warn
          retention-days: 30
