name: Fieldwork Upstash Box cancellation receipts

on:
  pull_request:
    paths:
      - ".github/workflows/fieldwork-upstash-box-cancel-receipts.yml"
      - "programmes/high-leverage-open-source/scouts/upstash-box-cancel-receipts/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  typescript:
    name: TypeScript Node 22
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out Fieldwork carrier
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          path: fieldwork
          persist-credentials: false

      - name: Check out exact Upstash Box source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: upstash/box
          ref: b55d832d6e3ae0156e32d21ea3863e231dfff9cd
          path: box
          persist-credentials: false

      - name: Verify target and install control
        run: |
          test "$(git -C box rev-parse HEAD)" = "b55d832d6e3ae0156e32d21ea3863e231dfff9cd"
          cp \
            fieldwork/programmes/high-leverage-open-source/scouts/upstash-box-cancel-receipts/fieldwork-cancel-receipt.test.ts \
            box/packages/sdk/src/__tests__/fieldwork-cancel-receipt.test.ts

      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093
        with:
          version: 10

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: box/pnpm-lock.yaml

      - name: Install exact dependencies
        working-directory: box
        run: pnpm install --frozen-lockfile

      - name: Run cancellation receipt controls
        working-directory: box
        run: pnpm --filter @upstash/box test -- src/__tests__/fieldwork-cancel-receipt.test.ts

      - name: Run focused static checks
        working-directory: box
        run: |
          pnpm --filter @upstash/box exec prettier --check src/__tests__/fieldwork-cancel-receipt.test.ts
          pnpm --filter @upstash/box build
          git diff --check

  python:
    name: Python 3.12
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out Fieldwork carrier
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          path: fieldwork
          persist-credentials: false

      - name: Check out exact Upstash Box source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: upstash/box
          ref: b55d832d6e3ae0156e32d21ea3863e231dfff9cd
          path: box
          persist-credentials: false

      - name: Verify target and install control
        run: |
          test "$(git -C box rev-parse HEAD)" = "b55d832d6e3ae0156e32d21ea3863e231dfff9cd"
          cp \
            fieldwork/programmes/high-leverage-open-source/scouts/upstash-box-cancel-receipts/test_fieldwork_cancel_receipt.py \
            box/packages/python-sdk/tests/_async/test_fieldwork_cancel_receipt.py

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: box/packages/python-sdk/pyproject.toml

      - name: Install exact package and test dependencies
        run: python -m pip install -e "box/packages/python-sdk[dev]"

      - name: Run cancellation receipt controls
        working-directory: box/packages/python-sdk
        run: pytest tests/_async/test_fieldwork_cancel_receipt.py -q --tb=long

      - name: Run focused static checks
        working-directory: box/packages/python-sdk
        run: |
          ruff check tests/_async/test_fieldwork_cancel_receipt.py
          ruff format --check tests/_async/test_fieldwork_cancel_receipt.py
          git diff --check
