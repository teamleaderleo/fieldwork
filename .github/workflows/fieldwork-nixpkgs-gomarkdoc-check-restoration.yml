name: Fieldwork Nixpkgs gomarkdoc checks

on:
  pull_request:
    paths:
      - ".github/workflows/fieldwork-nixpkgs-gomarkdoc-check-restoration.yml"
      - "programmes/open-source-ecosystems/experiments/nixpkgs-gomarkdoc-check-restoration/**"
      - "findings/F241-nixpkgs-gomarkdoc-check-restoration/**"

permissions:
  contents: read

jobs:
  restore-checks:
    name: ${{ matrix.system }} gomarkdoc checks
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            system: x86_64-linux
          - runner: macos-14
            system: aarch64-darwin
    steps:
      - name: Check out Fieldwork carrier
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Check out exact Nixpkgs source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: NixOS/nixpkgs
          ref: bbbd95e512a066deaefa89e3a244b541ed6c8c7f
          path: .target/nixpkgs
          fetch-depth: 1
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31.11.0
        with:
          extra_nix_config: sandbox = true

      - name: Apply package-local restoration
        shell: bash
        run: |
          git -C .target/nixpkgs apply \
            "$GITHUB_WORKSPACE/programmes/open-source-ecosystems/experiments/nixpkgs-gomarkdoc-check-restoration/gomarkdoc.patch"
          git -C .target/nixpkgs diff --check
          git -C .target/nixpkgs diff -- \
            pkgs/by-name/go/gomarkdoc/package.nix

      - name: Build gomarkdoc with upstream checks
        shell: bash
        run: |
          set -o pipefail
          nix-build .target/nixpkgs \
            -A gomarkdoc \
            --no-out-link \
            2>&1 | tee "gomarkdoc-${{ matrix.system }}.log"
          grep -F "Running phase: checkPhase" "gomarkdoc-${{ matrix.system }}.log"
          grep -E "ok[[:space:]]+github.com/princjef/gomarkdoc/cmd/gomarkdoc" \
            "gomarkdoc-${{ matrix.system }}.log"

      - name: Build version passthru test
        shell: bash
        run: |
          set -o pipefail
          nix-build .target/nixpkgs \
            -A gomarkdoc.tests.version \
            --no-out-link \
            2>&1 | tee "gomarkdoc-version-${{ matrix.system }}.log"

      - name: Upload exact logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gomarkdoc-check-restoration-${{ matrix.system }}
          path: |
            gomarkdoc-${{ matrix.system }}.log
            gomarkdoc-version-${{ matrix.system }}.log
          if-no-files-found: warn
          retention-days: 30
