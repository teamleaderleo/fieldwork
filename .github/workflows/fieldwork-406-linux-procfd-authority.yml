name: Fieldwork F406 Linux procfd authority

on:
  pull_request:
    paths:
      - ".github/workflows/fieldwork-406-linux-procfd-authority.yml"
      - "findings/F406-mcp-filesystem-pathname-authority/evidence/linux-procfd-*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  feasibility:
    name: Node 22 Linux procfd authority
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact Fieldwork head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: fieldwork
          persist-credentials: false

      - name: Check out exact target context
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: modelcontextprotocol/servers
          ref: 76d64c822f5125032f89eb71dbdb94e42b434821
          path: servers
          persist-credentials: false

      - name: Set up Node 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "22"

      - name: Verify exact identities and Linux primitives
        id: verify
        env:
          EXPECTED_FIELDWORK_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git -C fieldwork rev-parse HEAD)" = "${EXPECTED_FIELDWORK_HEAD}"
          test "$(git -C servers rev-parse HEAD)" = "76d64c822f5125032f89eb71dbdb94e42b434821"
          test "$(uname -s)" = "Linux"
          test -d /proc/self/fd
          mkdir -p fieldwork-receipts

      - name: Execute procfd authority controls
        id: controls
        run: |
          set -o pipefail
          node --test \
            fieldwork/findings/F406-mcp-filesystem-pathname-authority/evidence/linux-procfd-authority.test.mjs \
            2>&1 | tee fieldwork-receipts/linux-procfd-authority.log

      - name: Require untouched target source
        id: boundary
        run: |
          set -euo pipefail
          test -z "$(git -C servers status --porcelain=v1 --untracked-files=all)"

      - name: Assemble exact-head receipt
        if: always()
        env:
          FIELDWORK_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
          CONTROLS_OUTCOME: ${{ steps.controls.outcome }}
          BOUNDARY_OUTCOME: ${{ steps.boundary.outcome }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const directory = path.join(process.cwd(), 'fieldwork-receipts');
          fs.mkdirSync(directory, { recursive: true });
          const receipt = {
            schemaVersion: 1,
            generatedAt: new Date().toISOString(),
            fieldworkHead: process.env.FIELDWORK_HEAD,
            targetContext: {
              repository: 'modelcontextprotocol/servers',
              head: '76d64c822f5125032f89eb71dbdb94e42b434821',
            },
            runtime: {
              platform: 'ubuntu-24.04',
              kernelFamily: 'Linux',
              node: process.version,
              procfdRequired: true,
              oDirectoryRequired: true,
            },
            workflowSteps: {
              verify: process.env.VERIFY_OUTCOME || 'not-run',
              controls: process.env.CONTROLS_OUTCOME || 'not-run',
              untouchedTarget: process.env.BOUNDARY_OUTCOME || 'not-run',
            },
            controls: {
              pathnameBaselineOutside: 'primitive-executed-when-controls-pass',
              procfdCreationInsideOpenedParent: 'primitive-executed-when-controls-pass',
              procfdTempRenameInsideOpenedParent: 'primitive-executed-when-controls-pass',
            },
            claimBoundary: {
              linuxFeasibility: 'executed-when-controls-pass',
              targetPatch: 'not-prepared',
              mcpToolHandler: 'not-executed',
              macos: 'not-executed',
              windows: 'not-executed',
              containersWithoutProcfs: 'not-executed',
              publicExploitability: 'not-claimed',
            },
          };
          fs.writeFileSync(
            path.join(directory, 'linux-procfd-authority-receipt.json'),
            `${JSON.stringify(receipt, null, 2)}\n`,
          );
          NODE

      - name: Upload exact-head receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: f406-linux-procfd-authority-${{ github.run_id }}-${{ github.run_attempt }}
          path: fieldwork-receipts/
          if-no-files-found: error
          retention-days: 14
