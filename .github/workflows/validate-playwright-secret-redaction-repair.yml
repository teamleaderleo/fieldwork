name: validate Playwright secret redaction repair

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Clone exact owned candidate
        run: |
          git clone --single-branch --branch research/mcp-secret-redaction-current https://github.com/teamleaderleo/playwright.git candidate
          cd candidate
          test "$(git rev-parse HEAD)" = "e22360b517e5e38324205fc0f55a0b3cec63ca0c"
      - name: Apply exact repair
        working-directory: candidate
        run: |
          python3 - <<'PY'
          from pathlib import Path

          context_path = Path('packages/playwright-core/src/tools/backend/context.ts')
          context = context_path.read_text()
          old = '''  redactSecrets(text: string): string {\n    for (const [secretName, secretValue] of Object.entries(this.config.secrets ?? {})) {\n      if (!secretValue)\n        continue;\n      text = text.replaceAll(secretValue, `<secret>${secretName}</secret>`);\n    }\n    return text;\n  }'''
          new = '''  redactSecrets(text: string): string {\n    const replacements = new Map<string, string>();\n    for (const [secretName, secretValue] of Object.entries(this.config.secrets ?? {})) {\n      if (!secretValue)\n        continue;\n      const marker = `<secret>${secretName}</secret>`;\n      if (!replacements.has(secretValue))\n        replacements.set(secretValue, marker);\n      const serializedValue = JSON.stringify(secretValue).slice(1, -1);\n      if (!replacements.has(serializedValue))\n        replacements.set(serializedValue, marker);\n    }\n\n    const candidates = [...replacements].sort(([a], [b]) => b.length - a.length);\n    let result = '';\n    for (let i = 0; i < text.length;) {\n      const replacement = candidates.find(([value]) => text.startsWith(value, i));\n      if (!replacement) {\n        result += text[i++];\n        continue;\n      }\n      result += replacement[1];\n      i += replacement[0].length;\n    }\n    return result;\n  }'''
          if context.count(old) != 1:
              raise SystemExit('expected exactly one redactSecrets body')
          context_path.write_text(context.replace(old, new))

          response_path = Path('packages/playwright-core/src/tools/backend/response.ts')
          response = response_path.read_text()
          old = '''    const content: (TextContent | ImageContent)[] = [\n      {\n        type: 'text',\n        text: sanitizeUnicode(this._context.redactSecrets(serializedText)),\n      }\n    ];'''
          new = '''    const redactedText = this._json\n      ? redactJsonStringLiterals(serializedText, text => this._context.redactSecrets(text))\n      : this._context.redactSecrets(serializedText);\n\n    const content: (TextContent | ImageContent)[] = [\n      {\n        type: 'text',\n        text: sanitizeUnicode(redactedText),\n      }\n    ];'''
          if response.count(old) != 1:
              raise SystemExit('expected exactly one response redaction anchor')
          response = response.replace(old, new)
          old = '''}\n\nexport function renderTabMarkdown(tab: TabHeader): string[] {'''
          new = '''}\n\nfunction redactJsonStringLiterals(text: string, redact: (value: string) => string): string {\n  let result = '';\n  for (let i = 0; i < text.length;) {\n    if (text[i] !== '\"') {\n      result += text[i++];\n      continue;\n    }\n    const start = i++;\n    while (i < text.length) {\n      if (text[i] === '\\\\') {\n        i += 2;\n        continue;\n      }\n      if (text[i++] === '\"')\n        break;\n    }\n    const literal = text.slice(start, i);\n    const value: string = JSON.parse(literal);\n    result += JSON.stringify(redact(value));\n  }\n  return result;\n}\n\nexport function renderTabMarkdown(tab: TabHeader): string[] {'''
          if response.count(old) != 1:
              raise SystemExit('expected exactly one response helper anchor')
          response_path.write_text(response.replace(old, new))
          PY
          git diff --check
          test "$(git diff --name-only | sort)" = $'packages/playwright-core/src/tools/backend/context.ts\npackages/playwright-core/src/tools/backend/response.ts'
      - name: Add execution-only JSON boundary controls
        working-directory: candidate
        run: |
          cat > tests/mcp/secrets-json-redaction-repair.spec.ts <<'EOF'
          import fs from 'node:fs';

          import { test, expect } from './cli-fixtures';

          test('keeps JSON structural literals intact when a secret has the same spelling', async ({ cli, server }, testInfo) => {
            const secretsFile = testInfo.outputPath('literal-secrets.env');
            await fs.promises.writeFile(secretsFile, 'TOKEN=true\n');
            server.setContent('/', '<button disabled>Click</button>', 'text/html');

            await cli('open', server.PREFIX, {
              env: { PLAYWRIGHT_MCP_SECRETS_FILE: secretsFile },
            });

            const json = await cli('--json', 'snapshot');
            expect(() => JSON.parse(json.output)).not.toThrow();
            expect(json.output).not.toContain('<secret>TOKEN</secret>');
          });

          test('redacts a literal-shaped secret inside a JSON string without corrupting JSON', async ({ cli, server }, testInfo) => {
            const secretsFile = testInfo.outputPath('literal-string-secrets.env');
            await fs.promises.writeFile(secretsFile, 'TOKEN=true\n');
            server.setContent('/', "<script>console.log('true')</script>", 'text/html');

            await cli('open', server.PREFIX, {
              env: { PLAYWRIGHT_MCP_SECRETS_FILE: secretsFile },
            });

            const json = await cli('--json', 'console');
            const parsed = JSON.parse(json.output);
            expect(parsed.result).toContain('<secret>TOKEN</secret>');
          });
          EOF
      - name: Install and build
        working-directory: candidate
        run: |
          npm ci
          npm run build
          npx playwright install chromium
      - name: Run focused secret controls
        working-directory: candidate
        run: npx playwright test -c tests/mcp/playwright.config.ts --project=chromium tests/mcp/secrets.spec.ts tests/mcp/secrets-redaction-research.spec.ts tests/mcp/secrets-json-redaction-repair.spec.ts
      - name: Run focused lint
        working-directory: candidate
        run: npx eslint packages/playwright-core/src/tools/backend/context.ts packages/playwright-core/src/tools/backend/response.ts tests/mcp/secrets-redaction-research.spec.ts tests/mcp/secrets-json-redaction-repair.spec.ts
      - name: Record repair diff
        working-directory: candidate
        run: |
          rm tests/mcp/secrets-json-redaction-repair.spec.ts
          git diff --check
          test "$(git diff --name-only | sort)" = $'packages/playwright-core/src/tools/backend/context.ts\npackages/playwright-core/src/tools/backend/response.ts'
          git diff -- packages/playwright-core/src/tools/backend/context.ts packages/playwright-core/src/tools/backend/response.ts
