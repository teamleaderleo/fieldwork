name: Fieldwork Zustand undefined options

on:
  pull_request:
    paths:
      - '.github/workflows/fieldwork-zustand-undefined-options.yml'
      - 'programmes/data-durable-workflows/scouts/zustand-undefined-option-overrides/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused-test:
    name: Node.js ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 22
          - 24
          - 26
    steps:
      - name: Check out owned implementation
        uses: actions/checkout@v4
        with:
          repository: teamleaderleo/zustand
          ref: 278ede8b60c111ec4291b26cd95794d7bdd5da37

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run persist regression suites
        run: pnpm vitest run tests/persistUndefinedOptions.test.ts tests/persistAsync.test.tsx tests/persistSync.test.tsx

      - name: Lint changed source and regression
        run: pnpm eslint src/middleware/persist.ts tests/persistUndefinedOptions.test.ts
