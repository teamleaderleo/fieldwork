name: Repair playground huge integer timeout validation

on:
  push:
    branches:
      - repair/playground-bool-numeric-fields
    paths:
      - '.github/workflows/repair-playground-huge-timeout.yml'

permissions:
  contents: write

concurrency:
  group: repair-playground-huge-timeout
  cancel-in-progress: false

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: repair/playground-bool-numeric-fields
          fetch-depth: 0
          persist-credentials: true

      - name: Verify reviewed input generation
        run: |
          test "$(git hash-object scripts/run_playground_cases.py)" = 945b491d1501be56f6716b93dc0b1941e1841f11
          test "$(git hash-object scripts/test_playground_validators.py)" = bb9bdff10eeee7ce52f4936ed1675944fa4a6d0e

      - name: Apply bounded timeout repair
        run: |
          python3 - <<'PY'
          from pathlib import Path

          runner = Path('scripts/run_playground_cases.py')
          text = runner.read_text(encoding='utf-8')
          old_helper = '''def _is_number(value: Any) -> bool:
    return type(value) in {int, float}
'''
          new_helper = '''def _is_valid_timeout(value: Any) -> bool:
    if type(value) is int:
        return value > 0
    if type(value) is float:
        return math.isfinite(value) and value > 0
    return False
'''
          if text.count(old_helper) != 1:
              raise SystemExit('timeout helper anchor moved')
          text = text.replace(old_helper, new_helper, 1)

          old_check = '''        if not _is_number(timeout) or not math.isfinite(timeout) or timeout <= 0:
            raise PackError(
                f"{location}: timeout_seconds must be a finite positive number"
            )
'''
          new_check = '''        if not _is_valid_timeout(timeout):
            raise PackError(
                f"{location}: timeout_seconds must be a finite positive number"
            )
'''
          if text.count(old_check) != 1:
              raise SystemExit('timeout validation anchor moved')
          runner.write_text(text.replace(old_check, new_check, 1), encoding='utf-8')

          tests = Path('scripts/test_playground_validators.py')
          test_text = tests.read_text(encoding='utf-8')
          anchor = '''    def test_rejects_boolean_exit_code(self) -> None:
'''
          addition = '''    def test_accepts_very_large_positive_integer_timeout(self) -> None:
        data = self.pack()
        data["timeout_seconds"] = 10**1000
        with tempfile.TemporaryDirectory() as tmp:
            loaded = load_pack(self.write_pack(Path(tmp), data))
        self.assertEqual(loaded["timeout_seconds"], 10**1000)

    def test_rejects_very_large_negative_integer_timeout(self) -> None:
        data = self.pack()
        data["timeout_seconds"] = -(10**1000)
        self.assert_pack_rejected(
            data, "timeout_seconds must be a finite positive number"
        )

'''
          if test_text.count(anchor) != 1:
              raise SystemExit('timeout regression insertion anchor moved')
          tests.write_text(test_text.replace(anchor, addition + anchor, 1), encoding='utf-8')
          PY
          git diff --check

      - name: Run complete playground validation
        run: |
          python3 -m py_compile \
            scripts/run_playground_cases.py \
            scripts/test_playground_validators.py \
            scripts/validate_experiments.py
          python3 -m unittest -v scripts/test_playground_validators.py
          python3 scripts/validate_experiments.py
          python3 scripts/run_playground_cases.py --validate
          python3 scripts/run_playground_cases.py \
            --pack playgrounds/cases/identity-smoke.json \
            --adapter "python3 playgrounds/examples/identity-adapter/run.py" \
            --output /tmp/fieldwork-playground-smoke.json
          git diff --check

      - name: Publish direct source-and-test repair
        run: |
          rm .github/workflows/repair-playground-huge-timeout.yml
          git config user.name fieldwork-ci
          git config user.email fieldwork-ci@users.noreply.github.com
          git add \
            scripts/run_playground_cases.py \
            scripts/test_playground_validators.py \
            .github/workflows/repair-playground-huge-timeout.yml
          git diff --cached --quiet && exit 1
          git commit -m 'playgrounds: handle huge integer timeouts safely'
          git push origin HEAD:repair/playground-bool-numeric-fields
