name: execute-118-tauri-ipc-candidate-model

on:
  push:
    branches:
      - 'execute/118-tauri-ipc-candidate-model'

permissions:
  contents: write

jobs:
  model:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: tauri-apps/tauri
          ref: 34ec18ba5e1acabebd66ae79d6fc746f63d8eb96
          path: target-tauri
          persist-credentials: false
      - name: Pin Node receipt
        run: node --version | tee /tmp/node-version
      - name: Run candidate transport model
        run: |
          node programmes/high-leverage-open-source/scouts/tauri-authority-packaging-lifecycle/probe/ipc_candidate_model.mjs | tee /tmp/ipc-model.log
      - name: Materialize candidate in pinned target tree
        run: |
          cp programmes/high-leverage-open-source/scouts/tauri-authority-packaging-lifecycle/probe/ipc-protocol.candidate.js \
            target-tauri/crates/tauri/scripts/ipc-protocol.js
          node --check target-tauri/crates/tauri/scripts/ipc-protocol.js
          git -C target-tauri diff --check
          git -C target-tauri diff -- crates/tauri/scripts/ipc-protocol.js > \
            programmes/high-leverage-open-source/scouts/tauri-authority-packaging-lifecycle/probe/ipc-head-negotiation-v2.patch
      - name: Write execution receipt
        run: |
          export NODE_VERSION="$(cat /tmp/node-version)"
          python3 - <<'PY'
          import json, os
          from pathlib import Path

          receipt = {
            'kind': 'model-executed',
            'date': '2026-08-09',
            'fieldwork_run_id': os.environ['GITHUB_RUN_ID'],
            'execution_head': os.environ['GITHUB_SHA'],
            'runner_os': os.environ['RUNNER_OS'],
            'runner_arch': os.environ['RUNNER_ARCH'],
            'node': os.environ['NODE_VERSION'],
            'target_repository': 'tauri-apps/tauri',
            'target_revision': '34ec18ba5e1acabebd66ae79d6fc746f63d8eb96',
            'candidate_source': 'probe/ipc-protocol.candidate.js',
            'generated_patch': 'probe/ipc-head-negotiation-v2.patch',
            'checks': [
              'candidate model passed',
              'candidate JavaScript parsed with node --check',
              'git diff --check passed in pinned target tree',
              'patch generated by git from pinned target tree'
            ],
            'model_output': Path('/tmp/ipc-model.log').read_text().strip().splitlines(),
            'claim_scope': 'model',
            'limitations': [
              'does not prove WebView2 or WKWebView HEAD/custom-header behavior',
              'does not execute a real Tauri webview or Rust IPC dispatcher',
              'CORS/custom-scheme behavior remains platform-test-prepared only'
            ],
            'upstream_contact_authorized': False
          }
          out = Path('programmes/high-leverage-open-source/scouts/tauri-authority-packaging-lifecycle/ipc-candidate-model-receipt-20260809.json')
          out.write_text(json.dumps(receipt, indent=2) + '\n')
          PY
      - name: Commit generated patch and receipt
        run: |
          git config user.name 'fieldwork-execution-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            programmes/high-leverage-open-source/scouts/tauri-authority-packaging-lifecycle/probe/ipc-head-negotiation-v2.patch \
            programmes/high-leverage-open-source/scouts/tauri-authority-packaging-lifecycle/ipc-candidate-model-receipt-20260809.json
          git commit -m 'record revised Tauri IPC candidate model'
          git push origin HEAD:execute/118-tauri-ipc-candidate-model
