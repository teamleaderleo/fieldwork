name: Materialize activity refresh instructions

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  materialize:
    if: github.event.pull_request.head.ref == 'process/activity-refresh-continuation'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: process/activity-refresh-continuation
          fetch-depth: 0

      - name: Apply canonical instruction update
        run: python3 .github/scripts/materialize-activity-refresh-loop.py

      - name: Verify instruction diff
        run: |
          git diff --check
          mapfile -t changed < <(git status --short | sed 's/^...//' | sort)
          expected=(
            .github/scripts/materialize-activity-refresh-loop.py
            .github/workflows/materialize-activity-refresh-loop.yml
            AGENTS.md
            START_HERE.md
          )
          test "${changed[*]}" = "${expected[*]}"

      - name: Publish self-contained instruction diff
        run: |
          rm .github/scripts/materialize-activity-refresh-loop.py
          rm .github/workflows/materialize-activity-refresh-loop.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          test "$(git diff --cached --name-only | sort | tr '\n' ' ')" = "AGENTS.md START_HERE.md "
          git commit -m "docs: require activity refresh and autonomous continuation"
          git push origin HEAD:process/activity-refresh-continuation
