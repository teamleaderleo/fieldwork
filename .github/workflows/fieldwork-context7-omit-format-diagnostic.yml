name: Fieldwork Context7 omission formatter diagnostic

on:
  pull_request:
    paths:
      - ".github/workflows/fieldwork-context7-omit-format-diagnostic.yml"
      - "programmes/high-leverage-open-source/scouts/context7-http-boundary/malformed-key-omit-metadata.patch"
      - "programmes/high-leverage-open-source/scouts/context7-http-boundary/malformed-key-omit-metadata.test.ts"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact Fieldwork carrier head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: fieldwork
          persist-credentials: false

      - name: Check out exact Context7 source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: upstash/context7
          ref: 594a73133e14631af8c915a1b4f2c8039c964fe1
          path: context7
          persist-credentials: false

      - name: Apply exact retained candidate
        run: |
          patch_path="${GITHUB_WORKSPACE}/fieldwork/programmes/high-leverage-open-source/scouts/context7-http-boundary/malformed-key-omit-metadata.patch"
          git -C context7 apply --check "${patch_path}"
          git -C context7 apply "${patch_path}"
          cmp \
            fieldwork/programmes/high-leverage-open-source/scouts/context7-http-boundary/malformed-key-omit-metadata.test.ts \
            context7/packages/mcp/test/encryption.test.ts

      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093
        with:
          version: 10

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22

      - name: Install exact dependencies
        working-directory: context7
        run: pnpm install --frozen-lockfile

      - name: Emit target-owned canonical formatting
        working-directory: context7/packages/mcp
        run: |
          pnpm exec prettier --write src/lib/encryption.ts test/encryption.test.ts
          mkdir -p "${GITHUB_WORKSPACE}/formatted"
          cp src/lib/encryption.ts "${GITHUB_WORKSPACE}/formatted/encryption.ts"
          cp test/encryption.test.ts "${GITHUB_WORKSPACE}/formatted/encryption.test.ts"
          git -C "${GITHUB_WORKSPACE}/context7" diff -- \
            packages/mcp/src/lib/encryption.ts \
            packages/mcp/test/encryption.test.ts \
            > "${GITHUB_WORKSPACE}/formatted/prettier.diff"
          test -s "${GITHUB_WORKSPACE}/formatted/prettier.diff"
          cat "${GITHUB_WORKSPACE}/formatted/prettier.diff"

      - name: Upload target formatter output
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: context7-omit-format-diagnostic
          path: formatted
          if-no-files-found: error
          retention-days: 2
