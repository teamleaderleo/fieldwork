name: Fieldwork Playwright direct shutdown platforms

on:
  pull_request:
    paths:
      - ".github/workflows/fieldwork-playwright-direct-shutdown-platforms.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  direct-source:
    name: Direct source on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-15
          - windows-2025
    steps:
      - name: Check out exact Fieldwork carrier head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: fieldwork
          persist-credentials: false

      - name: Check out exact owned Playwright source head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: teamleaderleo/playwright
          ref: a834222d585371636eea7fd013e551fb819d9f7d
          path: playwright
          fetch-depth: 3
          persist-credentials: false

      - name: Set up Node 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: playwright/package-lock.json

      - name: Verify exact direct-source identities
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          base=368941457a82da112aa8610107e25f4bde94339a
          expected=$'packages/playwright-core/src/tools/utils/mcp/http.ts\ntests/mcp/remote-shutdown-authority.spec.ts'
          test "$(git -C fieldwork rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git -C playwright rev-parse HEAD)" = "a834222d585371636eea7fd013e551fb819d9f7d"
          test "$(git -C playwright merge-base HEAD "$base")" = "$base"
          test "$(git -C playwright diff --name-only "$base"...HEAD)" = "$expected"
          mkdir -p fieldwork-receipts
          git -C playwright diff --binary "$base"...HEAD > "fieldwork-receipts/direct-source-${{ matrix.os }}.diff"

      - name: Install exact dependencies
        id: install
        working-directory: playwright
        run: npm ci

      - name: Build exact source
        id: build
        working-directory: playwright
        run: npm run build

      - name: Install Chromium and Linux dependencies
        id: browser_linux
        if: runner.os == 'Linux'
        working-directory: playwright
        run: npx playwright install --with-deps chromium

      - name: Install Chromium
        id: browser_other
        if: runner.os != 'Linux'
        working-directory: playwright
        run: npx playwright install chromium

      - name: Run upstream HTTP and direct-source regression
        id: test
        shell: bash
        working-directory: playwright
        env:
          CI: "1"
        run: |
          set -o pipefail
          npm run test-mcp \
            tests/mcp/http.spec.ts \
            tests/mcp/remote-shutdown-authority.spec.ts \
            -- --project=chromium \
            2>&1 | tee "../fieldwork-receipts/direct-source-${{ matrix.os }}-test.log"

      - name: Run focused ESLint
        id: lint
        working-directory: playwright
        run: |
          npx eslint \
            packages/playwright-core/src/tools/utils/mcp/http.ts \
            tests/mcp/http.spec.ts \
            tests/mcp/remote-shutdown-authority.spec.ts

      - name: Verify exact two-file diff hygiene
        id: diff
        shell: bash
        working-directory: playwright
        run: |
          set -euo pipefail
          base=368941457a82da112aa8610107e25f4bde94339a
          expected=$'packages/playwright-core/src/tools/utils/mcp/http.ts\ntests/mcp/remote-shutdown-authority.spec.ts'
          git diff --check "$base"...HEAD
          files="$(git diff --name-only "$base"...HEAD)"
          printf '%s\n' "$files"
          test "$files" = "$expected"

      - name: Assemble direct-source platform receipt
        if: always()
        shell: bash
        env:
          FIELDWORK_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          RUNNER_OS: ${{ runner.os }}
          RUNNER_ARCH: ${{ runner.arch }}
          MATRIX_OS: ${{ matrix.os }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          BROWSER_LINUX_OUTCOME: ${{ steps.browser_linux.outcome }}
          BROWSER_OTHER_OUTCOME: ${{ steps.browser_other.outcome }}
          TEST_OUTCOME: ${{ steps.test.outcome }}
          LINT_OUTCOME: ${{ steps.lint.outcome }}
          DIFF_OUTCOME: ${{ steps.diff.outcome }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const directory = path.join(process.cwd(), 'fieldwork-receipts');
          fs.mkdirSync(directory, { recursive: true });
          const browserOutcome = process.env.RUNNER_OS === 'Linux'
            ? process.env.BROWSER_LINUX_OUTCOME
            : process.env.BROWSER_OTHER_OUTCOME;
          const outcomes = {
            verify: process.env.VERIFY_OUTCOME || 'not-run',
            install: process.env.INSTALL_OUTCOME || 'not-run',
            build: process.env.BUILD_OUTCOME || 'not-run',
            browser: browserOutcome || 'not-run',
            test: process.env.TEST_OUTCOME || 'not-run',
            lint: process.env.LINT_OUTCOME || 'not-run',
            diff: process.env.DIFF_OUTCOME || 'not-run',
          };
          const receipt = {
            schemaVersion: 1,
            generatedAt: new Date().toISOString(),
            fieldworkHead: process.env.FIELDWORK_HEAD,
            executionIdentity: 'literal-owned-source-head',
            source: {
              repository: 'teamleaderleo/playwright',
              pullRequest: 37,
              base: '368941457a82da112aa8610107e25f4bde94339a',
              head: 'a834222d585371636eea7fd013e551fb819d9f7d',
              changedFiles: [
                'packages/playwright-core/src/tools/utils/mcp/http.ts',
                'tests/mcp/remote-shutdown-authority.spec.ts',
              ],
            },
            platform: {
              matrixLabel: process.env.MATRIX_OS,
              runnerOS: process.env.RUNNER_OS,
              runnerArch: process.env.RUNNER_ARCH,
              node: process.version,
              project: 'chromium',
            },
            workflowSteps: outcomes,
            reusableDirectSourceEvidence: Object.values(outcomes).every(value => value === 'success'),
            claims: {
              exactSourceIdentity: 'source-read-and-executed',
              upstreamHttpSuite: 'target-executed-when-test-passes',
              directSourceRegression: 'target-executed-when-test-passes',
              focusedLint: 'target-executed-when-lint-passes',
              diffHygiene: 'target-executed-when-diff-passes',
              fullRepositoryGate: 'not-claimed',
              upstreamAcceptance: 'not-claimed',
            },
          };
          fs.writeFileSync(
            path.join(directory, `direct-source-${process.env.MATRIX_OS}-receipt.json`),
            `${JSON.stringify(receipt, null, 2)}\n`,
          );
          NODE

      - name: Upload direct-source platform receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: playwright-direct-shutdown-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: fieldwork-receipts/
          if-no-files-found: error
          retention-days: 14
