name: Fieldwork FFmpeg interruption 125

on:
  pull_request:
    paths:
      - ".github/workflows/fieldwork-ffmpeg-125.yml"
      - "programmes/high-leverage-open-source/scouts/ffmpeg-interruption-finalization-provenance/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mp4-interruption-publication:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out Fieldwork carrier
        uses: actions/checkout@v4

      - name: Check out exact FFmpeg 8.1.2 source
        uses: actions/checkout@v4
        with:
          repository: FFmpeg/FFmpeg
          ref: 38b88335f99e76ed89ff3c93f877fdefce736c13
          path: .target/ffmpeg
          fetch-depth: 1

      - name: Install native build prerequisites
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential pkg-config

      - name: Configure minimal exact-target build
        shell: bash
        working-directory: .target/ffmpeg
        run: |
          ./configure \
            --disable-doc \
            --disable-debug \
            --disable-network \
            --disable-autodetect \
            --disable-x86asm \
            --disable-everything \
            --enable-ffmpeg \
            --enable-ffprobe \
            --enable-avcodec \
            --enable-avformat \
            --enable-avfilter \
            --enable-avdevice \
            --enable-swscale \
            --enable-swresample \
            --enable-indev=lavfi \
            --enable-filter=testsrc2 \
            --enable-filter=format \
            --enable-encoder=mpeg4 \
            --enable-decoder=wrapped_avframe \
            --enable-decoder=mpeg4 \
            --enable-parser=mpeg4video \
            --enable-muxer=mov \
            --enable-demuxer=mov \
            --enable-protocol=file

      - name: Build ffmpeg and ffprobe
        shell: bash
        working-directory: .target/ffmpeg
        run: make --jobs "$(nproc)" ffmpeg ffprobe

      - name: Execute completed, SIGINT, SIGKILL, and staged controls
        shell: bash
        env:
          FFMPEG_BIN: ${{ github.workspace }}/.target/ffmpeg/ffmpeg
          FFPROBE_BIN: ${{ github.workspace }}/.target/ffmpeg/ffprobe
          FFMPEG_SOURCE_DIR: ${{ github.workspace }}/.target/ffmpeg
        run: bash programmes/high-leverage-open-source/scouts/ffmpeg-interruption-finalization-provenance/run.sh

      - name: Upload retained interruption evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-125-interruption-results
          path: programmes/high-leverage-open-source/scouts/ffmpeg-interruption-finalization-provenance/results/latest
          if-no-files-found: error
          retention-days: 30
