name: Fieldwork 176 uv wheel cache transform smoke

on:
  pull_request:
    paths:
      - '.github/workflows/fieldwork-176-uv-wheel-cache-transform-smoke.yml'
      - '.github/workflows/fieldwork-176-uv-wheel-cache.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  transform:
    runs-on: ubuntu-slim
    timeout-minutes: 10
    env:
      CURRENT_SOURCE_HEAD: 0cf7c4561b7c7159ab9479719a12573d0a6aa3bb
      CARRIER_HEAD: 37bd34be44a1e5046bdd0226a909d39a8938e607
    steps:
      - name: Check out Fieldwork carrier
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Check out exact uv carrier
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: teamleaderleo/uv
          ref: ${{ env.CARRIER_HEAD }}
          path: uv-carrier
          persist-credentials: false

      - name: Check out exact current uv source twice
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: teamleaderleo/uv
          ref: fieldwork/upstream-0cf7c456
          path: uv-pointer
          persist-credentials: false

      - name: Copy exact source for manifest candidate
        run: cp -R uv-pointer uv-manifest

      - name: Verify identities and scripts
        run: |
          test "$(git -C uv-carrier rev-parse HEAD)" = "$CARRIER_HEAD"
          test "$(git -C uv-pointer rev-parse HEAD)" = "$CURRENT_SOURCE_HEAD"
          test "$(git -C uv-manifest rev-parse HEAD)" = "$CURRENT_SOURCE_HEAD"
          python3 -m py_compile \
            uv-carrier/fieldwork/wheel-cache-crash-consistency/apply_pointer_archive.py \
            uv-carrier/fieldwork/wheel-cache-crash-consistency/apply_manifest_archive.py \
            uv-carrier/fieldwork/wheel-cache-crash-consistency/apply_manifest_record.py \
            uv-carrier/fieldwork/wheel-cache-crash-consistency/apply_manifest_export.py \
            uv-carrier/fieldwork/wheel-cache-crash-consistency/apply_manifest_database.py

      - name: Apply pointer candidate
        run: |
          python3 uv-carrier/fieldwork/wheel-cache-crash-consistency/apply_pointer_archive.py uv-pointer
          git -C uv-pointer diff --check
          test "$(git -C uv-pointer diff --name-only)" = "$(printf '%s\n' \
            crates/uv-distribution/src/archive.rs \
            crates/uv-distribution/src/distribution_database.rs \
            crates/uv-installer/src/plan.rs)"

      - name: Apply member-manifest candidate
        run: |
          python3 uv-carrier/fieldwork/wheel-cache-crash-consistency/apply_pointer_archive.py uv-manifest
          python3 uv-carrier/fieldwork/wheel-cache-crash-consistency/apply_manifest_archive.py uv-manifest
          python3 uv-carrier/fieldwork/wheel-cache-crash-consistency/apply_manifest_record.py uv-manifest
          python3 uv-carrier/fieldwork/wheel-cache-crash-consistency/apply_manifest_export.py uv-manifest
          python3 uv-carrier/fieldwork/wheel-cache-crash-consistency/apply_manifest_database.py uv-manifest
          git -C uv-manifest diff --check
          test "$(git -C uv-manifest diff --name-only)" = "$(printf '%s\n' \
            crates/uv-distribution/src/archive.rs \
            crates/uv-distribution/src/distribution_database.rs \
            crates/uv-install-wheel/src/lib.rs \
            crates/uv-install-wheel/src/wheel.rs \
            crates/uv-installer/src/plan.rs)"
