name: Fieldwork lru-cache owned fix

on:
  pull_request:
    paths:
      - '.github/workflows/fieldwork-lru-cache-owned-fix.yml'
      - 'programmes/data-durable-workflows/scouts/lru-cache-background-fetch-size/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused-test:
    name: Node.js ${{ matrix.node-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 22
          - 24
          - 26
    steps:
      - name: Check out exact owned source head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: teamleaderleo/node-lru-cache
          ref: 70a9e62b0555e6bb68763fb9d32458fa82fd2a70
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Verify clean source checkout
        run: git diff --check

      - name: Install exact dependencies
        run: npm install

      - name: Build source and declarations
        run: npm run prepare

      - name: Run focused behavior without repository coverage threshold
        run: npx tap --disable-coverage test/background-fetch-size.ts

      - name: Check changed source and test
        run: |
          npx oxlint src/index.ts test/background-fetch-size.ts
          npx prettier --check src/index.ts test/background-fetch-size.ts
