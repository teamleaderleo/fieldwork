name: Fieldwork rmcp relist ordering

on:
  push:
    branches:
      - lane/35-cross-lane-amendment
    paths:
      - campaigns/0002-tool-surface-continuity/lanes/L01-lifecycle-provenance/artifacts/rmcp-relist-ordering/**
      - .github/workflows/fieldwork-rmcp-relist-ordering.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run focused SDK fixture
        run: >-
          cargo test
          --manifest-path campaigns/0002-tool-surface-continuity/lanes/L01-lifecycle-provenance/artifacts/rmcp-relist-ordering/Cargo.toml
          -- --nocapture
