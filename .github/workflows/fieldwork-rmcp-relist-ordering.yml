name: Fieldwork rmcp relist ordering

on:
  push:
    branches:
      - lane/35-cross-lane-amendment
    paths:
      - campaigns/0002-tool-surface-continuity/lanes/L01-lifecycle-provenance/artifacts/rmcp-relist-ordering/**
      - .github/workflows/fieldwork-rmcp-relist-ordering.yml

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lane/35-cross-lane-amendment
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Run focused SDK fixture
        shell: bash
        run: |
          set -o pipefail
          fixture=campaigns/0002-tool-surface-continuity/lanes/L01-lifecycle-provenance/artifacts/rmcp-relist-ordering
          cargo test --manifest-path "$fixture/Cargo.toml" -- --nocapture | tee "$fixture/latest.log"
      - name: Commit retained evidence and remove temporary workflow
        shell: bash
        run: |
          fixture=campaigns/0002-tool-surface-continuity/lanes/L01-lifecycle-provenance/artifacts/rmcp-relist-ordering
          rm .github/workflows/fieldwork-rmcp-relist-ordering.yml
          git config user.name "fieldwork-ci"
          git config user.email "fieldwork-ci@users.noreply.github.com"
          git add "$fixture/Cargo.lock" "$fixture/latest.log" .github/workflows/fieldwork-rmcp-relist-ordering.yml
          git commit -m "test(rmcp): retain relist ordering evidence"
          git push origin HEAD:lane/35-cross-lane-amendment
