name: Fieldwork rmcp relist ordering

on:
  push:
    branches:
      - lane/35-cross-lane-amendment
    paths:
      - campaigns/0002-tool-surface-continuity/lanes/L01-lifecycle-provenance/artifacts/rmcp-relist-ordering/**
      - .github/workflows/fieldwork-rmcp-relist-ordering.yml
  pull_request:
    branches:
      - main
    paths:
      - campaigns/0002-tool-surface-continuity/lanes/L01-lifecycle-provenance/artifacts/rmcp-relist-ordering/**
      - .github/workflows/fieldwork-rmcp-relist-ordering.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run focused SDK fixture
        shell: bash
        run: |
          set -o pipefail
          fixture=campaigns/0002-tool-surface-continuity/lanes/L01-lifecycle-provenance/artifacts/rmcp-relist-ordering
          cargo test --manifest-path "$fixture/Cargo.toml" -- --nocapture | tee "$fixture/latest.log"
      - name: Upload reproducibility evidence
        uses: actions/upload-artifact@v4
        with:
          name: rmcp-relist-ordering-evidence
          if-no-files-found: error
          path: |
            campaigns/0002-tool-surface-continuity/lanes/L01-lifecycle-provenance/artifacts/rmcp-relist-ordering/Cargo.lock
            campaigns/0002-tool-surface-continuity/lanes/L01-lifecycle-provenance/artifacts/rmcp-relist-ordering/latest.log
