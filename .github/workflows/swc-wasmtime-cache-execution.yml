name: SWC Wasmtime cache execution carrier

on:
  pull_request:

permissions:
  contents: read

jobs:
  wasmtime-cache-red-green:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: "0"
      RUST_BACKTRACE: "1"
    steps:
      - name: Check out exact SWC base
        uses: actions/checkout@v4
        with:
          repository: teamleaderleo/swc
          ref: 5bf27fd72e4667bac6cc86888b8facb8b91f8077
          fetch-depth: 0

      - name: Install SWC Rust toolchain
        run: |
          rustup toolchain install nightly-2026-04-10 --profile minimal --component rustfmt clippy
          rustup override set nightly-2026-04-10

      - name: Stale-temp base must RED
        shell: bash
        run: |
          set -euo pipefail
          test_path=crates/swc_plugin_backend_wasmtime/tests/stale_temp_cache.rs
          mkdir -p "$(dirname "$test_path")"
          git show bce1d2e03f654d6aaaac77d76e2a818b3b743706:"$test_path" > "$test_path"
          set +e
          cargo test -p swc_plugin_backend_wasmtime --test stale_temp_cache 2>&1 | tee /tmp/stale-red.log
          rc=${PIPESTATUS[0]}
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "expected stale-temp base contract to fail"
            exit 1
          fi
          grep -q "test result: FAILED" /tmp/stale-red.log

      - name: Stale-temp exact candidate must GREEN
        run: |
          git reset --hard
          git clean -fd
          git checkout bce1d2e03f654d6aaaac77d76e2a818b3b743706
          cargo fmt --all -- --check
          cargo test -p swc_plugin_backend_wasmtime --test stale_temp_cache
          cargo test -p swc_plugin_backend_wasmtime
          cargo clippy -p swc_plugin_backend_wasmtime --all-targets -- -D warnings

      - name: Rejected-cache base must RED
        shell: bash
        run: |
          git reset --hard
          git clean -fd
          git checkout 825e42ed44676001d6c6a52bc1d0807a91852137
          set +e
          cargo test -p swc_plugin_backend_wasmtime --test rejected_cache 2>&1 | tee /tmp/rejected-red.log
          rc=${PIPESTATUS[0]}
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "expected rejected-cache contract to fail"
            exit 1
          fi
          grep -q "test result: FAILED" /tmp/rejected-red.log

      - name: Apply bounded rejected-cache candidate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('crates/swc_plugin_backend_wasmtime/src/lib.rs')
          s = p.read_text()
          old = '''        let cache = wasmtime::Module::deserialize(engine, module).ok()?;
        let cache = WasmtimeCache(cache);
        Some(runtime::ModuleCache(Box::new(cache)))
'''
          new = '''        match wasmtime::Module::deserialize(engine, module) {
            Ok(cache) => {
                let cache = WasmtimeCache(cache);
                Some(runtime::ModuleCache(Box::new(cache)))
            }
            Err(_) => {
                // A rejected serialized module cannot be trusted as a reusable cache.
                // Remove it so a later compile can publish a fresh artifact at this path.
                let _ = std::fs::remove_file(path);
                None
            }
        }
'''
          if old not in s:
              raise SystemExit('expected Wasmtime load_cache block not found')
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Rejected-cache candidate must GREEN
        run: |
          cargo fmt --all -- --check
          cargo test -p swc_plugin_backend_wasmtime --test rejected_cache
          cargo test -p swc_plugin_backend_wasmtime
          cargo clippy -p swc_plugin_backend_wasmtime --all-targets -- -D warnings
          git diff --check
