name: Tauri listener panic probe

on:
  pull_request:
    branches: [main]
    paths:
      - "programmes/high-leverage-open-source/scouts/tauri-authority-packaging-lifecycle/**"
      - ".github/workflows/tauri-listener-panic-probe.yml"

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout Fieldwork probe
        uses: actions/checkout@v4
      - name: Checkout pinned Tauri source
        uses: actions/checkout@v4
        with:
          repository: tauri-apps/tauri
          ref: 34ec18ba5e1acabebd66ae79d6fc746f63d8eb96
          path: target-tauri
          persist-credentials: false
      - name: Install Tauri Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential curl libappindicator3-dev libgtk-3-dev librsvg2-dev \
            libssl-dev libwebkit2gtk-4.1-dev wget
      - name: Use current stable Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version
          cargo --version
      - name: Inject focused regression
        run: |
          python3 - <<'PY'
          from pathlib import Path

          target = Path("target-tauri/crates/tauri/src/event/listener.rs")
          snippet = Path("programmes/high-leverage-open-source/scouts/tauri-authority-packaging-lifecycle/probe/listener_panic_test.rs").read_text()
          text = target.read_text()
          position = text.rfind("\n}")
          if position < 0:
              raise SystemExit("could not locate event listener test-module close")
          target.write_text(text[:position] + "\n" + snippet + text[position:])
          PY
      - name: Confirm baseline failure is the intended assertion
        shell: bash
        run: |
          set +e
          cargo test -p tauri --lib --no-default-features listener_panic_does_not_stall_future_events -- --nocapture 2>&1 | tee /tmp/tauri-listener-baseline.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -eq 0 ]; then
            echo "baseline unexpectedly passed"
            exit 1
          fi
          grep -F "event manager stopped dispatching after callback panic" /tmp/tauri-listener-baseline.log
          echo "BASELINE_CONFIRMED: callback panic stalls later event delivery"

  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout Fieldwork probe
        uses: actions/checkout@v4
      - name: Checkout pinned Tauri source
        uses: actions/checkout@v4
        with:
          repository: tauri-apps/tauri
          ref: 34ec18ba5e1acabebd66ae79d6fc746f63d8eb96
          path: target-tauri
          persist-credentials: false
      - name: Install Tauri Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential curl libappindicator3-dev libgtk-3-dev librsvg2-dev \
            libssl-dev libwebkit2gtk-4.1-dev wget
      - name: Use current stable Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version
          cargo --version
      - name: Inject focused regression and candidate
        run: |
          python3 - <<'PY'
          from pathlib import Path

          target = Path("target-tauri/crates/tauri/src/event/listener.rs")
          snippet = Path("programmes/high-leverage-open-source/scouts/tauri-authority-packaging-lifecycle/probe/listener_panic_test.rs").read_text()
          text = target.read_text()
          position = text.rfind("\n}")
          if position < 0:
              raise SystemExit("could not locate event listener test-module close")
          target.write_text(text[:position] + "\n" + snippet + text[position:])
          PY
          git -C target-tauri apply ../programmes/high-leverage-open-source/scouts/tauri-authority-packaging-lifecycle/probe/candidate.patch
      - name: Candidate preserves panic and future event delivery
        working-directory: target-tauri
        run: cargo test -p tauri --lib --no-default-features listener_panic_does_not_stall_future_events -- --nocapture
