name: validate Playwright invalid device repair

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Clone exact owned candidate
        run: |
          git clone --single-branch --branch research/mcp-invalid-device-option https://github.com/teamleaderleo/playwright.git candidate
          cd candidate
          test "$(git rev-parse HEAD)" = "5ee50c3d22c11238725a53ff6aebedf198db35c7"
      - name: Apply exact device validation repair
        working-directory: candidate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('packages/playwright-core/src/tools/mcp/config.ts')
          text = path.read_text()
          old = '''  const contextOptions: playwrightTypes.BrowserContextOptions = device ? playwright.devices[device] : {};'''
          new = '''  if (device && !playwright.devices[device])\n    throw new Error(`Invalid device: ${device}.`);\n  const contextOptions: playwrightTypes.BrowserContextOptions = device ? playwright.devices[device] : {};'''
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one device context-options anchor, found {count}')
          path.write_text(text.replace(old, new))
          PY
          git diff --check
          test "$(git diff --name-only)" = "packages/playwright-core/src/tools/mcp/config.ts"
      - name: Install and build
        working-directory: candidate
        run: |
          npm ci
          npm run build
      - name: Run focused config control
        working-directory: candidate
        run: npx playwright test -c tests/mcp/playwright.config.ts --project=chromium tests/mcp/config-invalid-device.spec.ts
      - name: Run focused lint
        working-directory: candidate
        run: npx eslint packages/playwright-core/src/tools/mcp/config.ts tests/mcp/config-invalid-device.spec.ts
      - name: Record repair diff
        working-directory: candidate
        run: |
          git diff --check
          git diff -- packages/playwright-core/src/tools/mcp/config.ts
