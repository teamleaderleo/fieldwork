name: fieldwork-435-unit-24-package-control

on:
  pull_request:
    branches:
      - p0/435-unit-24-codex-responses-lite-first-request
    paths:
      - .github/workflows/fieldwork-435-unit-24-crossrepo-exact.yml
  workflow_dispatch:

concurrency:
  group: fieldwork-435-unit-24-package-control-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write
  pull-requests: write

env:
  CARGO_TERM_COLOR: always
  SOURCE_REPO: teamleaderleo/codex
  SOURCE_HEAD: 9fd4ba575de8dd77bc411362256591ce9e7d8c82
  SOURCE_BASE: ee0247f95a6fe2b094ba2253d82cae2a2b4c2dff

jobs:
  package-control:
    name: package-control (${{ matrix.label }})
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: candidate
            source_sha: 9fd4ba575de8dd77bc411362256591ce9e7d8c82
          - label: base
            source_sha: ee0247f95a6fe2b094ba2253d82cae2a2b4c2dff
    steps:
      - name: Check out exact Codex revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ matrix.source_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify immutable revision
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ matrix.source_sha }}"
          printf 'FIELDWORK_LITE_PACKAGE_CONTROL_REVISION=%s:%s\n' \
            '${{ matrix.label }}' '${{ matrix.source_sha }}'

      - uses: ./.github/actions/setup-ci

      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: 1.95.0
          components: rustfmt

      - name: Run codex-core package gate and retain output
        id: package
        env:
          RUST_MIN_STACK: 33554432
        run: |
          set +e
          just test -p codex-core 2>&1 | tee /tmp/package.log
          status=${PIPESTATUS[0]}
          set -e
          echo "status=$status" >> "$GITHUB_OUTPUT"
          printf 'FIELDWORK_LITE_PACKAGE_CONTROL=%s:%s\n' '${{ matrix.label }}' "$status"

      - name: Run target-native fix gate and retain output
        id: fix
        if: always()
        run: |
          set +e
          just fix -p codex-core 2>&1 | tee /tmp/fix.log
          status=${PIPESTATUS[0]}
          set -e
          echo "status=$status" >> "$GITHUB_OUTPUT"
          printf 'FIELDWORK_LITE_FIX_CONTROL=%s:%s\n' '${{ matrix.label }}' "$status"

      - name: Record worktree state
        id: tree
        if: always()
        run: |
          set +e
          git diff --check >/tmp/diff-check.log 2>&1
          diff_status=$?
          git status --porcelain > /tmp/status.log
          if test -s /tmp/status.log; then
            clean=0
          else
            clean=1
          fi
          set -e
          echo "diff_status=$diff_status" >> "$GITHUB_OUTPUT"
          echo "clean=$clean" >> "$GITHUB_OUTPUT"
          printf 'FIELDWORK_LITE_WORKTREE_CONTROL=%s:diff=%s;clean=%s\n' \
            '${{ matrix.label }}' "$diff_status" "$clean"

      - name: Post concise control report
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_STATUS: ${{ steps.package.outputs.status }}
          FIX_STATUS: ${{ steps.fix.outputs.status }}
          DIFF_STATUS: ${{ steps.tree.outputs.diff_status }}
          TREE_CLEAN: ${{ steps.tree.outputs.clean }}
        run: |
          set -euo pipefail
          package_status="${PACKAGE_STATUS:-missing}"
          fix_status="${FIX_STATUS:-missing}"
          diff_status="${DIFF_STATUS:-missing}"
          tree_clean="${TREE_CLEAN:-missing}"
          {
            echo '## Unit 24 package control — ${{ matrix.label }}'
            echo
            echo '- revision: `${{ matrix.source_sha }}`'
            echo "- package gate exit: \`$package_status\`"
            echo "- fix gate exit: \`$fix_status\`"
            echo "- diff-check exit: \`$diff_status\`"
            echo "- worktree clean: \`$tree_clean\`"
            echo
            echo '<details><summary>Package failure/result markers</summary>'
            echo
            echo '```text'
            grep -E '(^error:|^failures:|test result:|FAILED|panicked at|failures:$|Caused by:)' /tmp/package.log 2>/dev/null | tail -n 240 || true
            echo '```'
            echo '</details>'
            echo
            echo '<details><summary>Fix-gate failure/result markers</summary>'
            echo
            echo '```text'
            grep -E '(^error:|^warning:|FAILED|panicked at|Caused by:)' /tmp/fix.log 2>/dev/null | tail -n 120 || true
            echo '```'
            echo '</details>'
            if test -s /tmp/status.log; then
              echo
              echo '<details><summary>Changed worktree paths</summary>'
              echo
              echo '```text'
              cat /tmp/status.log
              echo '```'
              echo '</details>'
            fi
          } > /tmp/report.md
          cat /tmp/report.md
          gh api "repos/${GITHUB_REPOSITORY}/issues/459/comments" \
            --method POST \
            --raw-field body="$(cat /tmp/report.md)"

      - name: Enforce control result
        if: always()
        env:
          PACKAGE_STATUS: ${{ steps.package.outputs.status }}
          FIX_STATUS: ${{ steps.fix.outputs.status }}
          DIFF_STATUS: ${{ steps.tree.outputs.diff_status }}
          TREE_CLEAN: ${{ steps.tree.outputs.clean }}
        run: |
          set -euo pipefail
          test "${PACKAGE_STATUS:-missing}" = 0
          test "${FIX_STATUS:-missing}" = 0
          test "${DIFF_STATUS:-missing}" = 0
          test "${TREE_CLEAN:-missing}" = 1
