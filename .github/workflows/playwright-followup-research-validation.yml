name: Playwright follow-up research validation

on:
  pull_request:
    paths:
      - ".github/workflows/playwright-followup-research-validation.yml"

permissions:
  contents: read

jobs:
  validate:
    name: Focused Playwright research on Ubuntu
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Check out validation carrier
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: fieldwork
          persist-credentials: false

      - name: Check out exact Playwright base
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: teamleaderleo/playwright
          ref: 931121dc6f1ce8d672ce2bd5845220203cb98920
          fetch-depth: 0
          path: playwright
          persist-credentials: false

      - name: Set up Node 22
        uses: actions/setup-node@48b55a011dba9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: playwright/package-lock.json

      - name: Install and build exact base
        working-directory: playwright
        run: |
          npm ci
          npm run build

      - name: Install browser dependencies
        working-directory: playwright
        run: npx playwright install --with-deps chromium chrome

      - name: Run focused research cases
        shell: bash
        working-directory: playwright
        env:
          CI: "1"
        run: |
          set -euo pipefail
          mkdir -p ../fieldwork-receipts
          summary=../fieldwork-receipts/summary.txt
          : > "$summary"

          materialize() {
            local sha="$1"
            local path="$2"
            git fetch --no-tags origin "$sha"
            git show "$sha:$path" > "$path"
          }

          run_case() {
            local label="$1"
            local project="$2"
            local file="$3"
            local grep="$4"
            set +e
            npm run test-mcp -- --project="$project" "$file" -g "$grep" > "../fieldwork-receipts/$label.log" 2>&1
            local code=$?
            set -e
            echo "$label exit=$code" | tee -a "$summary"
          }

          materialize a42ccd9268ecc2a5b0c5525a10a70acd5e9e3cc2 tests/mcp/secrets.spec.ts
          run_case overlapping-secrets chromium tests/mcp/secrets.spec.ts "overlapping secret values redact the longest value"
          git checkout -- tests/mcp/secrets.spec.ts

          materialize 183c6c59e4eca22198980af0b6f15afda42fedcb tests/mcp/config-invalid-browser.spec.ts
          run_case invalid-browser chrome tests/mcp/config-invalid-browser.spec.ts "invalid --browser value is rejected"
          rm tests/mcp/config-invalid-browser.spec.ts

          materialize bc657c8539e38b885db7d60605157f01b54b8d74 tests/mcp/multiple-roots.spec.ts
          run_case multiple-roots chromium tests/mcp/multiple-roots.spec.ts "explicit output can be written to the second client root"
          rm tests/mcp/multiple-roots.spec.ts

          materialize ea9da51c8f53ede998cf8c6b9529f440c41a1bc0 tests/mcp/program-options.spec.ts
          run_case variadic-permissions chrome tests/mcp/program-options.spec.ts "space-separated --grant-permissions values are preserved"
          rm tests/mcp/program-options.spec.ts

          materialize 5ee50c3d22c11238725a53ff6aebedf198db35c7 tests/mcp/config-invalid-device.spec.ts
          run_case invalid-device chrome tests/mcp/config-invalid-device.spec.ts "invalid --device value is rejected"
          rm tests/mcp/config-invalid-device.spec.ts

          materialize 5918a1c85665bfac43ae9a527df1eca79547fea0 tests/mcp/cancellation.spec.ts
          run_case cancel-navigation chromium tests/mcp/cancellation.spec.ts "client cancellation aborts in-flight navigation"
          rm tests/mcp/cancellation.spec.ts

          materialize b5cc28558afd82d1694e249cc217a8b0f391e2f8 tests/mcp/symlink-file-access.spec.ts
          run_case symlink-root-escape chromium tests/mcp/symlink-file-access.spec.ts "explicit output cannot escape workspace through a symlink"
          rm tests/mcp/symlink-file-access.spec.ts

          materialize 0507c948720c7758714360a7058fea1e187c1e73 tests/mcp/session-secrets.spec.ts
          run_case saved-session-secret chromium tests/mcp/session-secrets.spec.ts "configured secret values are redacted in saved session tool arguments"
          rm tests/mcp/session-secrets.spec.ts

          materialize 72d064fe839d3306a8bec4efab1713ea45ab67d3 tests/mcp/output-budget-current-console.spec.ts
          run_case current-console-budget chromium tests/mcp/output-budget-current-console.spec.ts "output budget keeps console artifact linked by current response"
          rm tests/mcp/output-budget-current-console.spec.ts

          echo "base=$(git rev-parse HEAD)" | tee -a "$summary"
          git status --short | tee ../fieldwork-receipts/final-status.txt

      - name: Upload focused receipts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: playwright-followup-research-${{ github.run_id }}-${{ github.run_attempt }}
          path: fieldwork-receipts/
          if-no-files-found: error
          retention-days: 14
