name: Cargo-binstall installer mode probe

on:
  pull_request:
    paths:
      - '.github/workflows/cargo-binstall-installer-mode-probe.yml'
      - 'programmes/open-source-ecosystems/scouts/developer-tools-build-systems/experiments/cargo-binstall-installer-mode/**'
  push:
    branches:
      - scout/561-cargo-binstall-installer-mode
    paths:
      - '.github/workflows/cargo-binstall-installer-mode-probe.yml'
      - 'programmes/open-source-ecosystems/scouts/developer-tools-build-systems/experiments/cargo-binstall-installer-mode/**'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out Fieldwork experiment
        uses: actions/checkout@v4

      - name: Check out exact cargo-binstall source
        uses: actions/checkout@v4
        with:
          repository: cargo-bins/cargo-binstall
          ref: f3284c9c2dd42d52f4437bf415a5712669699999
          path: target/cargo-binstall
          persist-credentials: false

      - name: Execute deterministic archive-mode matrix
        run: |
          chmod +x programmes/open-source-ecosystems/scouts/developer-tools-build-systems/experiments/cargo-binstall-installer-mode/probe.sh
          programmes/open-source-ecosystems/scouts/developer-tools-build-systems/experiments/cargo-binstall-installer-mode/probe.sh target/cargo-binstall \
            | tee cargo-binstall-installer-mode.result.txt

      - name: Upload result receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cargo-binstall-installer-mode-result
          path: cargo-binstall-installer-mode.result.txt
          if-no-files-found: error
          retention-days: 30
