name: Fieldwork Jotai JSON key isolation

on:
  push:
    branches:
      - playground/EXP-20260730-jotai-json-key-isolation
    paths:
      - '.github/workflows/fieldwork-jotai-json-key-isolation.yml'
      - 'playgrounds/EXP-20260730-jotai-json-key-isolation/**'
  pull_request:
    paths:
      - '.github/workflows/fieldwork-jotai-json-key-isolation.yml'
      - 'playgrounds/EXP-20260730-jotai-json-key-isolation/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: Node.js ${{ matrix.node-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 22
          - 24
          - 26
    defaults:
      run:
        working-directory: playgrounds/EXP-20260730-jotai-json-key-isolation
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: playground/EXP-20260730-jotai-json-key-isolation
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install exact release dependency
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Execute bounded identity probe
        run: node probe.mjs
