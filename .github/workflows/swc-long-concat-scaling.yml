name: SWC long concat scaling

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/swc-long-concat-scaling.yml"

permissions:
  contents: read

env:
  SWC_HEAD: 6c778430811853d4feee2ab3af1473669deb7b2a
  CARGO_INCREMENTAL: "0"
  CARGO_HTTP_MULTIPLEXING: "false"
  CARGO_NET_RETRY: "10"

jobs:
  measure:
    if: github.head_ref == 'fieldwork/execution/swc-long-concat-scaling'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact owned-fork SWC head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: teamleaderleo/swc
          ref: ${{ env.SWC_HEAD }}
          fetch-depth: 1
          persist-credentials: false

      - name: Install SWC Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: nightly-2026-04-10

      - name: Confirm source identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SWC_HEAD"
          printf 'source_head\t%s\n' "$SWC_HEAD" | tee /tmp/identity.tsv
          printf 'stack_soft_kb\t%s\n' "$(ulimit -s)" | tee -a /tmp/identity.tsv
          uname -a | tee -a /tmp/identity.tsv
          rustc --version --verbose | tee -a /tmp/identity.tsv

      - name: Materialize measurement-only example
        shell: bash
        run: |
          cat > crates/swc_ecma_minifier/examples/fieldwork-long-concat.rs <<'RS'
          extern crate swc_malloc;

          use std::{env::args, hint::black_box, path::Path, time::Instant};

          use swc_common::{errors::HANDLER, sync::Lrc, Mark, SourceMap};
          use swc_ecma_ast::Program;
          use swc_ecma_codegen::text_writer::{omit_trailing_semi, JsWriter};
          use swc_ecma_minifier::{
              optimize,
              option::{ExtraOptions, MangleOptions, MinifyOptions},
          };
          use swc_ecma_parser::parse_file_as_module;
          use swc_ecma_transforms_base::{
              fixer::{fixer, paren_remover},
              resolver,
          };

          fn main() {
              let mode = args().nth(1).expect("mode");
              let file = args().nth(2).expect("file");

              testing::run_test2(false, |cm, handler| {
                  HANDLER.set(&handler, || {
                      let fm = cm.load_file(Path::new(&file)).expect("load input");

                      let started = Instant::now();
                      let module = parse_file_as_module(
                          &fm,
                          Default::default(),
                          Default::default(),
                          None,
                          &mut Vec::new(),
                      )
                      .map_err(|err| {
                          err.into_diagnostic(&handler).emit();
                      })
                      .map(Program::Module)
                      .unwrap();
                      println!("metric\tparse_ms\t{}", started.elapsed().as_secs_f64() * 1000.0);

                      if mode == "parse" {
                          black_box(module);
                          return Ok(());
                      }

                      let unresolved_mark = Mark::new();
                      let top_level_mark = Mark::new();
                      let started = Instant::now();
                      let program = module
                          .apply(resolver(unresolved_mark, top_level_mark, false))
                          .apply(paren_remover(None));
                      println!("metric\tprepare_ms\t{}", started.elapsed().as_secs_f64() * 1000.0);

                      if mode == "prepare" {
                          black_box(program);
                          return Ok(());
                      }

                      let mangle = if mode == "full" {
                          Some(MangleOptions {
                              top_level: Some(true),
                              ..Default::default()
                          })
                      } else {
                          None
                      };

                      let started = Instant::now();
                      let output = optimize(
                          program,
                          cm.clone(),
                          None,
                          None,
                          &MinifyOptions {
                              compress: Some(Default::default()),
                              mangle,
                              ..Default::default()
                          },
                          &ExtraOptions {
                              unresolved_mark,
                              top_level_mark,
                              mangle_name_cache: None,
                          },
                      );
                      println!("metric\tcompress_ms\t{}", started.elapsed().as_secs_f64() * 1000.0);

                      if mode == "compress" {
                          black_box(output);
                          return Ok(());
                      }

                      let started = Instant::now();
                      let output = output.apply(fixer(None));
                      let code = print(cm, &[output], true);
                      println!("metric\temit_ms\t{}", started.elapsed().as_secs_f64() * 1000.0);
                      println!("metric\toutput_bytes\t{}", code.len());
                      black_box(code);

                      Ok(())
                  })
              })
              .unwrap();
          }

          fn print<N: swc_ecma_codegen::Node>(cm: Lrc<SourceMap>, nodes: &[N], minify: bool) -> String {
              let mut buf = Vec::new();
              {
                  let mut emitter = swc_ecma_codegen::Emitter {
                      cfg: swc_ecma_codegen::Config::default().with_minify(minify),
                      cm: cm.clone(),
                      comments: None,
                      wr: omit_trailing_semi(JsWriter::new(cm, "\n", &mut buf, None)),
                  };
                  for n in nodes {
                      n.emit_with(&mut emitter).unwrap();
                  }
              }
              String::from_utf8(buf).unwrap()
          }
          RS

      - name: Build measurement binary
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release -p swc_ecma_minifier --example fieldwork-long-concat

      - name: Run shape and stage matrix
        shell: bash
        run: |
          set -euo pipefail
          BIN=target/release/examples/fieldwork-long-concat
          OUT=/tmp/swc-long-concat-results.tsv
          RAW=/tmp/swc-long-concat-raw.log
          printf 'family\tsize\tstage\tstack_kb\tstatus\twall_s\tmax_rss_kb\n' > "$OUT"
          : > "$RAW"

          gen_case() {
            local family="$1" size="$2" path="$3"
            python3 - "$family" "$size" > "$path" <<'PY'
          import sys

          family = sys.argv[1]
          n = int(sys.argv[2])

          mixed_terms = []
          for _ in range(n):
              mixed_terms.extend(["a", "'hello swc, minify'"])
          mixed_terms.append("'c'")

          if family == "mixed":
              terms = mixed_terms
              expr = " + ".join(terms)
          elif family == "literals":
              terms = []
              for _ in range(n):
                  terms.extend(["'a'", "'hello swc, minify'"])
              terms.append("'c'")
              expr = " + ".join(terms)
          elif family == "vars":
              terms = []
              for _ in range(n):
                  terms.extend(["a", "b"])
              terms.append("c")
              expr = " + ".join(terms)
          elif family == "balanced_mixed":
              terms = mixed_terms
              while len(terms) > 1:
                  next_terms = []
                  for i in range(0, len(terms), 2):
                      if i + 1 < len(terms):
                          next_terms.append(f"({terms[i]} + {terms[i + 1]})")
                      else:
                          next_terms.append(terms[i])
                  terms = next_terms
              expr = terms[0]
          else:
              raise SystemExit(f"unknown family: {family}")

          print(f"export function add(a, b, c) {{ return {expr}; }}")
          PY
          }

          run_one() {
            local family="$1" size="$2" stage="$3" stack="$4"
            local input="/tmp/swc-${family}-${size}.js"
            gen_case "$family" "$size" "$input"
            : > /tmp/probe.stdout
            : > /tmp/probe.stderr
            : > /tmp/probe.time
            set +e
            (
              ulimit -s "$stack"
              /usr/bin/time -f '%e\t%M' -o /tmp/probe.time timeout 30s "$BIN" "$stage" "$input" > /tmp/probe.stdout 2> /tmp/probe.stderr
            )
            status=$?
            set -e
            wall=NA
            rss=NA
            if [ -s /tmp/probe.time ]; then
              IFS=$'\t' read -r wall rss < /tmp/probe.time || true
            fi
            printf '%s\t%s\t%s\t%s\t%s\t%s\t%s\n' "$family" "$size" "$stage" "$stack" "$status" "$wall" "$rss" | tee -a "$OUT"
            {
              printf '\n=== family=%s size=%s stage=%s stack=%s status=%s ===\n' "$family" "$size" "$stage" "$stack" "$status"
              cat /tmp/probe.stdout
              cat /tmp/probe.stderr
            } >> "$RAW"
          }

          for family in mixed literals vars balanced_mixed; do
            for size in 100 500 1000 1500 2000 2500 3000 4000; do
              for stage in parse prepare compress full; do
                run_one "$family" "$size" "$stage" 8192
              done
            done
          done

          for family in mixed literals vars balanced_mixed; do
            for size in 3000 4000 6000; do
              run_one "$family" "$size" compress 32768
              run_one "$family" "$size" full 32768
            done
          done

          cat "$OUT"

      - name: Summarize measurements
        shell: bash
        run: |
          python3 - <<'PY'
          import csv
          from collections import defaultdict

          path = '/tmp/swc-long-concat-results.tsv'
          rows = list(csv.DictReader(open(path), delimiter='\t'))
          print('family\tstage\tstack_kb\tmax_success\tfirst_failure\tmax_wall_s\tmax_rss_kb')
          groups = defaultdict(list)
          for row in rows:
              groups[(row['family'], row['stage'], row['stack_kb'])].append(row)
          for key, group in sorted(groups.items()):
              group.sort(key=lambda r: int(r['size']))
              successes = [r for r in group if r['status'] == '0']
              failures = [r for r in group if r['status'] != '0']
              max_success = max((int(r['size']) for r in successes), default=None)
              first_failure = min((int(r['size']) for r in failures), default=None)
              walls = [float(r['wall_s']) for r in successes if r['wall_s'] != 'NA']
              rss = [int(r['max_rss_kb']) for r in successes if r['max_rss_kb'] != 'NA']
              print('\t'.join(map(str, [*key, max_success, first_failure, max(walls, default=None), max(rss, default=None)])))
          PY

      - name: Upload measurement receipt
        uses: actions/upload-artifact@v4
        with:
          name: swc-long-concat-scaling
          path: |
            /tmp/identity.tsv
            /tmp/swc-long-concat-results.tsv
            /tmp/swc-long-concat-raw.log
          retention-days: 7
