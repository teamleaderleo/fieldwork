name: MCP v2 release reconnect probe

on:
  pull_request:
    branches: [main]
    paths:
      - 'campaigns/0004-mcp-streamable-http-reconnect/lanes/L02-reconnect-budget-terminal-state/probe/**'
      - '.github/workflows/mcp-v2-release-reconnect-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-probe:
    name: release-probe-node-${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    defaults:
      run:
        working-directory: campaigns/0004-mcp-streamable-http-reconnect/lanes/L02-reconnect-budget-terminal-state/probe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: campaigns/0004-mcp-streamable-http-reconnect/lanes/L02-reconnect-budget-terminal-state/probe/package.json
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm test
