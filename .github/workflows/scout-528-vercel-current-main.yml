name: Scout 528 Vercel clean-source acceptance

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vercel-clean-source-deadline:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          repository: teamleaderleo/ai
          ref: 5fa70d44a06c2f84f03ae3c5c98326a72a0500e9
          path: target
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: target/pnpm-lock.yaml

      - name: Verify exact source identity and fence
        working-directory: target
        run: |
          test "$(git rev-parse HEAD)" = "5fa70d44a06c2f84f03ae3c5c98326a72a0500e9"
          git fetch --no-tags --depth=1 origin 1bec07d118baccb985f893e96ea0a1860063f4dc
          git diff --check 1bec07d118baccb985f893e96ea0a1860063f4dc HEAD
          mapfile -t changed < <(git diff --name-only 1bec07d118baccb985f893e96ea0a1860063f4dc HEAD | sort)
          expected=(
            .changeset/quiet-snails-own.md
            packages/ai/src/generate-video/core-video-operation-deadline.test.ts
            packages/ai/src/generate-video/generate-video.ts
          )
          test "${changed[*]}" = "${expected[*]}"

      - name: Install locked workspace
        working-directory: target
        run: pnpm install --frozen-lockfile

      - name: Check formatting and lint
        working-directory: target
        run: pnpm run check

      - name: Check TypeScript
        working-directory: target
        run: pnpm run type-check:full

      - name: Check repository consistency
        working-directory: target
        run: pnpm konsistent

      - name: Build workspace packages
        working-directory: target
        run: pnpm run build:packages

      - name: Check AI bundle size
        working-directory: target/packages/ai
        run: pnpm run check-bundle-size

      - name: Run Node deadline and compatibility suites
        working-directory: target
        run: |
          pnpm -C packages/ai exec vitest --config vitest.node.config.js --run \
            src/generate-video/core-video-operation-deadline.test.ts \
            src/generate-video/generate-video.test.ts

      - name: Run Edge deadline and compatibility suites
        working-directory: target
        run: |
          pnpm -C packages/ai exec vitest --config vitest.edge.config.js --run \
            src/generate-video/core-video-operation-deadline.test.ts \
            src/generate-video/generate-video.test.ts

      - name: Retain exact accepted source
        uses: actions/upload-artifact@v4
        with:
          name: vercel-clean-source-deadline-5fa70d44
          path: |
            target/.changeset/quiet-snails-own.md
            target/packages/ai/src/generate-video/generate-video.ts
            target/packages/ai/src/generate-video/core-video-operation-deadline.test.ts
          if-no-files-found: error

# Retained exact-head acceptance. Completed green on run 31102253443.
