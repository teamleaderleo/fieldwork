name: Campaign 86 canonical delta review

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/campaign-86-canonical-delta-review.yml

permissions:
  contents: write

jobs:
  repair-and-publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: campaign/86-authority-fallback-classifier
          fetch-depth: 0
          persist-credentials: true
      - run: |
          git config user.name fieldwork-ci
          git config user.email fieldwork-ci@users.noreply.github.com
      - name: Canonicalize authority delta input
        run: |
          python3 - <<'PY'
          from pathlib import Path

          classifier = Path('campaigns/0006-authority-aware-capability-fallback/artifacts/classify_fallback.py')
          text = classifier.read_text(encoding='utf-8')
          old = '''    normalized: list[dict[str, str]] = []
          for item in raw:
              if not isinstance(item, dict):
                  raise ValueError("each authority delta must be an object")
              field = item.get("field")
              relation = item.get("relation")
              if not isinstance(field, str) or not field:
                  raise ValueError("authority delta field must be a non-empty string")
              if relation not in ALLOWED_RELATIONS:
                  raise ValueError(f"unsupported relation for {field}: {relation!r}")
              normalized.append({"field": field, "relation": relation})

          normalized.sort(key=lambda item: (item["field"], item["relation"]))
          return normalized
          '''.replace('          ', '')
          new = '''    relations_by_field: dict[str, str] = {}
          for item in raw:
              if not isinstance(item, dict):
                  raise ValueError("each authority delta must be an object")
              field = item.get("field")
              relation = item.get("relation")
              if not isinstance(field, str) or not field:
                  raise ValueError("authority delta field must be a non-empty string")
              if relation not in ALLOWED_RELATIONS:
                  raise ValueError(f"unsupported relation for {field}: {relation!r}")
              existing = relations_by_field.get(field)
              if existing is not None:
                  if existing == relation:
                      continue
                  raise ValueError(
                      f"conflicting authority relations for {field}: {existing!r} and {relation!r}"
                  )
              relations_by_field[field] = relation

          return [
              {"field": field, "relation": relation}
              for field, relation in sorted(relations_by_field.items())
          ]
          '''.replace('          ', '')
          if text.count(old) != 1:
              raise SystemExit('normalize_deltas anchor changed')
          classifier.write_text(text.replace(old, new, 1), encoding='utf-8')

          workflow = Path('.github/workflows/campaign-86-authority-fallback-classifier.yml')
          text = workflow.read_text(encoding='utf-8')
          anchor = '''          git diff --check
          '''.replace('          ', '')
          checks = '''          python3 - <<'PY'
          import copy
          import importlib.util
          import json
          from pathlib import Path

          path = Path('campaigns/0006-authority-aware-capability-fallback/artifacts')
          spec = importlib.util.spec_from_file_location('fallback_classifier', path / 'classify_fallback.py')
          module = importlib.util.module_from_spec(spec)
          assert spec.loader is not None
          spec.loader.exec_module(module)

          base = json.loads((path / 'review_cases.json').read_text())[2]
          original = module.classify(base)
          duplicate = copy.deepcopy(base)
          duplicate['authority_deltas'].append(copy.deepcopy(duplicate['authority_deltas'][0]))
          repeated = module.classify(duplicate)
          assert repeated.decision == original.decision
          assert repeated.named_delta_codes == original.named_delta_codes
          assert repeated.authority_delta_digest == original.authority_delta_digest

          conflicting = copy.deepcopy(base)
          conflicting['authority_deltas'].append({
              'field': conflicting['authority_deltas'][0]['field'],
              'relation': 'changed',
          })
          try:
              module.classify(conflicting)
          except ValueError as error:
              assert 'conflicting authority relations' in str(error)
          else:
              raise AssertionError('conflicting authority relations must be rejected')
          PY
          git diff --check
          '''.replace('          ', '')
          if text.count(anchor) != 1:
              raise SystemExit('classifier workflow check anchor changed')
          workflow.write_text(text.replace(anchor, checks, 1), encoding='utf-8')
          PY
      - name: Execute full matrix and normalization controls
        run: |
          path=campaigns/0006-authority-aware-capability-fallback/artifacts
          python3 -m py_compile "$path/classify_fallback.py"
          for matrix in cases review_cases; do
            python3 "$path/classify_fallback.py" \
              --cases "$path/${matrix}.json" \
              --output "/tmp/${matrix}-results.json"
          done
          python3 - <<'PY'
          import copy
          import importlib.util
          import json
          from pathlib import Path
          path = Path('campaigns/0006-authority-aware-capability-fallback/artifacts')
          spec = importlib.util.spec_from_file_location('fallback_classifier', path / 'classify_fallback.py')
          module = importlib.util.module_from_spec(spec)
          assert spec.loader is not None
          spec.loader.exec_module(module)
          base = json.loads((path / 'review_cases.json').read_text())[2]
          original = module.classify(base)
          duplicate = copy.deepcopy(base)
          duplicate['authority_deltas'].append(copy.deepcopy(duplicate['authority_deltas'][0]))
          repeated = module.classify(duplicate)
          assert repeated.to_json() == original.to_json()
          conflicting = copy.deepcopy(base)
          conflicting['authority_deltas'].append({
              'field': conflicting['authority_deltas'][0]['field'],
              'relation': 'changed',
          })
          try:
              module.classify(conflicting)
          except ValueError:
              pass
          else:
              raise AssertionError('conflicting authority relations must be rejected')
          PY
          git diff --check
      - name: Publish reviewed branch
        run: |
          rm -f .github/workflows/campaign-86-canonical-delta-review.yml
          git diff --check
          git add -A
          git commit -m 'campaign 86: canonicalize authority delta receipts'
          git push origin HEAD:campaign/86-authority-fallback-classifier
