name: Fieldwork malformed authority time repair

on:
  pull_request:
    paths:
      - ".github/workflows/fieldwork-malformed-authority-time.yml"
      - "playgrounds/EXP-20260731-observed-generation/repairs/0001-fail-closed-malformed-authority-time.patch"
      - "playgrounds/EXP-20260731-observed-generation/test_malformed_authority_time_patch.py"
      - "playgrounds/EXP-20260731-observed-generation/MALFORMED_AUTHORITY_TIME.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repair:
    name: Python 3.12 exact-source repair
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact Fieldwork repair
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Validate patch applicability
        run: >-
          git apply --check
          playgrounds/EXP-20260731-observed-generation/repairs/0001-fail-closed-malformed-authority-time.patch

      - name: Execute reversing controls
        working-directory: playgrounds/EXP-20260731-observed-generation
        run: python -m unittest -v test_malformed_authority_time_patch.py

      - name: Compile and check diff hygiene
        run: |
          python -m py_compile \
            playgrounds/EXP-20260731-observed-generation/test_malformed_authority_time_patch.py
          git diff --check
