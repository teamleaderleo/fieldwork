name: Execute global uv lock requirements hint

on:
  pull_request:
    branches:
      - execution/uv-lock-hint-global-base
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      UV_BASE: b358fb6fce199fb1977913d310ddb6d573e44031
      SOURCE_BASE: 49e2fc5c821bb69a528308a036b17446bb5ab5a6
      SOURCE_COMMIT: 51c9fe109f037d084fd17647dc78a6451c2938f2
      REFINEMENT_COMMIT: 4ed19c3304feba7cdb574927355851b25048bd50
    steps:
      - name: Check out Fieldwork carrier
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          path: carrier

      - name: Verify carrier boundary
        shell: bash
        working-directory: carrier
        run: |
          set -euo pipefail
          git diff --name-only "${{ github.event.pull_request.base.sha }}"..."${{ github.event.pull_request.head.sha }}" | sort > "$RUNNER_TEMP/carrier-files.txt"
          printf '%s\n' execution/uv-lock-hint-global.txt > "$RUNNER_TEMP/expected-carrier-files.txt"
          diff -u "$RUNNER_TEMP/expected-carrier-files.txt" "$RUNNER_TEMP/carrier-files.txt"

      - name: Check out exact public uv source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: astral-sh/uv
          ref: ${{ env.UV_BASE }}
          fetch-depth: 0
          path: uv

      - name: Check out exact refinement
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: teamleaderleo/uv
          ref: ${{ env.REFINEMENT_COMMIT }}
          fetch-depth: 1
          sparse-checkout: scripts/fieldwork/refine-uv-lock-requirements-hint.py
          sparse-checkout-cone-mode: false
          path: refinement

      - name: Generate and fence exact source
        shell: bash
        working-directory: uv
        run: |
          set -euo pipefail
          git fetch https://github.com/teamleaderleo/uv "$SOURCE_BASE" "$SOURCE_COMMIT"
          git diff "$SOURCE_BASE" "$SOURCE_COMMIT" -- . ':(exclude)Cargo.lock' > "$RUNNER_TEMP/source-without-lock.patch"
          git apply --3way --whitespace=error-all "$RUNNER_TEMP/source-without-lock.patch"
          python ../refinement/scripts/fieldwork/refine-uv-lock-requirements-hint.py
          git add -N crates/uv/tests/pip_install/uv_lock_requirements_hint.rs
          cargo fmt --all
          cargo check -p uv-requirements -p uv
          git diff --name-only | sort > "$RUNNER_TEMP/source-files.txt"
          cat > "$RUNNER_TEMP/expected-source-files.txt" <<'EOF'
          Cargo.lock
          crates/uv-requirements/Cargo.toml
          crates/uv-requirements/src/specification.rs
          crates/uv/src/commands/diagnostics.rs
          crates/uv/tests/pip_install/main.rs
          crates/uv/tests/pip_install/uv_lock_requirements_hint.rs
          crates/uv/tests/tool/tool_run.rs
          EOF
          diff -u "$RUNNER_TEMP/expected-source-files.txt" "$RUNNER_TEMP/source-files.txt"
          git diff --check
          cargo fmt --all --check
          git diff --stat | tee "$RUNNER_TEMP/source-stat.txt"
          git diff > "$RUNNER_TEMP/source.patch"

      - name: Run focused integration controls
        shell: bash
        working-directory: uv
        run: |
          set -euo pipefail
          cargo test --locked -p uv --test pip_install --features test-python,test-pypi \
            uv_lock_requirements_hint -- --nocapture \
            | tee "$RUNNER_TEMP/pip-focused-tests.txt"
          cargo test --locked -p uv --test tool --features test-python,test-pypi \
            tool_run_with_requirements_has_dedicated_hint -- --nocapture \
            | tee "$RUNNER_TEMP/tool-focused-test.txt"

      - name: Run affected Clippy gates
        shell: bash
        working-directory: uv
        run: |
          set -euo pipefail
          cargo clippy --locked -p uv-requirements -p uv --tests \
            --features test-python,test-pypi -- -D warnings

      - name: Record exact generated tree
        shell: bash
        working-directory: uv
        run: |
          set -euo pipefail
          git diff --check
          git diff --name-only | sort > "$RUNNER_TEMP/source-files-recorded.txt"
          diff -u "$RUNNER_TEMP/expected-source-files.txt" "$RUNNER_TEMP/source-files-recorded.txt"
          git config user.name fieldwork-execution
          git config user.email fieldwork-execution@users.noreply.github.com
          git add \
            Cargo.lock \
            crates/uv-requirements/Cargo.toml \
            crates/uv-requirements/src/specification.rs \
            crates/uv/src/commands/diagnostics.rs \
            crates/uv/tests/pip_install/main.rs \
            crates/uv/tests/pip_install/uv_lock_requirements_hint.rs \
            crates/uv/tests/tool/tool_run.rs
          git commit -m "fix: hint when uv lockfiles are used as requirements"
          git rev-parse HEAD | tee "$RUNNER_TEMP/source-head.txt"
          git rev-parse HEAD^{tree} | tee "$RUNNER_TEMP/source-tree.txt"

      - name: Retain receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: uv-lock-hint-global-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/carrier-files.txt
            ${{ runner.temp }}/source-files.txt
            ${{ runner.temp }}/source-files-recorded.txt
            ${{ runner.temp }}/source-stat.txt
            ${{ runner.temp }}/source.patch
            ${{ runner.temp }}/pip-focused-tests.txt
            ${{ runner.temp }}/tool-focused-test.txt
            ${{ runner.temp }}/source-head.txt
            ${{ runner.temp }}/source-tree.txt
          if-no-files-found: warn
          retention-days: 14
