decisions:
  adopt_now:
    - one keyed graph core with typed relationship classes
    - readiness DAG separated from causal history
    - clean and incremental evaluator equivalence tests
    - reverse-reachability affected calculation
    - semantic change pruning
    - queue as generated virtual materialized view
    - policy evaluator and policy revision as inputs
    - explanation traces
    - read-only PR and scheduled reconciliation workflows
  adapt_later:
    - attestation-shaped interoperable receipts
    - persistent incremental evaluation cache
    - durable Stensibly event replay
    - federated target-repository execution receipts
    - GitHub environment or custom protection gates for exact protected effects
    - risk-based queue ordering
  reject_for_first_slice:
    - automatic issue or label mutation
    - automatic claiming or dispatch
    - automatic merge deployment or upstream contact
    - Git diff as the complete change model
    - workflow-run status as canonical truth
    - one giant DAG for readiness and history
    - full distributed differential-dataflow infrastructure
    - heuristic prioritization replacing deterministic checks
